services:
  platform:
    build: .
    ports:
      - "5000:5000"
    environment:
      - ConnectionStrings__Postgres=Host=postgres;Database=platform;Username=postgres;Password=postgres
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      # postgres:18+ rejects a volume mounted directly at .../data (docker-library
      # PR #1259) — mount the PARENT dir so the image manages its version subdir.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-READY", "pg_isready"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:

<h2 style="font-size:22px;color:#333333;margin:0 0 16px 0;">Reset Your Password</h2>
<p style="font-size:15px;color:#333333;line-height:1.6;margin:0 0 8px 0;">We received a request to reset the password for <strong>{{UserEmail}}</strong>.</p>
<p style="font-size:14px;color:#666666;line-height:1.6;margin:0 0 24px 0;">Click the button below to set a new password. This link expires in <strong>{{ExpiresIn}}</strong>.</p>
<table cellpadding="0" cellspacing="0" border="0" style="margin-bottom:24px;">
  <tr>
    <td>
      <a href="{{ResetLink}}" style="display:inline-block;background-color:{{PrimaryColor}};color:#ffffff;text-decoration:none;padding:12px 28px;border-radius:4px;font-size:14px;font-weight:bold;">Reset Password</a>
    </td>
  </tr>
</table>
<p style="font-size:13px;color:#999999;line-height:1.5;margin:0;">If you did not request a password reset, you can safely ignore this email. Your password will not be changed.</p>

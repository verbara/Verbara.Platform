<h2 style="font-size:22px;color:#333333;margin:0 0 16px 0;">Welcome to {{CompanyName}}!</h2>
<p style="font-size:15px;color:#333333;line-height:1.6;margin:0 0 16px 0;">Your account has been created. Here are your login credentials:</p>
<table cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color:#f5f5f5;border-radius:4px;margin-bottom:24px;">
  <tr>
    <td style="padding:16px;">
      <p style="margin:0 0 8px 0;font-size:14px;color:#555555;"><strong>Email:</strong> {{UserEmail}}</p>
      <p style="margin:0;font-size:14px;color:#555555;"><strong>Temporary Password:</strong> {{TempPassword}}</p>
    </td>
  </tr>
</table>
<p style="font-size:14px;color:#666666;line-height:1.6;margin:0 0 24px 0;">For security, please change your password after your first login.</p>
<table cellpadding="0" cellspacing="0" border="0">
  <tr>
    <td>
      <a href="{{LoginUrl}}" style="display:inline-block;background-color:{{PrimaryColor}};color:#ffffff;text-decoration:none;padding:12px 28px;border-radius:4px;font-size:14px;font-weight:bold;">Log In Now</a>
    </td>
  </tr>
</table>

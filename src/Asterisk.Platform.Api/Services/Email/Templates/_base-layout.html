<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{CompanyName}}</title>
</head>
<body style="margin:0;padding:0;background-color:#f5f5f5;font-family:Arial,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f5f5f5;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <!-- Card -->
        <table width="600" cellpadding="0" cellspacing="0" border="0" style="background-color:#ffffff;border-radius:8px;overflow:hidden;max-width:600px;">

          <!-- Header -->
          <tr>
            <td style="background-color:{{PrimaryColor}};padding:24px 32px;">
              <table width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td>
                    {{#if LogoUrl}}
                    <img src="{{LogoUrl}}" alt="{{CompanyName}}" height="40" style="display:block;border:0;" />
                    {{/if}}
                    <span style="color:#ffffff;font-size:20px;font-weight:bold;display:block;margin-top:4px;">{{CompanyName}}</span>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Content -->
          <tr>
            <td style="padding:32px;">
              {{Content}}
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="background-color:#f9f9f9;padding:20px 32px;border-top:1px solid #e0e0e0;">
              <table width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="font-size:12px;color:#888888;text-align:center;">
                    <p style="margin:0 0 4px 0;">&copy; {{CompanyName}}</p>
                    {{#if SupportEmail}}
                    <p style="margin:0 0 4px 0;">Support: <a href="mailto:{{SupportEmail}}" style="color:#888888;">{{SupportEmail}}</a></p>
                    {{/if}}
                    {{#if SupportUrl}}
                    <p style="margin:0;"><a href="{{SupportUrl}}" style="color:#888888;">Help Center</a></p>
                    {{/if}}
                  </td>
                </tr>
              </table>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>

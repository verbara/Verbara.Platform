# nginx-loadbalancer.conf — sits in front of N platform-api replicas
# during 4-replica jwt-sweep / multi-replica smoke testing.
#
# Why nginx and not Traefik: this is benchmark-purpose only — we want the
# fewest moving parts between the load generator (NBomber) and the API.
# nginx with a static upstream is well-understood, has near-zero overhead,
# and Docker's embedded DNS gives us all replica IPs at upstream-resolve
# time. For a production deployment Traefik / HAProxy / cloud LB are the
# right call (TLS termination, dynamic discovery, observability).
#
# This config intentionally:
# - Disables access logs (high-rate sweep would flood the disk).
# - Discards the error log: nginx adds the request line, the upstream URL and
#   the Referer, query strings included (the SSE stream's ?token=, an OIDC
#   code=), to every message it logs while it handles a request, at every
#   level. Guarded by
#   tests/Verbara.Platform.Governance.Tests/NginxGatewayAccessLogTests.cs.
# - Uses keepalive 64 to avoid TCP setup cost on the LB → backend hop.
# - Applies a 60 s read timeout so a saturated backend pile-up surfaces
#   as an upstream timeout (not a phantom client error) in NBomber output.
# - Does NOT do TLS — the sweep targets http://localhost:5000 directly.

upstream platform_api {
    # Docker embedded DNS expands `platform-api` to all 4 replica IPs at
    # nginx start-up. Round-robin is the default; switch to `least_conn`
    # if you want to favor the least-busy replica (matters once Argon2id
    # makes replica wall-time variable).
    server platform-api:5000 max_fails=0;
    keepalive 64;
}

server {
    listen 80 default_server;

    # Disable access logs to keep disk + log noise off the hot path.
    access_log off;
    # And the error log: every message about a request carries its URL, query included.
    error_log /dev/null;

    location / {
        proxy_pass         http://platform_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";

        # Preserve client headers the API relies on (X-Tenant-Id, Authorization,
        # X-Forwarded-* for accurate audit logging).
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}

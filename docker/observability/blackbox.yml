modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      preferred_ip_protocol: ip4
      valid_status_codes: [200, 201, 204]

  http_health:
    prober: http
    timeout: 5s
    http:
      preferred_ip_protocol: ip4
      # /health runs no check and returns 200. /health/ready returns 200 when every
      # readiness check is Healthy or Degraded, and 503 when one is Unhealthy
      # (Platform/ADR-0025). Accepting 503 means this module proves the Api answers,
      # not that it is ready. During staging the dialer-engine grace window expects
      # 503 to be tolerated.
      valid_status_codes: [200, 503]

  tcp_connect:
    prober: tcp
    timeout: 5s

  http_2xx_or_redirect:
    prober: http
    timeout: 5s
    http:
      preferred_ip_protocol: ip4
      valid_status_codes: [200, 201, 204, 301, 302, 303, 307, 308]

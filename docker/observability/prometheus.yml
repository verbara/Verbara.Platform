global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: platform-api
    metrics_path: /metrics
    static_configs:
      - targets: [platform-api:5000]

  - job_name: node-exporter
    static_configs:
      - targets: [node-exporter:9100]

  # Health journeys — accept 200 (Healthy) and 503 (Degraded during dialer-engine
  # grace window). Without 503-acceptance the alert fires every fresh deploy.
  - job_name: blackbox-http-health
    metrics_path: /probe
    params:
      module: [http_health]
    static_configs:
      - targets:
          - http://platform-api:5000/health
          - http://platform-api:5000/health/ready
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # TCP-reachability journeys — confirm the surrounding services answer at the
  # transport layer even when their HTTP/AMI/ARI surface is auth-gated.
  - job_name: blackbox-tcp-journeys
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - postgres:5432       # Database reachable
          - asterisk:5038       # AMI listener
          - asterisk:8088       # ARI HTTP
          - asterisk:5060       # SIP TCP fallback (if Asterisk binds; UDP-only deploys see this fail)
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

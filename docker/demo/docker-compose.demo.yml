services:
  postgres:
    image: postgres:18-alpine
    volumes:
      - pgdata:/var/lib/postgresql
      - ./sql:/demo-sql:ro
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-verbara}
      POSTGRES_USER: ${POSTGRES_USER:-platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-platform_demo}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  asterisk:
    build:
      context: ..
      dockerfile: Dockerfile.asterisk
    environment:
      - EXTERNAL_IP=${EXTERNAL_IP:-}
      - AMI_PASSWORD=${AMI_PASSWORD:-platform_secret}
      - ARI_PASSWORD=${ARI_PASSWORD:-platform_secret}
    ports:
      - "5038:5038"
      - "5060:5060/udp"
      - "8088:8088"
      - "8089:8089"
      - "8180:8180"
      - "20000-20050:20000-20050/udp"
    volumes:
      - ../asterisk-config:/etc/asterisk
      - ./demo-overrides/extensions.conf:/etc/asterisk/extensions.conf:ro
      - ./demo-overrides/res_config_pgsql.conf:/etc/asterisk/res_config_pgsql.conf:ro
      - ./demo-overrides/ari.conf:/etc/asterisk/ari.conf:ro
      - ./demo-overrides/manager.conf:/etc/asterisk/manager.conf:ro
      - ./certs/asterisk.pem:/etc/asterisk/keys/asterisk.pem:ro
      - ./certs/asterisk.key:/etc/asterisk/keys/asterisk.key:ro
      - ./moh:/var/lib/asterisk/moh:ro
      - ./sounds/es-custom:/var/lib/asterisk/sounds/es-custom:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "asterisk", "-rx", "core show version"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  pstn-emulator:
    build:
      context: .
      dockerfile: Dockerfile.demo-pstn
    volumes:
      - ./asterisk-config-pstn/extensions.conf:/etc/asterisk/extensions.conf:ro
      - ./asterisk-config-pstn/pjsip.conf:/etc/asterisk/pjsip.conf:ro
      - ./asterisk-config-pstn/modules.conf:/etc/asterisk/modules.conf:ro
      - ./asterisk-config-pstn/manager.conf:/etc/asterisk/manager.conf:ro
    depends_on:
      asterisk:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "asterisk", "-rx", "core show version"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  platform-api:
    build:
      context: ../..
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_HOSTBUILDER__RELOADCONFIGONCHANGE: "false"
      HostOptions__BackgroundServiceExceptionBehavior: Ignore
      # Licensing__EnforcementMode is [Obsolete] in Pro v2.4.0-pro; removal in v2.5.0-pro.
      # Kept `Disabled` for demo back-compat; LogLevel filter suppresses event 12001.
      Licensing__EnforcementMode: Disabled
      Logging__LogLevel__Verbara.Sdk.Pro.Licensing.LicensingDeprecationHostedService: Warning
      ConnectionStrings__Postgres: Host=postgres;Database=verbara;Username=platform;Password=${POSTGRES_PASSWORD:-platform_demo}
      ConnectionStrings__Cluster: Host=postgres;Database=verbara;Username=platform;Password=${POSTGRES_PASSWORD:-platform_demo}
      ConnectionStrings__Analytics: Host=postgres;Database=verbara;Username=platform;Password=${POSTGRES_PASSWORD:-platform_demo}
      ConnectionStrings__Dialer: Host=postgres;Database=verbara;Username=platform;Password=${POSTGRES_PASSWORD:-platform_demo}
      Asterisk__Ami__Hostname: asterisk
      Asterisk__Ami__Port: "5038"
      Asterisk__Ami__Username: platform
      Asterisk__Ami__Password: ${AMI_PASSWORD:-platform_demo}
      Asterisk__Ari__BaseUrl: http://asterisk:8088
      Asterisk__Ari__Username: verbara
      Asterisk__Ari__Password: ${ARI_PASSWORD:-platform_demo}
      Asterisk__Ari__Application: verbara
      Redis__ConnectionString: redis:6379
      Services__ServiceKey: demo-service-key-2026
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      asterisk:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5000/metrics || curl -sf http://localhost:5000/health || true"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s
    restart: unless-stopped

  web:
    build:
      context: ../../../Verbara.Platform.Web
      dockerfile: Dockerfile
      args:
        VITE_DEFAULT_TENANT_ID: demo
    ports:
      - "80:80"
    depends_on:
      platform-api:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: demo
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/contact-center.json
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./grafana/provisioning/dashboards/contact-center.json:/var/lib/grafana/dashboards/contact-center.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  pgdata:

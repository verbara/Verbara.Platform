[general]
static = no
writeprotect = no
clearglobalvars = no

[globals]

; ============================================================
; DEFAULT CONTEXT — extensions register here
; ============================================================
[default]
; IVR entry → local Asterisk
exten => 200,1,Goto(ivr-empresa,s,1)

; Feature codes → local
exten => *72,1,Set(DB(CF/${CALLERID(num)})=${EXTEN:3})
 same => n,Playback(beep)
 same => n,Hangup()
exten => *73,1,Set(DB_DELETE(CF/${CALLERID(num)})=)
 same => n,Playback(beep)
 same => n,Hangup()
exten => *67,1,Set(CALLERID(name-pres)=prohib)
 same => n,Set(CALLERID(num-pres)=prohib)
 same => n,Playback(beep)
 same => n,Hangup()
exten => *69,1,Set(LAST=${DB(LASTCALLER/${CALLERID(num)})})
 same => n,GotoIf($["${LAST}" = ""]?nodata)
 same => n,Dial(PJSIP/${LAST},30)
 same => n,Hangup()
 same => n(nodata),Playback(vm-norecord)
 same => n,Hangup()
exten => *78,1,Set(DB(DND/${CALLERID(num)})=yes)
 same => n,Playback(beep)
 same => n,Hangup()
exten => *79,1,Set(DB_DELETE(DND/${CALLERID(num)})=)
 same => n,Playback(beep)
 same => n,Hangup()

; Parking → local
exten => 700,1,Answer()
 same => n,Park(default)
 same => n,Hangup()

; Conference → local
exten => 800,1,Answer()
 same => n,ConfBridge(800,default_bridge,default_user)
 same => n,Hangup()

; PSTN outbound → local trunk routing
exten => _100X,1,Dial(PJSIP/${EXTEN}@pstn-trunk,30)
 same => n,Hangup()
exten => 1010,1,Dial(PJSIP/1010@pstn-trunk,30)
 same => n,Hangup()

; Queue shortcuts → local
exten => 100,1,Answer()
 same => n,Queue(sales,,,,300)
 same => n,Hangup()
exten => 101,1,Answer()
 same => n,Queue(support,,,,300)
 same => n,Hangup()

; Everything else (2XXX, 3XXX, etc.) → Stasis (Platform tracks)
exten => _X.,1,Stasis(asterisk_platform)
 same => n,Hangup()

; ============================================================
; INBOUND FROM PSTN EMULATOR → Stasis (Platform tracks)
; ============================================================
[from-pstn]
exten => _X.,1,Stasis(asterisk_platform,inbound,${EXTEN})
 same => n,Hangup()

; ============================================================
; INTERNAL (Platform ARI originated calls)
; ============================================================
[from-internal]
exten => _X.,1,Stasis(asterisk_platform,internal,${EXTEN})
 same => n,Hangup()

; ============================================================
; AGENT ASSIST (AudioSocket for STT)
; ============================================================
[agentassist]
exten => audiosocket,1,AudioSocket(${AUDIOSOCKET_UUID},${AUDIOSOCKET_HOST}:9092)
 same => n,Hangup()

; ============================================================
; IVR QUEUE DESTINATIONS (local Asterisk queues)
; ============================================================
[queues]
exten => sales,1,Answer()
 same => n,Queue(sales,,,,300)
 same => n,Hangup()
exten => support,1,Answer()
 same => n,Queue(support,,,,300)
 same => n,Hangup()
exten => ventas-nuevos,1,Answer()
 same => n,Queue(ventas-nuevos,,,,300)
 same => n,Hangup()
exten => ventas-existentes,1,Answer()
 same => n,Queue(ventas-existentes,,,,300)
 same => n,Hangup()
exten => soporte-urgente,1,Answer()
 same => n,Queue(soporte-urgente,,,,300)
 same => n,Hangup()
exten => soporte-general,1,Answer()
 same => n,Queue(soporte-general,,,,300)
 same => n,Hangup()
exten => facturacion,1,Answer()
 same => n,Queue(facturacion,,,,300)
 same => n,Hangup()
exten => rrhh,1,Answer()
 same => n,Queue(rrhh,,,,300)
 same => n,Hangup()

; ============================================================
; SPANISH IVR — Main Menu
; ============================================================
[ivr-empresa]
exten => s,1,Answer()
 same => n,Set(IVR_RETRIES=0)
 same => n,Background(es-custom/ivr-main-greeting)
 same => n,WaitExten(10)
exten => 1,1,Goto(ivr-ventas,s,1)
exten => 2,1,Goto(ivr-soporte,s,1)
exten => 3,1,Goto(ivr-facturacion-menu,s,1)
exten => 4,1,Goto(queues,rrhh,1)
exten => 9,1,Goto(ivr-empresa,s,1)
exten => i,1,Playback(option-is-invalid)
 same => n,Set(IVR_RETRIES=$[${IVR_RETRIES}+1])
 same => n,GotoIf($[${IVR_RETRIES}<3]?s,2)
 same => n,Hangup()
exten => t,1,Set(IVR_RETRIES=$[${IVR_RETRIES}+1])
 same => n,GotoIf($[${IVR_RETRIES}<3]?s,2)
 same => n,Hangup()


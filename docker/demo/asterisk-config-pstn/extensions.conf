[general]
static = yes

[from-pbx]
; 1001: Normal answer with greeting
exten => 1001,1,Answer()
 same => n,Playback(hello-world)
 same => n,Wait(5)
 same => n,Playback(goodbye)
 same => n,Hangup()

; 1002: Busy signal
exten => 1002,1,Busy(10)
 same => n,Hangup()

; 1003: No answer (ring 30s then hangup)
exten => 1003,1,Ringing()
 same => n,Wait(30)
 same => n,Hangup()

; 1004: Network congestion
exten => 1004,1,Congestion(10)
 same => n,Hangup()

; 1005: Voicemail simulation
exten => 1005,1,Answer()
 same => n,Wait(3)
 same => n,Playback(vm-intro)
 same => n,Playback(beep)
 same => n,Wait(10)
 same => n,Hangup()

; 1006: DTMF digit test (echos back)
exten => 1006,1,Answer()
 same => n,Playback(beep)
 same => n,Read(DIGITS,,4,,,5)
 same => n,SayDigits(${DIGITS})
 same => n,Hangup()

; 1007: Simple IVR
exten => 1007,1,Answer()
 same => n,Background(press-1&or&press-2)
 same => n,WaitExten(5)
exten => 1,1,Playback(you-entered)
 same => n,SayDigits(1)
 same => n,Hangup()
exten => 2,1,Playback(you-entered)
 same => n,SayDigits(2)
 same => n,Hangup()

; 1008: Long call (5 minutes MusicOnHold)
exten => 1008,1,Answer()
 same => n,MusicOnHold(default,300)
 same => n,Hangup()

; 1009: Echo test
exten => 1009,1,Answer()
 same => n,Echo()
 same => n,Hangup()

; 1010: Quick answer and hangup
exten => 1010,1,Answer()
 same => n,Playback(beep)
 same => n,Hangup()

[from-internal]
; Outbound to main PBX (for originating test calls)
exten => _X.,1,Dial(PJSIP/${EXTEN}@trunk-main,60)
 same => n,Hangup()

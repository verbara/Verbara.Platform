[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

; Receive calls from the main demo Asterisk
[pbx-trunk]
type = endpoint
context = from-pbx
disallow = all
allow = ulaw,alaw
rtp_symmetric = yes
force_rport = yes
direct_media = no
callerid = "PSTN Gateway" <5551000000>

[pbx-trunk-identify]
type = identify
endpoint = pbx-trunk
match = 172.16.0.0/12

; Outbound to main demo Asterisk
[trunk-main]
type = endpoint
context = from-internal
disallow = all
allow = ulaw,alaw
rtp_symmetric = yes
force_rport = yes
direct_media = no

[trunk-main-aor]
type = aor
contact = sip:asterisk:5060
qualify_frequency = 30

[trunk-main-identify]
type = identify
endpoint = trunk-main
match = asterisk

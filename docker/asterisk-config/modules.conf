[modules]
autoload = yes

; PostgreSQL and sorcery must load before any realtime-dependent module
preload = res_config_pgsql.so
preload = res_sorcery_config.so
preload = res_sorcery_memory.so
preload = res_sorcery_memory_cache.so
preload = res_sorcery_realtime.so

; Drivers we don't use (using pgsql instead)
noload = res_config_odbc.so
noload = res_odbc.so
noload = res_config_ldap.so
noload = res_config_sqlite3.so

; Legacy channel drivers
noload = chan_sip.so
noload = chan_skinny.so
noload = chan_mgcp.so
noload = chan_alsa.so
noload = chan_console.so

; HEP/Homer (needs hep.conf we don't have)
noload = res_hep.so
noload = res_hep_pjsip.so
noload = res_hep_rtcp.so

; Outbound PJSIP registration (not needed — Platform controls trunk registration)
noload = res_pjsip_outbound_registration.so

; Config wizard (needs pjsip_wizard.conf we don't have)
noload = res_pjsip_config_wizard.so

; Modules missing config files (noise + potential crash)
noload = chan_iax2.so
noload = res_stun_monitor.so
noload = res_smdi.so
noload = res_aeap.so
noload = res_statsd.so

; Phoneprov (needs phoneprov.conf)
noload = res_phoneprov.so
noload = res_pjsip_phoneprov_provider.so

; CDR/CEL backends we don't use (Platform uses EventStore)
noload = cdr_pgsql.so
noload = cdr_odbc.so
noload = cdr_adaptive_odbc.so
noload = cdr_sqlite3_custom.so
noload = cdr_csv.so
noload = cel_pgsql.so
noload = cel_odbc.so
noload = cel_sqlite3_custom.so

; Missing libraries / not needed in container
noload = format_ogg_vorbis.so
noload = res_adsi.so
noload = app_adsiprog.so
noload = app_getcpeid.so
noload = pbx_ael.so

[general]
; Docker compose maps 20000-20200. Each channel takes an RTP/RTCP port pair, so 201 ports are
; about 100 channels: about 50 calls when each is bridged to an agent (two channels per call).
; For higher capacity, expand both here AND in docker-compose port mappings, or set
; RTP_PORT_START / RTP_PORT_END, which entrypoint-asterisk.sh writes here at start-up.
; Production with host networking can use the full 20000-21999 range
rtpstart = 20000
rtpend = 20200
strictrtp = yes
icesupport = true

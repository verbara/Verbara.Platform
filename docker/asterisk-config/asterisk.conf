[directories]
astetcdir => /etc/asterisk
astmoddir => /usr/lib/asterisk/modules
astvarlibdir => /var/lib/asterisk
astdbdir => /var/lib/asterisk
astkeydir => /var/lib/asterisk
astdatadir => /var/lib/asterisk
astagidir => /var/lib/asterisk/agi-bin
astspooldir => /var/spool/asterisk
astrundir => /var/run/asterisk
astlogdir => /var/log/asterisk

[options]
runuser = asterisk
rungroup = asterisk
; Open files. A container starts with a soft limit of 1024 descriptors, and each call holds
; several (SIP, two RTP/RTCP pairs, and the snoop and AudioSocket channels when Agent Assist
; listens): measured, about 57 Agent Assist calls filled 1009 of the 1024 and the next calls
; were refused with "Too many open files". Asterisk sets this limit itself at start-up.
maxfiles = 65536

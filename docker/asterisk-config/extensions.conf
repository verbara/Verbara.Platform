[from-trunk]
exten => _X.,1,Stasis(verbara,inbound,${EXTEN})
 same => n,Hangup()

[from-internal]
exten => _X.,1,Stasis(verbara,internal,${EXTEN})
 same => n,Hangup()

; dialer-places-calls-end-to-end (design D11) — a forward for campaign rows still on Pro's default dialplan
; context (a campaign created before [dialer-answered] shipped and Active across the upgrade): its answered leg
; lands here with Exten = the dialed number and is sent on to [dialer-answered] with that same number.
[default]
exten => _X.,1,Goto(dialer-answered,${EXTEN},1)
exten => _+X.,1,Goto(dialer-answered,${EXTEN},1)

[agentassist]
exten => audiosocket,1,AudioSocket(${AUDIOSOCKET_UUID},${AUDIOSOCKET_HOST}:9092)
 same => n,Hangup()

; Phase 2.2/2.3 — inbound voice delivery target. StasisInboundConsumer answers the
; call, resolves tenant (TENANT_ID channel var) + DID → did_route → queue, sets the
; QUEUE_NAME channel variable to the Asterisk realtime queue name ({tenantId}-{queueName}),
; then continues the channel here to the fixed extension "s". Using a constant extension
; + a variable (instead of putting the queue name in EXTEN and pattern-matching it) means
; the dialplan can never miss a hyphenated / mixed-case / non-numeric queue name and
; silently drop the call after Answer — Queue(${QUEUE_NAME}) routes whatever name was set.
[stasis-queue]
exten => s,1,Queue(${QUEUE_NAME})
 same => n,Hangup()

; dialer-places-calls-end-to-end (design D11) — the answered leg of an outbound dialer campaign call. The Pro
; dialer's originate builder (DefaultOriginateBuilder) sends the customer leg with Context = the campaign's
; DialplanContext ("dialer-answered", set by the API on create), Exten = the normalized dialed number (digits,
; one leading + kept when the stored number has it) and the channel variable DIALER_CAMPAIGN_ID; its dialplan runs
; only once the customer answers. The two patterns are the whole Exten contract, the pair [outbound-agent] uses.
; StasisInboundConsumer (campaign phase) reads TENANT_ID off the leg, loads the campaign tenant-scoped, sets
; QUEUE_NAME to the campaign's target queue and continues the leg into [stasis-queue]; any step it cannot resolve
; (no target queue included) hangs the call up with a warning.
[dialer-answered]
exten => _X.,1,Stasis(verbara,campaign,${DIALER_CAMPAIGN_ID})
 same => n,Hangup()
exten => _+X.,1,Stasis(verbara,campaign,${DIALER_CAMPAIGN_ID})
 same => n,Hangup()

; Phase 3B.2c — blind transfer to another agent. VoiceCallControlService sets the
; TRANSFER_TARGET channel variable to the resolved agent endpoint (PJSIP/{tenant}-agent-{id})
; then AMI-Redirects the customer leg here to the fixed extension "s". Same constant-extension +
; variable pattern as [stasis-queue] so an arbitrary endpoint id can never miss a pattern match.
; (Transfer-to-queue reuses [stasis-queue]; transfer-to-external is added with the outbound
; dialplan in 3B.2d.)
[transfer-agent]
exten => s,1,Dial(${TRANSFER_TARGET})
 same => n,Hangup()

; Phase 3B.2d — outbound click-to-dial. AgentOutboundDialService AMI-Originates the AGENT endpoint
; (PJSIP/{tenant}-agent-{id}) as the A-leg into this context with Exten = the dialed number and the
; channel vars TRUNK (the resolved trunk's Asterisk endpoint id, t-{id} — never the trunk's name) +
; TRUNK_HOST (the trunk's dial host: its registration URI's host[:port], else its single-address
; MatchHost) + OUTBOUND_CALLERID (the tenant outbound caller ID, empty → trunk default) +
; VERBARA_OUTBOUND_ID (the pre-created Conversation id the bridge correlates on). When the agent's
; softphone answers, Asterisk dials the customer over the trunk with an explicit sip: URI to the trunk
; host (the trunk sync writes no AOR contact, so the dial string has to name the address), presenting
; the tenant caller ID as both number and name. External blind transfer (3B.2d.4) reuses this same
; context by Redirecting the customer leg here with Exten = the external number. A number with a
; leading + matches _+X. and is dialed with its + (outbound-calls-reach-the-trunk, design D5-D7). The
; two extensions are written out in full: a Goto to a fixed extension would change ${EXTEN}.
[outbound-agent]
exten => _X.,1,Set(CALLERID(num)=${OUTBOUND_CALLERID})
 same => n,Set(CALLERID(name)=${OUTBOUND_CALLERID})
 same => n,Dial(PJSIP/${TRUNK}/sip:${EXTEN}@${TRUNK_HOST})
 same => n,Hangup()
exten => _+X.,1,Set(CALLERID(num)=${OUTBOUND_CALLERID})
 same => n,Set(CALLERID(name)=${OUTBOUND_CALLERID})
 same => n,Dial(PJSIP/${TRUNK}/sip:${EXTEN}@${TRUNK_HOST})
 same => n,Hangup()

; csat-completion (Platform/ADR-0020) — shared voice CSAT survey-IVR context. After an answered
; call wraps up, the voice-CSAT path AMI-Redirects the CALLER (customer) leg here with the channel
; vars SURVEY_ID (the active survey) + SURVEY_TOKEN (the Platform-minted voice-leg capture token the
; POST /api/v1/csat/responses/voice endpoint verifies). Like [stasis-queue] / [transfer-agent] this is
; a SINGLE STATIC context SHARED across tenants — per-tenant survey configuration (prompt template,
; sampling) is resolved from the queue CsatConfig + Asterisk Realtime DB, NOT a per-tenant rendered
; file (design D5). The Pro voice adapter drives the leg in-process: TtsPromptCache synthesizes the
; localized rating prompt and DtmfCollector reads the caller's 1-5 digit off the AMI DtmfEnd stream
; scoped to this channel, then submits the capture via the ICsatVoiceCaptureSink seam. The dialplan
; keeps the answered leg alive on the fixed extension "s" for the bounded collection window; the
; in-process adapter hangs the leg up when it has collected a rating or the window elapses.
[survey-ivr]
exten => s,1,Answer()
 same => n,Wait(30)
 same => n,Hangup()

; supervisor-silent-listen (Platform/ADR-0042, design D1) — a supervisor's silent audio listen.
; SupervisorListenService AMI-Originates the SUPERVISOR's destination into this context with
; ChannelId = the listen id (so the supervisor leg's uniqueid IS the listen id) and the channel
; variable SPY_TARGET = the uniqueid of the agent's live leg. Extension "endpoint" rings the
; supervisor's receive-only listen endpoint (only the console's UA answers it); extension "phone"
; rings the admin-stored listen phone over a trunk and spies only after the answering party presses
; 1 within 10 s, so voicemail or an IVR can never record the call.
; ChanSpy options are LITERALS here, never data: q = no beep and no name announcement, E = exit when
; the agent's leg hangs up (call end, blind transfer), S = return at once if the target is gone,
; u = SPY_TARGET is an exact channel uniqueid. Leaving out w / W / B makes it listen-only: the
; spying channel is never heard by the agent or the customer. o is left out so the supervisor hears
; both parties. r (recording) is never used. A future audio coach or barge is a new extension with
; one more option letter (w or B) and its own API mode — never "whisper", which names the text feature.
[supervisor-listen]
; Fail closed: ChanSpy() with an empty target spies on every channel, so an empty SPY_TARGET hangs up first.
exten => endpoint,1,GotoIf($["${SPY_TARGET}" = ""]?nospy)
 same => n,ChanSpy(${SPY_TARGET},qESu)
 same => n(nospy),Hangup()
exten => phone,1,GotoIf($["${SPY_TARGET}" = ""]?nospy)
 same => n,Read(LISTEN_CONFIRM,,1,,1,10)
 same => n,GotoIf($["${LISTEN_CONFIRM}" = "1"]?spy)
 same => n(nospy),Hangup()
 same => n(spy),ChanSpy(${SPY_TARGET},qESu)
 same => n,Hangup()

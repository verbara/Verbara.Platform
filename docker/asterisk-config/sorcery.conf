[res_pjsip]
; Named memory caches — 5000 objects, 900s (15 min) lifetime
; Eliminates ~95% of DB queries during call processing
endpoint/cache = memory_cache,name=pjsip_endpoint_cache,maximum_objects=5000,object_lifetime_maximum=900,expire_on_reload=yes
endpoint = realtime,ps_endpoints

auth/cache = memory_cache,name=pjsip_auth_cache,maximum_objects=5000,object_lifetime_maximum=900,expire_on_reload=yes
auth = realtime,ps_auths

aor/cache = memory_cache,name=pjsip_aor_cache,maximum_objects=5000,object_lifetime_maximum=900,expire_on_reload=yes
aor = realtime,ps_aors

; Contacts in astdb — avoids Postgres churn on every REGISTER cycle
contact = astdb,registrator

registration = realtime,ps_registrations

; Transports are static (from pjsip.conf)
transport = config,pjsip.conf,1

[res_pjsip_endpoint_identifier_ip]
; IP-based endpoint identification for PSTN trunks
identify = realtime,ps_endpoint_id_ips

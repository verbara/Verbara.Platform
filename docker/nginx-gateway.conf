# nginx-gateway reverse-proxy config — mirrors the K8s Cilium HTTPRoute
# topology so the frontend connects to a single host whether it runs in
# docker-compose or in K8s. See ADR-0022 Phase A.
#
#   - /hubs/*        → realtime:5030  (SignalR WebSocket)
#   - /api/*         → platform-api:5000  (REST + /api/v1/internal)
#   - everything else → web:80  (React SPA, served by nginx inside the web image)
#
# Backups for K8s parity: `proxy_http_version 1.1` + `Upgrade`/`Connection`
# headers preserve the WebSocket handshake; long `proxy_read_timeout` lets
# SignalR keep idle connections alive without the gateway dropping them.
#
# Logs without query strings: the SSE stream (?token=) and the SignalR hub
# (id=, access_token=) carry credentials in the query, and so does a Referer
# (the reset page's ?token=). This file is included inside the image's http
# block, and a server inherits the image's logs unless it declares its own, so
# every server block below must declare both:
#   - access_log in verbara_noquery, which keeps the path ($uri) and only the
#     path part of the Referer (the image's "main" logs $request, the raw
#     request line, query included);
#   - error_log /dev/null. nginx adds the request line, the upstream URL and
#     the Referer, queries included, to every message it logs while it handles
#     a request, at every level: a failed proxied request (error), a response
#     or request body buffered to a temporary file (warn), a temporary file it
#     cannot write (crit), worker_connections exhausted (alert). No directive
#     changes that text. The image's own error log still gets the master
#     process's messages (start-up, reloads, a worker that exits), and a failed
#     request still shows in the access log with its status (502, 504).
# The web image's nginx logs the raw request line and Referer, so `location /`
# passes it neither query: the console reads the reset link's token in the
# browser. /api/ and /hubs/ pass the query on: the SSE stream and the hub
# authenticate with it.
# Guarded by tests/Verbara.Platform.Governance.Tests/NginxGatewayAccessLogTests.cs.
map $http_referer $verbara_referer_path {
  default "";
  "~^(?<p>[^?#]*)" $p;
}

log_format verbara_noquery '$remote_addr - $remote_user [$time_local] '
                           '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                           '"$verbara_referer_path" "$http_user_agent"';

upstream realtime { server realtime:5030; }
upstream api      { server platform-api:5000; }
upstream web      { server web:80; }

server {
  listen 80;
  server_name _;

  access_log /var/log/nginx/access.log verbara_noquery;
  error_log /dev/null;

  client_max_body_size 50m;

  location /hubs/ {
    proxy_pass http://realtime;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location /api/ {
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
  }

  location /health {
    proxy_pass http://api;
    proxy_set_header Host $host;
  }

  location / {
    # Drop the query; nginx re-escapes the rewritten path it sends upstream.
    rewrite ^ $uri? break;
    proxy_pass http://web;
    proxy_set_header Host $host;
    proxy_set_header Referer $verbara_referer_path;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}

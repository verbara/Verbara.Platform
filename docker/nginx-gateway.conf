# nginx-gateway reverse-proxy config — mirrors the K8s Cilium HTTPRoute
# topology so the frontend connects to a single host whether it runs in
# docker-compose or in K8s. See ADR-0022 Phase A.
#
#   - /hubs/*        → realtime:5030  (SignalR WebSocket)
#   - /api/*         → platform-api:5000  (REST + /api/v1/internal)
#   - everything else → web:80  (React SPA, served by nginx inside the web image)
#
# Backups for K8s parity: `proxy_http_version 1.1` + `Upgrade`/`Connection`
# headers preserve the WebSocket handshake; long `proxy_read_timeout` lets
# SignalR keep idle connections alive without the gateway dropping them.
#
# Access log without query strings: the SSE stream (?token=) and the SignalR
# hub (id=, access_token=) carry credentials in the query, and so does a
# Referer (the reset page's ?token=). The log keeps the path ($uri) and only
# the path part of the Referer. This file is included inside the image's http
# block, whose default format "main" logs $request (the raw request line,
# query included), and a server inherits that format unless it declares its
# own access_log — so every server block below must declare one.
# Guarded by tests/Verbara.Platform.Governance.Tests/NginxGatewayAccessLogTests.cs.
map $http_referer $verbara_referer_path {
  default "";
  "~^(?<p>[^?#]*)" $p;
}

log_format verbara_noquery '$remote_addr - $remote_user [$time_local] '
                           '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                           '"$verbara_referer_path" "$http_user_agent"';

upstream realtime { server realtime:5030; }
upstream api      { server platform-api:5000; }
upstream web      { server web:80; }

server {
  listen 80;
  server_name _;

  access_log /var/log/nginx/access.log verbara_noquery;

  client_max_body_size 50m;

  location /hubs/ {
    proxy_pass http://realtime;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location /api/ {
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
  }

  location /health {
    proxy_pass http://api;
    proxy_set_header Host $host;
  }

  location / {
    proxy_pass http://web;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}

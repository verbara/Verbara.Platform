# docker/docker-compose.smb.yml — SMB tier production-ready stack.
#
# This is the canonical "single-instance Platform" deployment for SMB
# customers (1 platform-api + 1 postgres + 1 asterisk + 1 web + 1
# renderer + 1 mail). It is the stack that `capacity-planning.md` § "Small
# tier" promises, with the Postgres + Npgsql tuning required to hold
# that promise under concurrent burst (ADR-0015 Phase 1 mitigation for
# the NpgsqlDataSource sprawl).
#
# Stack matrix:
#   docker-compose.full.yml         — dev/loadtest stack (lax tuning)
#   docker-compose.smb.yml          — SMB tier production-ready (THIS FILE)
#   docker-compose.production.yml   — alias of smb.yml + .env.production secrets
#   docker-compose.scale.yml        — Enterprise tier 4-replica overlay
#   docker-compose.demo.yml         — pre-seeded demo environment
#
# Usage:
#   docker compose -f docker/docker-compose.full.yml \
#                  -f docker/docker-compose.smb.yml up -d --wait
#
# This composes-on-top-of `docker-compose.full.yml`: only the diffs
# (Postgres tuning + connection-string pool sizing) live here. Layered
# composition keeps the SMB tier and the dev stack visibly different
# without duplicating service definitions.
#
# Capacity envelope (post-Phase-2, single platform-api instance):
#   - Postgres: max_connections=200, shared_buffers=512MB,
#     effective_cache_size=2GB
#   - Npgsql shared pool: Maximum Pool Size=10, Minimum=2, Idle=300s
#   - 1 shared NpgsqlDataSource × 10 conns = ~10 conn demand (post-Phase-2)
#   - max_connections=200 is operator headroom: capacity-planning.md tier
#     minimum drops to 50 post-Phase-2; 200 absorbs ad-hoc psql sessions,
#     migrations, and replication slots without retuning
#   - See ADR-0015 for Phase 1 (per-pool sizing, kept as safety net) +
#     Phase 2 (Pro 1.16.0-pro shared NpgsqlDataSource — current state)
#
# References:
#   - ADR-0014 (Auth horizontal scaling baseline) — amended 2026-04-28
#   - ADR-0015 (NpgsqlDataSource sharing strategy)
#   - docs/operations/capacity-planning.md § "Small tier"
#   - docs/operations/load-test-baseline.md § "Phase C-L SMB tier"

services:
  platform-api:
    environment:
      # ADR-0015 Phase 2 — explicit pool sizing on the shared NpgsqlDataSource
      # (Pro 1.16.0-pro overload, v1.14.6). Phase 1's per-pool sprawl is
      # eliminated; this connection string now drives ONE pool serving all
      # 14 stores. ConnectionStringDefaults in Program.cs would apply the
      # same defaults if absent — specifying here is belt-and-suspenders
      # + makes the tuning visible in operator-facing config.
      ConnectionStrings__Postgres: "Host=postgres;Database=platform;Username=platform;Password=${POSTGRES_PASSWORD:-platform_secret};Maximum Pool Size=10;Minimum Pool Size=2;Connection Idle Lifetime=300;Pooling=true"

  postgres:
    # ADR-0015 Phase 2 — max_connections=200 is operator headroom over the
    # post-Phase-2 demand (1 shared pool × 10 = ~10 conns per platform-api).
    # capacity-planning.md tier minimum dropped from 200 → 50 with the
    # shared NpgsqlDataSource overload; 200 is retained to absorb ad-hoc
    # psql sessions, migrations, and replication without retuning.
    # shared_buffers / effective_cache_size sized for SMB tier hardware
    # (16 GB RAM target per capacity-planning.md § "Small").
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=2GB

# docker/docker-compose.production.yml — SMB tier production-ready stack.
#
# Same shape as docker-compose.smb.yml (single platform-api + single
# postgres + ancillary services) but reads its environment from
# .env.production instead of compose-inline values. Use this for actual
# customer deployments; use smb.yml for pre-production validation against
# a known config.
#
# Capacity envelope: see ADR-0015 Phase 2 + docs/operations/capacity-planning.md
# § "Small tier". Post-Phase-2 (Platform v1.14.6 + Pro 1.16.0-pro shared
# NpgsqlDataSource overload), all stores share ONE pool per platform-api
# instance — real demand is 1 × 10 = 10 conns + ancillary. max_connections=200
# is intentional operator headroom (capacity-planning.md tier minimum is 50).
#
# Operators MUST set the following in .env.production:
#   - ConnectionStrings__Postgres with Maximum Pool Size=10 (or
#     accept the ConnectionStringDefaults fallback in Program.cs)
#   - POSTGRES_PASSWORD (rotate from default)
#   - SERVICE_KEY (rotate from default)

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "100m"
    max-file: "5"

services:
  platform-api:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
      renderer:
        condition: service_healthy
      mail:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  renderer:
    build:
      context: ..
      dockerfile: src/Verbara.Platform.Renderer/Dockerfile.renderer
    env_file:
      - .env.production
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5010/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  mail:
    build:
      context: ..
      dockerfile: src/Verbara.Platform.Mail/Dockerfile.mail
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5020/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:18-alpine
    # ADR-0015 Phase 2 — SMB tier production tuning. With the shared
    # NpgsqlDataSource overload (Pro 1.16.0-pro, v1.14.6), platform-api
    # demand collapses to ~10 conns; max_connections=200 is operator
    # headroom (tier minimum is 50 per capacity-planning.md § "Small").
    # shared_buffers / effective_cache_size sized for 16 GB RAM SMB tier.
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=2GB
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: verbara
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-platform_secret}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 2G

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
    profiles:
      - cluster

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
    profiles:
      - s3

volumes:
  pgdata:
  miniodata:

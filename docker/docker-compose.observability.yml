# R5.5 P0L.3 — observability side-stack scraping docker-compose.full.yml services.
# Run AFTER docker-compose.full.yml is up. Joins the same Docker network so
# Prometheus can resolve `platform-api`, `postgres`, `redis`, etc. by service name.
networks:
  default:
    external: true
    name: docker_default

# Default container log rotation. Same anchor as `docker-compose.full.yml`
# — prevents `/var/lib/docker` fill during long-running observability
# scrapes (Prometheus retention 30d + Loki ingestion).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "100m"
    max-file: "5"

services:
  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: r55-prometheus
    logging: *default-logging
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../docs/operations/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 6

  grafana:
    image: grafana/grafana:11.5.2
    container_name: r55-grafana
    logging: *default-logging
    environment:
      GF_SECURITY_ADMIN_PASSWORD: r55-staging
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observability/grafana-provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  loki:
    image: grafana/loki:3.3.2
    container_name: r55-loki
    logging: *default-logging
    volumes:
      - ./observability/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  node-exporter:
    image: prom/node-exporter:v1.9.0
    container_name: r55-node-exporter
    logging: *default-logging
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    ports:
      - "9100:9100"

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.26.0
    container_name: r55-blackbox-exporter
    logging: *default-logging
    volumes:
      - ./observability/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    ports:
      - "9115:9115"

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: r55-alertmanager
    logging: *default-logging
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"

volumes:
  prometheus-data: {}
  grafana-data: {}
  loki-data: {}

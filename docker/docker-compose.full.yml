services:
  asterisk:
    build:
      context: .
      dockerfile: Dockerfile.asterisk
    environment:
      EXTERNAL_IP: ${EXTERNAL_IP:-}
    volumes:
      - ./asterisk-config:/etc/asterisk
      - recordings:/var/spool/asterisk/recording
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
      - "8088:8088"
      - "8089:8089"
      - "8180:8180"
      - "5038:5038"
      - "9092:9092"
      - "20000-20200:20000-20200/udp"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "asterisk", "-rx", "core show version"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  platform-api:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: Host=postgres;Database=platform;Username=platform;Password=${POSTGRES_PASSWORD:-platform_secret}
      Asterisk__Ami__Hostname: asterisk
      Asterisk__Ami__Port: "5038"
      Asterisk__Ami__Username: platform
      Asterisk__Ami__Password: ${AMI_PASSWORD:-platform_secret}
      Asterisk__Ari__BaseUrl: http://asterisk:8088
      Asterisk__Ari__Username: asterisk-platform
      Asterisk__Ari__Password: ${ARI_PASSWORD:-asterisk_ari_secret}
      Asterisk__Ari__Application: asterisk-platform
      Recordings__BasePath: /recordings
      Licensing__EnforcementMode: Disabled
      CORS_ORIGINS: http://localhost
      Services__Renderer__BaseUrl: http://renderer:5010
      Services__Mail__BaseUrl: http://mail:5020
      Services__ServiceKey: ${SERVICE_KEY:-platform_internal_secret}
    volumes:
      - recordings:/recordings
    depends_on:
      asterisk:
        condition: service_healthy
      postgres:
        condition: service_healthy
      renderer:
        condition: service_healthy
      mail:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  renderer:
    build:
      context: ..
      dockerfile: src/Asterisk.Platform.Renderer/Dockerfile.renderer
    environment:
      ASPNETCORE_URLS: http://+:5010
      Services__ServiceKey: ${SERVICE_KEY:-platform_internal_secret}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5010/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  mail:
    build:
      context: ..
      dockerfile: src/Asterisk.Platform.Mail/Dockerfile.mail
    environment:
      ASPNETCORE_URLS: http://+:5020
      ConnectionStrings__Postgres: Host=postgres;Database=platform;Username=platform;Password=${POSTGRES_PASSWORD:-platform_secret}
      Smtp__Host: ${SMTP_HOST:-localhost}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__UseTls: ${SMTP_USE_TLS:-false}
      Smtp__FromAddress: ${SMTP_FROM:-reports@platform.local}
      Smtp__FromName: ${SMTP_FROM_NAME:-Platform Reports}
      Services__ServiceKey: ${SERVICE_KEY:-platform_internal_secret}
      Microsoft__ClientId: ${MS_CLIENT_ID:-}
      Microsoft__TenantId: ${MS_TENANT_ID:-common}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5020/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: ../../Asterisk.Platform.Web
      dockerfile: Dockerfile
      args:
        VITE_DEFAULT_TENANT_ID: platform
    ports:
      - "80:80"
    depends_on:
      platform-api:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: platform
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-platform_secret}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    profiles: [cluster]

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    volumes: [miniodata:/data]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports: ["9000:9000", "9001:9001"]
    restart: unless-stopped
    profiles: [s3]

volumes:
  pgdata:
  recordings:
  miniodata:

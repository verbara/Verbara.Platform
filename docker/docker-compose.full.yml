# Default container log rotation. Without this Docker's `json-file` driver
# never rotates, and a sustained-load run (the R5.5 D-L 24h soak measured
# ~150 GB/h on platform-api alone) fills `/var/lib/docker` and degrades the
# host. Anchored once and applied per-service so a host without a properly
# configured `/etc/docker/daemon.json` still gets rotation.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "100m"
    max-file: "5"

services:
  asterisk:
    build:
      context: .
      dockerfile: Dockerfile.asterisk
      args:
        ASTERISK_VERSION: ${ASTERISK_VERSION:-22}
    logging: *default-logging
    environment:
      EXTERNAL_IP: ${EXTERNAL_IP:-}
      AMI_PASSWORD: ${AMI_PASSWORD:-platform_secret}
      ARI_PASSWORD: ${ARI_PASSWORD:-platform_secret}
    volumes:
      - ./asterisk-config:/etc/asterisk
      - recordings:/var/spool/asterisk/recording
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
      - "8088:8088"
      - "8089:8089"
      - "8180:8180"
      - "5038:5038"
      - "9092:9092"
      - "20000-20200:20000-20200/udp"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "asterisk", "-rx", "core show version"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  platform-api:
    build:
      context: ..
      dockerfile: Dockerfile
      secrets:
        - nuget_auth_token
    logging: *default-logging
    ports:
      - "5000:5000"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: Host=postgres;Database=verbara;Username=platform;Password=${POSTGRES_PASSWORD:-platform_secret}
      Asterisk__Ami__Hostname: asterisk
      Asterisk__Ami__Port: "5038"
      Asterisk__Ami__Username: platform
      Asterisk__Ami__Password: ${AMI_PASSWORD:-platform_secret}
      Asterisk__Ari__BaseUrl: http://asterisk:8088
      Asterisk__Ari__Username: verbara
      Asterisk__Ari__Password: ${ARI_PASSWORD:-asterisk_ari_secret}
      Asterisk__Ari__Application: verbara
      Recordings__BasePath: /recordings
      # Pro v2.5.0-pro: Licensing__EnforcementMode is GONE (ADR-0012). License
      # presence drives behaviour — set Licensing__LicenseFilePath to a mounted
      # .lic to enable Pro features; leave empty/unset for community / OSS mode
      # where Pro endpoints respond HTTP 402 + RFC 9457 ProblemDetails. Free
      # endpoints (auth, queues, conversations, channels) are unaffected.
      # Migration docs: https://verbara.io/docs/migration/pro-v240-v250-licensing
      CORS_ORIGINS: http://localhost
      Services__Renderer__BaseUrl: http://renderer:5010
      Services__Mail__BaseUrl: http://mail:5020
      Services__ServiceKey: ${SERVICE_KEY:-platform_internal_secret}
      # Opt-in Redis-backed MFA + password-reset caches. Uncomment to enable —
      # requires the `identity-redis` profile (or `cluster` profile) to start the
      # Redis service. Without this variable the Platform falls back to the
      # in-memory caches (single-instance safe).
      # ConnectionStrings__IdentityRedis: redis:6379
    volumes:
      - recordings:/recordings
    depends_on:
      asterisk:
        condition: service_healthy
      postgres:
        condition: service_healthy
      renderer:
        condition: service_healthy
      mail:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  renderer:
    build:
      context: ..
      dockerfile: src/Verbara.Platform.Renderer/Dockerfile.renderer
      secrets:
        - nuget_auth_token
    logging: *default-logging
    environment:
      ASPNETCORE_URLS: http://+:5010
      Services__ServiceKey: ${SERVICE_KEY:-platform_internal_secret}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5010/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  realtime:
    build:
      context: ..
      dockerfile: src/Verbara.Platform.Realtime/Dockerfile.realtime
      secrets:
        - nuget_auth_token
    logging: *default-logging
    environment:
      ASPNETCORE_URLS: http://+:5030
      ASPNETCORE_ENVIRONMENT: Production
      # Leader election reads Cluster, falling back to Postgres. Without either, startup throws
      # "ConnectionStrings:Cluster (or :Postgres fallback) is required for leader election" and the
      # container crash-loops. Same database platform-api uses.
      ConnectionStrings__Postgres: Host=postgres;Database=verbara;Username=platform;Password=${POSTGRES_PASSWORD:-platform_secret}
      # Pro.Push Redis backplane + SignalR backplane share the same Redis.
      # NOT optional: StackExchange.Redis aborts on connect failure, so a realtime container that
      # cannot reach Redis dies at Host.StartAsync. Redis is therefore a default service with a
      # depends_on below rather than a profile-gated one.
      ConnectionStrings__Redis: redis:6379
      ConnectionStrings__IdentityRedis: redis:6379
      Services__ServiceKey: ${SERVICE_KEY:-platform_internal_secret}
      Services__PlatformApi__BaseUrl: http://platform-api:5000
      Asterisk__ClusterNodeId: ${ASTERISK_CLUSTER_NODE_ID:-realtime-1}
    depends_on:
      platform-api:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5030/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  mail:
    build:
      context: ..
      dockerfile: src/Verbara.Platform.Mail/Dockerfile.mail
      secrets:
        - nuget_auth_token
    logging: *default-logging
    environment:
      ASPNETCORE_URLS: http://+:5020
      ConnectionStrings__Postgres: Host=postgres;Database=verbara;Username=platform;Password=${POSTGRES_PASSWORD:-platform_secret}
      Smtp__Host: ${SMTP_HOST:-localhost}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__UseTls: ${SMTP_USE_TLS:-false}
      Smtp__FromAddress: ${SMTP_FROM:-reports@platform.local}
      Smtp__FromName: ${SMTP_FROM_NAME:-Platform Reports}
      Services__ServiceKey: ${SERVICE_KEY:-platform_internal_secret}
      Microsoft__ClientId: ${MS_CLIENT_ID:-}
      Microsoft__TenantId: ${MS_TENANT_ID:-common}
      # AddPlatformMail resolves HmacCsatReplyTokenSigner eagerly, so an empty value throws
      # "The value cannot be an empty string (Parameter 'signingSecret')" at Host.StartAsync. mail is
      # a health-gated dependency of platform-api, so that took the whole stack down.
      Imap__TokenSigningSecret: ${CSAT_REPLY_TOKEN_SECRET:-local_dev_csat_reply_token_secret}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5020/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: ../../Verbara.Platform.Web
      dockerfile: Dockerfile
      args:
        VITE_DEFAULT_TENANT_ID: platform
    logging: *default-logging
    # Port 80 is now owned by nginx-gateway (ADR-0022 Phase A) which fronts
    # web + platform-api + realtime under a single hostname. Web stays
    # internal-only so /hubs/* + /api/* paths reach the right upstream.
    depends_on:
      platform-api:
        condition: service_healthy
    restart: unless-stopped

  nginx-gateway:
    image: nginx:1.27-alpine
    logging: *default-logging
    ports:
      - "80:80"
    volumes:
      - ./nginx-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      platform-api:
        condition: service_healthy
      realtime:
        condition: service_healthy
      web:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    logging: *default-logging
    # ADR-0015 — bump max_connections=200 (vs alpine default 100) to give
    # the dev/loadtest stack headroom. Post-Phase-2 (Pro 1.16.0-pro shared
    # NpgsqlDataSource), Platform.Api opens ONE pool not 14, so real demand
    # is ~10 conns; the dev stack keeps 200 for parity with smb.yml + ad-hoc
    # tooling. For the SMB tier production-ready stack with explicit pool
    # sizing in the connection string, layer docker-compose.smb.yml on top:
    #
    #   docker compose -f docker/docker-compose.full.yml \
    #                  -f docker/docker-compose.smb.yml up -d --wait
    command:
      - postgres
      - -c
      - max_connections=200
    volumes:
      - pgdata:/var/lib/postgresql
    environment:
      POSTGRES_DB: verbara
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-platform_secret}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    logging: *default-logging
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No profile: realtime hard-depends on this (StackExchange.Redis aborts on connect failure), and
    # realtime is in the default set, so gating Redis behind `cluster`/`identity-redis` made the
    # default `up` crash-loop.

  minio:
    image: minio/minio
    logging: *default-logging
    command: server /data --console-address ":9001"
    volumes: [miniodata:/data]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports: ["9000:9000", "9001:9001"]
    restart: unless-stopped
    profiles: [s3]

# Consumed by the .NET builds above to restore the private Verbara.Sdk.Pro.* packages from
# GitHub Packages. Sourced from an env var rather than a file so no token ever sits in the repo:
#   export NUGET_AUTH_TOKEN=<GitHub PAT with read:packages>
# The Dockerfiles mount it with required=false, so builds needing only public packages still
# work without it; without it a Pro-dependent build fails with NU1301 / 401 Unauthorized.
secrets:
  nuget_auth_token:
    environment: NUGET_AUTH_TOKEN

volumes:
  pgdata:
  recordings:
  miniodata:

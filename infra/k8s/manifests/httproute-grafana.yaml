# HTTPRoute for Grafana via Cilium Gateway.
# Replaces the orphaned `prometheus-grafana` legacy Ingress in the
# monitoring namespace (same pattern as the api/web fix shipped in
# commit ce17edc0 — Cilium has gatewayAPI.enabled=true without
# ingressController, so the legacy Ingress was never picked up).
#
# Applied 2026-05-17 during Phase 0LK gap-fix follow-up. NOT yet
# folded into the kube-prometheus-stack values (that lives outside
# the Verbara repo); standalone manifest until the observability
# install.sh wraps a values override.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
spec:
  parentRefs:
    - name: platform-gateway
      namespace: default
      sectionName: http
  hostnames:
    - grafana.r55.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: prometheus-grafana
          port: 80

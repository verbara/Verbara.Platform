apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: r55-platform-rules
  namespace: monitoring
  labels:
    release: prometheus
spec:
  groups:
    # =================================================================
    # P0 — page on-call. Customer impact or imminent platform outage.
    # =================================================================
    - name: platform_p0_critical
      interval: 30s
      rules:

        - alert: PlatformApiUnavailable
          expr: up{job="platform-api"} == 0
          for: 2m
          labels:
            severity: P0
            service: platform-api
          annotations:
            summary: "Platform API instance {{ $labels.instance }} unreachable"
            description: "Prometheus has been unable to scrape platform-api on {{ $labels.instance }} for 2 minutes. Customer-facing API is down."
            runbook_url: "alerts-runbook.md#platformapiunavailable"

        - alert: AuthLoginErrorRateHigh
          expr: |
            (
              sum(rate(http_server_request_duration_seconds_count{route="/auth/login",status_code=~"5.."}[5m]))
              /
              sum(rate(http_server_request_duration_seconds_count{route="/auth/login"}[5m]))
            ) > 0.05
          for: 5m
          labels:
            severity: P0
            service: auth
          annotations:
            summary: "Login 5xx error rate > 5% over 5min"
            description: "More than 5% of /auth/login requests are returning 5xx. Identity store or DataProtection key store likely unhealthy."
            runbook_url: "alerts-runbook.md#authloginerrorratehigh"

        - alert: JwtValidationLatencyP99High
          expr: |
            histogram_quantile(0.99,
              sum by (le) (rate(jwt_key_rotation_duration_bucket[5m]))
            ) > 500
          for: 5m
          labels:
            severity: P0
            service: auth
          annotations:
            summary: "JWT key rotation latency p99 > 500 ms over 5min"
            description: "Per ADR-0009 P0 trigger: JWT validation/rotation latency p99 sustained > 500 ms breaks downstream auth handshakes."
            runbook_url: "alerts-runbook.md#jwtvalidationlatencyp99high"

        - alert: LicenseGuardBlockedHigh
          expr: |
            (
              sum(rate(blocked_total{job=~".*"}[10m]))
              /
              clamp_min(sum(rate(eventstore_events_appended_total[10m])), 1)
            ) > 0.01
          for: 10m
          labels:
            severity: P0
            service: licensing
          annotations:
            summary: "License guard blocking > 1% of pipeline operations over 10min"
            description: "License grace period likely expired or feature toggle revoked. Pipelines (EventStore/Analytics/AgentAssist) are silently dropping work."
            runbook_url: "alerts-runbook.md#licenseguardblockedhigh"

        - alert: RetentionServiceStalled
          expr: |
            (time() - max(retention_duration_ms_count_created)) > 3600
            and
            increase(retention_duration_ms_count[1h]) == 0
          for: 5m
          labels:
            severity: P0
            service: retention
          annotations:
            summary: "RetentionService has not produced any duration samples for > 1h"
            description: "Per ADR-0009 P0 trigger: nightly retention purge did not execute (cron failed / BackgroundService crashed). Storage growth unbounded."
            runbook_url: "alerts-runbook.md#retentionservicestalled"

        - alert: BlackboxJourneyDown
          expr: probe_success == 0
          for: 5m
          labels:
            severity: P0
            service: synthetic
          annotations:
            summary: "Synthetic check {{ $labels.instance }} failing for >5m (P0)"
            description: "Per ADR-0009 P0 trigger: blackbox-exporter probe against {{ $labels.instance }} (job {{ $labels.job }}) failing. Either the target service is unreachable or its TCP/HTTP listener has stopped accepting connections."
            runbook_url: "alerts-runbook.md#blackboxjourneydown"

        - alert: NodeDiskSpaceLow
          expr: |
            (
              node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"}
              /
              node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"}
            ) < 0.10
          for: 5m
          labels:
            severity: P0
            service: host
          annotations:
            summary: "Host disk free < 10% on {{ $labels.instance }} (P0)"
            description: "node-exporter reports < 10% free on root filesystem. Postgres / Redis / Prometheus / Loki all share this volume; sustained low-space leads to checkpoint failures and crash loops."
            runbook_url: "alerts-runbook.md#nodediskspacelow"

    # =================================================================
    # P1 — ticket within 24h. SLO-breach class, no immediate outage.
    # =================================================================
    - name: platform_p1_warning
      interval: 60s
      rules:

        - alert: SloBreachQueueIngestion
          expr: |
            histogram_quantile(0.99,
              sum by (le) (rate(eventstore_persist_duration_ms_bucket[5m]))
            ) > 200
          for: 15m
          labels:
            severity: P1
            service: eventstore
          annotations:
            summary: "EventStore persist p99 > 200 ms (SLO breach) for 15min"
            description: "Queue ingestion SLO breach. Postgres pressure or Pro.EventStore subscriber backlog likely; check eventstore_subscriber_inflight gauge."
            runbook_url: "alerts-runbook.md#slobreachqueueingestion"

        - alert: CircuitBreakerOpen
          expr: max by (key) (circuit_state) == 2
          for: 5m
          labels:
            severity: P1
            service: resilience
          annotations:
            summary: "Resilience circuit '{{ $labels.key }}' open > 5min"
            description: "A keyed ResiliencePolicy is rejecting all traffic. Downstream dependency (channel / Postgres / external provider) likely down."
            runbook_url: "alerts-runbook.md#circuitbreakeropen"

        - alert: PresenceBacklogGrowing
          expr: |
            (push_postgres_backlog - push_postgres_backlog offset 15m) > 100
            and
            push_postgres_backlog > 500
          for: 15m
          labels:
            severity: P1
            service: push-backplane
          annotations:
            summary: "Push backplane backlog growing for 15min (current {{ $value }})"
            description: "Pro.Push.Postgres relay cannot keep up with publish rate. Presence merges + cluster bridge events will lag."
            runbook_url: "alerts-runbook.md#presencebacklogggrowing"

        - alert: AuditWriteLatencyP99High
          expr: |
            histogram_quantile(0.99,
              sum by (le) (rate(http_server_request_duration_seconds_bucket{route=~"/admin/audit.*"}[5m]))
            ) > 1
          for: 15m
          labels:
            severity: P1
            service: audit
          annotations:
            summary: "Audit write/read p99 > 1s for 15min (proxy)"
            description: "Audit pipeline degraded. Compliance evidence may lag. Check IHubAuditSink implementation health."
            runbook_url: "alerts-runbook.md#auditwritelatencyp99high"

        - alert: HealthCheckUnhealthy
          expr: aspnetcore_healthcheck_status == 0
          for: 5m
          labels:
            severity: P1
            service: healthcheck
          annotations:
            summary: "Health check '{{ $labels.name }}' Unhealthy > 5min"
            description: "One of the platform health checks (postgres / asterisk-ami / background-service / pro pipelines) is reporting Unhealthy."
            runbook_url: "alerts-runbook.md#healthcheckunhealthy"

    # =================================================================
    # P2 — review weekly. Capacity / hygiene signals.
    # =================================================================
    - name: platform_p2_info
      interval: 5m
      rules:

        - alert: PgConnectionPoolHigh
          expr: |
            (
              sum(db_client_connections_usage{state="used"})
              /
              sum(db_client_connections_usage{state="max"})
            ) > 0.8
          for: 30m
          labels:
            severity: P2
            service: postgres
          annotations:
            summary: "Postgres connection pool utilization > 80% sustained 30min"
            description: "Capacity warning per ADR-0009. Consider pool resize or query optimisation; review slow query alert correlation."
            runbook_url: "alerts-runbook.md#pgconnectionpoolhigh"

        - alert: SlowQueriesHigh
          expr: |
            (
              sum(rate(db_client_commands_duration_bucket{le="0.5"}[5m]))
              /
              sum(rate(db_client_commands_duration_count[5m]))
            ) < 0.99
          for: 30m
          labels:
            severity: P2
            service: postgres
          annotations:
            summary: "More than 1% of Postgres queries > 500 ms over 30min"
            description: "Capacity / index health warning. Review pg_stat_statements + correlate with retention / live queue writer activity."
            runbook_url: "alerts-runbook.md#slowqueries-high"

        - alert: RetentionDryRunDivergence
          expr: |
            abs(
              sum by (target) (increase(retention_purged_total[1d]))
              -
              sum by (target) (increase(retention_dry_run_would_purge_total[1d]))
            ) > 100
          for: 1h
          labels:
            severity: P2
            service: retention
          annotations:
            summary: "Retention purge counter diverges from dry-run prediction by > 100 rows for target {{ $labels.target }}"
            description: "Either DryRun policy was flipped without operator awareness, or retention windows are inconsistent between targets."
            runbook_url: "alerts-runbook.md#retentiondryrundivergence"

        - alert: LiveQueueWriterErrorWindow
          expr: |
            (
              sum(rate(live_queue_snapshots_write_error_total[15m]))
              /
              clamp_min(sum(rate(live_queue_snapshots_published_total[15m])), 1)
            ) > 0.01
          for: 30m
          labels:
            severity: P2
            service: analytics-live
          annotations:
            summary: "Live queue snapshot writer error rate > 1% over 30min"
            description: "PostgresLiveQueueSnapshotStore upserts failing (timeout / circuit_open / exception). analytics-live-queue-writer health check should reflect."
            runbook_url: "alerts-runbook.md#livequeuewritererrorwindow"

        - alert: RedisMemoryHigh
          expr: |
            (
              redis_memory_used_bytes
              /
              clamp_min(redis_memory_max_bytes, 1)
            ) > 0.75
          for: 1h
          labels:
            severity: P2
            service: redis
          annotations:
            summary: "Redis memory utilization > 75% on {{ $labels.instance }} sustained 1h"
            description: "Capacity warning. JTI revocation cache + presence backplane share Redis; consider TTL tuning or instance resize before maxmemory-policy kicks in."
            runbook_url: "alerts-runbook.md#redismemoryhigh"

    # =================================================================
    # Verbara Pro Licensing alerts (Phase 5.3, paired with the
    # docs/operations/grafana-licensing-panels.md dashboard).
    #
    # Sources:
    #   - Pro `Verbara.Sdk.Pro.Licensing.Guard` meter (license_guard_blocked_total,
    #     license_image_unauthorized_total, license_guard_grace_remaining_seconds)
    #   - kube-state-metrics (kube_pod_container_status_restarts_total,
    #     kube_pod_container_status_last_terminated_reason)
    #   - Loki count_over_time for log-derived signals (WorkerCrash, LicenseException,
    #     ProductionSafetyNet event-id 12002)
    # =================================================================

    # =================================================================
    # P1 K8s-state — alerts derived from kube-state-metrics + CNPG metrics.
    # Added 2026-05-26 from C-LK v2.5.2 chaos findings #2 + #7
    # (docs/operations/chaos-test-report-k8s-local.md). Requires
    # kube-prometheus-stack (kube-state-metrics ServiceMonitor) and
    # CloudNativePG operator metrics endpoint.
    # =================================================================
    - name: platform_k8s_state
      interval: 30s
      rules:

        - alert: DeploymentReplicasUnavailable
          expr: |
            kube_deployment_status_replicas_unavailable{namespace="r55-platform"} > 0
          for: 30s
          labels:
            severity: P1
            service: kubernetes
          annotations:
            summary: "Deployment {{ $labels.deployment }} has unavailable replicas (ns={{ $labels.namespace }})"
            description: |
              `kube_deployment_status_replicas_unavailable` > 0 for 30s on
              {{ $labels.namespace }}/{{ $labels.deployment }}. Likely a probe
              failure, image pull problem, or resource exhaustion. Cross-check
              against `PodNotReadySustained` to see if the same pod is the
              source. Under rolling restarts this fires for ~5s and self-resolves;
              the 30s `for:` should suppress those.
            runbook_url: "alerts-runbook.md#deploymentreplicasunavailable"

        - alert: PodNotReadySustained
          expr: |
            sum by (namespace, pod) (kube_pod_status_ready{condition="false"}) > 0
            unless on (namespace, pod) kube_pod_status_phase{phase=~"Succeeded|Pending"} > 0
          for: 1m
          labels:
            severity: P1
            service: kubernetes
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} NotReady for 1m"
            description: |
              Pod has been NotReady for 60s without being in Pending or Succeeded
              phase — i.e. it's actively running but failing its readiness probe,
              or its container is crash-looping. Tightens stock kube-prometheus
              `KubePodNotReady` (default 15m) for fast detection of probe
              regressions like the v2.5.1 cascade closed by PR #32 (ADR-0025).
            runbook_url: "alerts-runbook.md#podnotreadysustained"

        - alert: CnpgFailoverEvent
          expr: |
            increase(cnpg_failover_total[5m]) > 0
            or
            increase(cnpg_pg_replication_streaming_replicas{state!="streaming"}[5m]) > 0
          labels:
            severity: P1
            service: postgres
          annotations:
            summary: "CloudNativePG failover detected on cluster {{ $labels.cluster }}"
            description: |
              CNPG reported a primary failover event (or streaming replica left
              `streaming` state). Validated in C-LK v2.5.2 chaos suite as a
              ~50s window where /health/ready degrades while platform-api stays
              up via PR #32 contract fix. Investigate via
              `kubectl -n r55-data describe cluster postgres` + CNPG operator
              logs. Failovers under normal traffic are recoverable; under load
              they cost ~50s of read/write availability during promotion.
            runbook_url: "alerts-runbook.md#cnpgfailoverevent"

    # =================================================================
    - name: platform_licensing
      interval: 30s
      rules:

        - alert: LicenseImageUnauthorized
          expr: |
            sum(increase(license_image_unauthorized_total[5m])) > 0
          for: 1m
          labels:
            severity: P0
            service: licensing
          annotations:
            summary: "ADR-0011 Layer C breach — license rejects current IMAGE_DIGEST"
            description: |
              `license.image_unauthorized` counter incremented in last 5min. The running container's
              manifest digest is NOT in the license's AuthorizedImageDigests claim. Either:
                (a) operator deployed wrong image (registry mirror skew?);
                (b) license is stale (issued before current digest registered);
                (c) intentional pirate attempt — investigate.
              Drill-down: Grafana dashboard `verbara-licensing` panel 8 (table) shows truncated digest
              + authorized_count. Verify against verbara-website/data/authorized-digests.json.
            runbook_url: "alerts-runbook.md#licenseimageunauthorized"

        - alert: PlatformApiContainerErrorTermination
          # Prometheus-native signal: any platform-api pod terminated with Reason=Error
          # in last 10min. CAUSE attribution (license? worker? DB?) requires log
          # inspection — see Grafana `verbara-licensing` panel 7 (Loki) or
          # `kubectl logs <pod> --previous`. Loki Ruler will add the joined log-based
          # variants (LicenseValidationFailedAtBoot, WorkerCrashDetected) in a follow-up.
          expr: |
            sum(increase(kube_pod_container_status_last_terminated_reason{reason="Error",pod=~"platform-api-.*"}[10m])) > 0
          for: 2m
          labels:
            severity: P0
            service: platform-api
          annotations:
            summary: "Platform-api pod terminated with Reason=Error in last 10min"
            description: |
              At least one platform-api pod restarted with `Last State Reason: Error` (not OOMKilled,
              not Completed, not SIGTERM). Possible causes:
                - License validation failure at boot (LicenseException) — pre-v2.3.1 DI race regression
                  is the historical pattern; check the v2.3.1+ deployment
                - Worker silent-death caught by ADR-0021 StopHost (WorkerCrash log present)
                - Postgres / Redis connectivity failure during startup
                - DB schema mismatch / migration failure
                - Configuration error (missing required env, invalid Helm values)
              Investigation steps:
                1. `kubectl describe pod <pod>` — Events section shows the terminated reason + signal
                2. `kubectl logs <pod> --previous` — stack trace from the crashed run
                3. Grafana `verbara-licensing` panel 7 (Loki) — search for "LicenseException|WorkerCrash"
              If logs show LicenseException → check verbara-lab-license Secret content;
              if logs show WorkerCrash → ADR-0021 worker resilience worked as designed, investigate the worker.
            runbook_url: "alerts-runbook.md#platformapicontainerexterrortermination"

        - alert: LicenseGraceWindowExhausted
          expr: |
            min by (feature) (license_guard_grace_remaining_seconds) == 0
          for: 5m
          labels:
            severity: P1
            service: licensing
          annotations:
            summary: "Pro feature {{ $labels.feature }} grace window exhausted — calls now denied"
            description: |
              `license.guard.grace_remaining_seconds{feature="{{ $labels.feature }}"}` hit 0 and stayed
              there for 5min. LicenseGuard.CanExecute now returns Allowed=false; Pro endpoints respond
              HTTP 402 RFC 9457 with `Reason=GraceExhausted`. Renew the license urgently OR upgrade the
              installation tier. Public trial issuer: https://verbara.io/developer-license.
            runbook_url: "alerts-runbook.md#licensegracewindowexhausted"

        - alert: LicenseBlocksRateHigh
          expr: |
            sum(rate(license_guard_blocked_total[10m])) > 1
          for: 15m
          labels:
            severity: P2
            service: licensing
          annotations:
            summary: "Sustained license-block rate > 1 block/s for 15min"
            description: |
              Either: customer is repeatedly hitting Pro endpoints without a valid license (high HTTP 402
              rate — expected post v2.5.0-pro removal for unlicensed installs); OR a misconfigured client
              is polling. Use Grafana panel 5 to identify which `feature` + `reason` combination is
              dominant. If `reason=NotLicensed` AND a fresh deploy, check Secret mount + values.yaml.
            runbook_url: "alerts-runbook.md#licenseblocksratehigh"

        - alert: LicenseExpiringSoon
          expr: |
            min(license_guard_grace_remaining_seconds) < 604800
            and
            min(license_guard_grace_remaining_seconds) > 0
          for: 1h
          labels:
            severity: P2
            service: licensing
          annotations:
            summary: "Pro license within grace window — < 7 days remaining"
            description: |
              The Pro license has entered the grace-period window. `license.guard.grace_remaining_seconds`
              minimum across features < 604800s (7 days). Renew the license now; Pro features remain
              available until grace exhausts (alert `LicenseGraceWindowExhausted` will page when that
              happens). Hot-reload via FileSystemWatcher means rotation is downtime-free —
              just replace the K8s Secret.
            runbook_url: "alerts-runbook.md#licenseexpiringsoon"

        # Note: 3 additional log-derived alerts are documented in
        # docs/operations/prometheus-licensing-alerts.md for installation as Loki Ruler
        # rules (separate from this PrometheusRule manifest because they use LogQL
        # `count_over_time({...} |~ "pattern" [duration])` syntax that Prometheus
        # itself does not parse):
        #   - LicenseValidationFailedAtBoot  (LicenseException in logs, P0)
        #   - WorkerCrashDetected            (WorkerCrash in logs,        P1)
        #   - ProductionWithoutImageDigest   (event.id=12002 in logs,     P3)
        # Loki Ruler installation is deferred until the kube-prometheus-stack chart
        # values enable the Loki ruler component (loki-stack.loki.config.ruler).

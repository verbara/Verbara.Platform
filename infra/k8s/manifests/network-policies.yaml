# =============================================================================
# NetworkPolicy manifests for Verbara Platform K8s deployment (R5.5)
#
# CNI: Cilium (supports standard K8s NetworkPolicy natively)
# Namespaces: r55-data, r55-asterisk, r55-platform, monitoring, local-path-storage
#
# Notes:
#   - Kamailio and RTPEngine run with hostNetwork: true — NetworkPolicies
#     do NOT apply to hostNetwork pods (they bypass kube-proxy entirely).
#   - Uses kubernetes.io/metadata.name labels (built-in since K8s 1.22)
#     for namespaceSelector matching.
#   - All policies use standard networking.k8s.io/v1 (portable across CNIs).
# =============================================================================

# =============================================================================
# r55-data namespace
# =============================================================================

# 1. Default deny all ingress in r55-data
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: r55-data
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# 2. Allow Postgres pooler access from workload namespaces.
#    Three selector forms (OR-combined):
#      a) namespace name == r55-asterisk  (back-compat: production workload)
#      b) namespace name == r55-platform  (back-compat: production workload)
#      c) namespace label `verbara.io/postgres-access: allowed`
#         opt-in marker for preview / test / blue-green deploys. Add the
#         label to a new namespace to grant access without editing this
#         policy (e.g. `kubectl label ns r55-platform-v25-preview
#         verbara.io/postgres-access=allowed`). The label uses a per-
#         backend key (postgres-access, redis-access) so a namespace can
#         opt into multiple data tiers via separate labels — one label
#         key per opt-in is required because Kubernetes labels are a
#         simple `key=value` map (no list-membership semantics).
#         Discovered necessary 2026-05-18 during Pro v2.5.0-pro
#         compressed-validation Scenario E.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres-from-workloads
  namespace: r55-data
spec:
  podSelector:
    matchLabels:
      cnpg.io/poolerName: postgres-pooler
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: r55-asterisk
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: r55-platform
        - namespaceSelector:
            matchLabels:
              verbara.io/postgres-access: allowed
      ports:
        - protocol: TCP
          port: 5432
---
# 3. Allow Redis access from workload namespaces.
#    Mirrors the postgres-pooler policy (#2): r55-platform by name +
#    label-based opt-in for preview/test/blue-green deploys
#    (`verbara.io/redis-access: allowed`). Independent from the
#    postgres-access label so a preview ns can opt into Postgres
#    only, Redis only, or both via separate labels.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-redis-from-platform
  namespace: r55-data
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: r55-platform
        - namespaceSelector:
            matchLabels:
              verbara.io/redis-access: allowed
      ports:
        - protocol: TCP
          port: 6379
---
# 4. Allow Prometheus scrapes from monitoring namespace
#    Targets: CloudNativePG PodMonitor (5432 metrics), PgBouncer pooler,
#    Redis exporter (if sidecar added), and any future exporters.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrapes
  namespace: r55-data
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 9187  # postgres_exporter sidecar (if present)
---
# 5. Allow CloudNativePG internal replication and operator traffic
#    CNPG pods need to communicate with each other (streaming replication,
#    pg_rewind) and the CNPG operator needs to reach them for management.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cnpg-internal
  namespace: r55-data
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: postgres
  policyTypes:
    - Ingress
  ingress:
    # Intra-cluster replication (postgres pods talking to each other)
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: postgres
      ports:
        - protocol: TCP
          port: 5432
    # CNPG operator (runs in its own namespace, typically cnpg-system)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 8000  # CNPG status/webhook port
---
# 6. Allow pooler pods to reach the Postgres cluster they front
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-pooler-to-postgres
  namespace: r55-data
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/poolerName: postgres-pooler
      ports:
        - protocol: TCP
          port: 5432

---
# =============================================================================
# r55-asterisk namespace
# =============================================================================

# 7. Default deny all ingress in r55-asterisk
#    Note: Kamailio and RTPEngine use hostNetwork: true, so they are NOT
#    affected by NetworkPolicies — traffic goes directly via the host stack.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: r55-asterisk
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# 8. Allow AMI + ARI access from r55-platform (Platform API -> Asterisk)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ami-ari-from-platform
  namespace: r55-asterisk
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: asterisk
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: r55-platform
      ports:
        - protocol: TCP
          port: 5038  # AMI
        - protocol: TCP
          port: 8088  # ARI (HTTP/WebSocket)
---
# 9. Allow Prometheus scrapes on Asterisk metrics port from monitoring
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrapes
  namespace: r55-asterisk
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: asterisk
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9080  # Asterisk Prometheus exporter
---
# 10. Allow Asterisk pods to talk to each other (clustering, RTP relay)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-asterisk-internal
  namespace: r55-asterisk
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: asterisk
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: asterisk
      ports:
        - protocol: TCP
          port: 5038  # AMI (inter-node)
        - protocol: TCP
          port: 8088  # ARI (inter-node)
        - protocol: TCP
          port: 4569  # IAX2 (inter-Asterisk trunking)
        - protocol: UDP
          port: 4569  # IAX2 (UDP)
---
# 10b. Allow SIP signaling (UDP 5060) from Kamailio SBC layer.
# Kamailio runs hostNetwork=true on every worker — source IP is the
# worker node IP (192.168.122.10-13 range = libvirt default network).
# Standard K8s NetworkPolicy podSelector / namespaceSelector cannot
# match hostNetwork pods (their packets bypass the CNI source-NAT
# layer), so we use the ipBlock selector with the cluster node CIDR.
# Discovered 2026-05-17 during R5.5 Phase B-LK.2 SIPp execution —
# this was the third missing piece of Phase 0LK validation.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-sip-from-kamailio-sbc
  namespace: r55-asterisk
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: asterisk
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 192.168.122.0/24
      ports:
        - protocol: UDP
          port: 5060  # SIP signaling from Kamailio
---
# 11. Allow blackbox-exporter probes from monitoring (TCP connect checks)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-blackbox-from-monitoring
  namespace: r55-asterisk
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: asterisk
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 5038  # blackbox tcp_connect: asterisk-ami
        - protocol: TCP
          port: 8088  # blackbox tcp_connect: asterisk-ari

---
# =============================================================================
# r55-platform namespace
# =============================================================================

# 12. Default deny all ingress in r55-platform
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: r55-platform
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# 13. Allow ingress to Platform API on port 5000
#    Source is "any" — the ingress controller (Cilium Gateway or nginx)
#    may run in any namespace, and external LoadBalancer traffic arrives
#    from outside the cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-ingress
  namespace: r55-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: platform-api
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 5000
---
# 14. Allow ingress to Web frontend on port 80
#    Same rationale as API — ingress controller or LB from any source.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-web-ingress
  namespace: r55-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: web
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 80
---
# 14b. ADR-0022 Phase A — Allow ingress to Realtime SignalR Hub on port 5030
#     Browser WebSocket handshakes arrive through Cilium Gateway /hubs/* →
#     platform-realtime Service. Source is "any" — same rationale as the
#     allow-api-ingress + allow-web-ingress policies above.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-realtime-ingress
  namespace: r55-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: platform-realtime
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 5030
---
# 15. Allow Prometheus scrapes from monitoring namespace on API metrics
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrapes
  namespace: r55-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: platform-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 5000  # /metrics endpoint on same port
---
# 16. Allow blackbox-exporter health probes from monitoring
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-blackbox-from-monitoring
  namespace: r55-platform
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 5000  # health/ready, health/live endpoints
        - protocol: TCP
          port: 80    # web frontend probe
        - protocol: TCP
          port: 5030  # ADR-0022 Phase A — realtime health probe

---
# =============================================================================
# monitoring namespace
# =============================================================================

# 17. Allow all ingress in monitoring namespace
#    Prometheus, Grafana, Loki, Alertmanager, and blackbox-exporter all need
#    broad intra-namespace communication and receive scraped data / alerts
#    from other namespaces. Lock down per-service in a future hardening pass.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-all-ingress
  namespace: monitoring
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - {}

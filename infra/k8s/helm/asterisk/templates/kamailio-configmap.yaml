apiVersion: v1
kind: ConfigMap
metadata:
  name: kamailio-config
  namespace: {{ .Values.namespace }}
data:
  kamailio.cfg: |
    #!KAMAILIO

    debug=2
    log_stderror=yes
    log_facility=LOG_LOCAL0
    fork=yes
    children=4
    listen=udp:0.0.0.0:{{ .Values.kamailio.sipPort }}

    loadmodule "tm.so"
    loadmodule "tmx.so"
    loadmodule "rr.so"
    loadmodule "sl.so"
    loadmodule "maxfwd.so"
    loadmodule "dispatcher.so"
    loadmodule "rtpengine.so"
    loadmodule "siputils.so"
    loadmodule "textops.so"
    loadmodule "pv.so"
    loadmodule "xlog.so"
    loadmodule "sanity.so"
    loadmodule "ctl.so"
    loadmodule "jsonrpcs.so"

    # Round 4 #3 (SIP timer T1 tuning) attempted on 2026-05-17 but rolled
    # back the same session — bumping `fr_timer` from default 30s to 5s
    # accidentally TIGHTENED the timeout (it's the final-response timer,
    # not the retransmit interval) and broke valid BYE 200 OK arrivals.
    # The actual T1 retransmit interval (500 ms) is hardcoded in Kamailio
    # core (`cfg_get(tm, retr_timer1)`) and not configurable via cfg in
    # this 5.8 build. Real fix requires either rebuilding tm with a
    # different default OR reducing the LB-IP UDP path latency (the real
    # source of retransmit-trigger). Deferred to Phase F follow-up.

    modparam("dispatcher", "list_file", "/etc/kamailio/dispatcher.list")
    modparam("dispatcher", "ds_ping_interval", 30)
    modparam("dispatcher", "ds_probing_mode", 1)
    modparam("dispatcher", "flags", 2)
    modparam("dispatcher", "ds_hash_size", 4)
    # R5.5 Phase 0LK gap-fix round 2 (2026-05-17) — tolerate the first few
    # OPTIONS probes failing during cold start. Without this the first
    # probe (sent before Asterisk pjsip is fully ready) marks the target
    # Inactive (FLAGS: IP) and the dispatcher only recovers after a manual
    # `kamcmd dispatcher.reload`. ds_probing_threshold=3 requires 3
    # consecutive failures before marking inactive; ds_inactive_threshold=2
    # requires 2 consecutive successes before reactivating, so a brief
    # blip during steady-state won't flap.
    modparam("dispatcher", "ds_probing_threshold", 3)
    modparam("dispatcher", "ds_inactive_threshold", 2)
    modparam("rtpengine", "rtpengine_sock", "udp:127.0.0.1:22222")
    modparam("jsonrpcs", "transport", 6)

    request_route {
      if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
      }
      if (!sanity_check("1511", "7")) {
        xlog("L_WARN", "Malformed SIP from $si:$sp\n");
        exit;
      }
      if (is_method("REGISTER")) {
        sl_send_reply("404", "Not Here");
        exit;
      }
      if (has_totag()) {
        route(WITHIN_DLG);
        exit;
      }
      record_route();
      if (is_method("INVITE")) {
        if (!ds_select_dst("1", "10")) {
          sl_send_reply("503", "No backend Asterisk available");
          exit;
        }
        rtpengine_manage("replace-origin replace-session-connection");
        t_on_reply("MANAGE_REPLY");
        t_on_failure("MANAGE_FAILURE");
      }
      if (!t_relay()) {
        sl_reply_error();
        exit;
      }
    }

    onreply_route[MANAGE_REPLY] {
      if (status =~ "(180)|(183)|(2[0-9][0-9])") {
        rtpengine_manage("replace-origin replace-session-connection");
      }
    }

    failure_route[MANAGE_FAILURE] {
      if (t_is_canceled()) exit;
      if (t_check_status("(5[0-9][0-9])|(408)")) {
        xlog("L_ERR", "Backend failed, trying next\n");
        if (ds_next_dst()) {
          rtpengine_manage("replace-origin replace-session-connection");
          t_on_reply("MANAGE_REPLY");
          t_on_failure("MANAGE_FAILURE");
          t_relay();
          exit;
        }
      }
    }

    route[WITHIN_DLG] {
      if (loose_route()) {
        if (is_method("BYE")) {
          rtpengine_delete();
        } else if (is_method("INVITE|UPDATE")) {
          rtpengine_manage("replace-origin replace-session-connection");
        }
        if (!t_relay()) {
          sl_reply_error();
          exit;
        }
      }
    }

  dispatcher.list: |
    # setid destination flags priority attrs
    # R5.5 Phase 0LK gap-fix round 2 (2026-05-17) — point at the
    # Cilium-L2-announced LoadBalancer IP of the asterisk-sip Service
    # instead of the ClusterIP DNS name. hostNetwork Kamailio cannot
    # reach in-cluster ClusterIPs when Cilium runs with hostFirewall=true
    # + kubeProxyReplacement=true (the eBPF redirect path bypasses
    # hostNetwork sources). LoadBalancer IP 192.168.122.201 lives on
    # the LAN and round-trips cleanly. Selection across the 2 Asterisk
    # pods happens at the Service ClusterIP layer behind the LB,
    # picking per-call via call-id hash (Cilium default).
    1 sip:192.168.122.201:5060 0 0

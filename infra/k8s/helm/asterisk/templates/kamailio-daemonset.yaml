apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kamailio
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: kamailio
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kamailio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kamailio
    spec:
      hostNetwork: {{ .Values.kamailio.hostNetwork }}
      dnsPolicy: ClusterFirstWithHostNet
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      initContainers:
        - name: wait-for-asterisk-dns
          image: busybox:1.37
          # ResourceQuota r55-asterisk-quota requires every container
          # (init included) to declare limits + requests. Phase 0LK
          # gap-fix round 3 — was the blocker for the kamailio DaemonSet
          # rolling restart in 2026-05-17 (16 consecutive FailedCreate
          # events before this was added).
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          command:
            - sh
            - -c
            - |
              echo "Waiting for asterisk-sip.{{ .Values.namespace }}.svc.cluster.local to resolve..."
              until nslookup asterisk-sip.{{ .Values.namespace }}.svc.cluster.local > /dev/null 2>&1; do
                sleep 3
              done
              echo "DNS resolved"
      containers:
        - name: kamailio
          image: "{{ .Values.kamailio.image.repository }}:{{ .Values.kamailio.image.tag }}"
          args: ["-DD", "-E", "-f", "/etc/kamailio/kamailio.cfg"]
          ports:
            - name: sip
              containerPort: {{ .Values.kamailio.sipPort }}
              protocol: UDP
          volumeMounts:
            - name: config
              mountPath: /etc/kamailio
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "kamcmd dispatcher.list > /dev/null 2>&1"
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "kamcmd dispatcher.list > /dev/null 2>&1"
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - "kamcmd dispatcher.list > /dev/null 2>&1"
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          # postStart hook: event-driven dispatcher.reload until at least
          # one destination is Active (FLAGS contains 'A'). The earlier
          # fixed `sleep 20` (Phase 0LK gap-fix round 3) was empirically
          # insufficient on talos-w3 (post-restart dispatcher took >30 s to
          # see a successful OPTIONS probe response). This loop retries
          # every 5 s for up to 60 s. If the dispatcher never goes Active
          # (Cilium L2 hairpin on the L2-owner node), the loop exits
          # silently and the pod continues — operator can confirm via
          # `kamcmd dispatcher.list`. Phase 0LK gap-fix round 4
          # (2026-05-17).
          lifecycle:
            postStart:
              exec:
                command:
                  - sh
                  - -c
                  - |
                    sleep 5
                    for i in $(seq 1 12); do
                      kamcmd dispatcher.reload >/dev/null 2>&1 || true
                      sleep 5
                      if kamcmd dispatcher.list 2>/dev/null | grep -q "FLAGS: A"; then
                        exit 0
                      fi
                    done
                    exit 0  # never fail postStart even if dispatcher never goes Active
      volumes:
        - name: config
          configMap:
            name: kamailio-config

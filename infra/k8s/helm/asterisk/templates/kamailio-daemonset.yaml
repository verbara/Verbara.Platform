apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kamailio
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: kamailio
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kamailio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kamailio
    spec:
      hostNetwork: {{ .Values.kamailio.hostNetwork }}
      dnsPolicy: ClusterFirstWithHostNet
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      initContainers:
        - name: wait-for-asterisk-dns
          image: busybox:1.37
          # ResourceQuota r55-asterisk-quota requires every container
          # (init included) to declare limits + requests. Phase 0LK
          # gap-fix round 3 — was the blocker for the kamailio DaemonSet
          # rolling restart in 2026-05-17 (16 consecutive FailedCreate
          # events before this was added).
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          command:
            - sh
            - -c
            - |
              echo "Waiting for asterisk-sip.{{ .Values.namespace }}.svc.cluster.local to resolve..."
              until nslookup asterisk-sip.{{ .Values.namespace }}.svc.cluster.local > /dev/null 2>&1; do
                sleep 3
              done
              echo "DNS resolved"
      containers:
        - name: kamailio
          image: "{{ .Values.kamailio.image.repository }}:{{ .Values.kamailio.image.tag }}"
          args: ["-DD", "-E", "-f", "/etc/kamailio/kamailio.cfg"]
          ports:
            - name: sip
              containerPort: {{ .Values.kamailio.sipPort }}
              protocol: UDP
          volumeMounts:
            - name: config
              mountPath: /etc/kamailio
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "kamcmd dispatcher.list > /dev/null 2>&1"
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "kamcmd dispatcher.list > /dev/null 2>&1"
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - "kamcmd dispatcher.list > /dev/null 2>&1"
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          # postStart hook: wait for Kamailio + the dispatcher targets to
          # settle, then force a `dispatcher.reload`. This works around the
          # cold-start race where the first OPTIONS probe (sent within ~1 s
          # of process start) fails because the destination ClusterIP /
          # LoadBalancer eBPF map is not yet populated for the new pod's
          # network namespace, leaving the destination flagged Inactive
          # forever (FLAGS: IP). ds_probing_threshold=3 in kamailio.cfg
          # prevents flap during steady-state but does NOT override the
          # initial-Inactive marker. This hook is the documented work-
          # around per Phase 0LK gap-fix round 3 (2026-05-17).
          lifecycle:
            postStart:
              exec:
                command:
                  - sh
                  - -c
                  - "sleep 20 && kamcmd dispatcher.reload >/dev/null 2>&1 || true"
      volumes:
        - name: config
          configMap:
            name: kamailio-config

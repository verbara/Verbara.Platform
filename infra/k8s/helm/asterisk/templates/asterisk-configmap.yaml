apiVersion: v1
kind: ConfigMap
metadata:
  name: asterisk-config
  namespace: {{ .Values.namespace }}
data:
  pjsip.conf: |
    [global]
    type=global
    user_agent=Asterisk-R55-K8s

    [system]
    type=system
    timer_t1=500

    [transport-udp]
    type=transport
    protocol=udp
    bind=0.0.0.0:5060
    local_net=192.168.122.0/24
    local_net=10.244.0.0/16

    ; ─────────────────────────────────────────────────────────────────
    ; R5.5 Phase 0LK gap-fix round 2 (2026-05-17) — anonymous endpoint
    ; for SIPp load traffic via Kamailio SBC. The endpoint named
    ; `anonymous` is the special pjsip fallback Asterisk uses for inbound
    ; calls that match NO other endpoint. Kamailio dispatches INVITEs
    ; toward asterisk-sip.r55-asterisk.svc.cluster.local:5060 without
    ; passing any auth credentials (SBC-fronted topology — Kamailio is
    ; the trust boundary at the cluster edge). All such calls land here
    ; and route into the r55-loadtest dialplan context below.
    ;
    ; For production-grade deployments, replace this with per-Kamailio-
    ; worker `[identify]`-bound endpoints (one per worker IP) so the
    ; allow-list is enforced inside Asterisk too. The current setup is
    ; appropriate for Phase B-LK only.
    ; ─────────────────────────────────────────────────────────────────
    [anonymous]
    type=endpoint
    context=r55-loadtest
    disallow=all
    allow=ulaw
    allow=alaw

  extensions.conf: |
    ; Original demo context (kept for backward compat with manual probes)
    [from-internal]
    exten => _X.,1,NoOp(Internal call from ${CALLERID(all)})
    same => n,Answer()
    same => n,Playback(hello-world)
    same => n,Hangup()

    ; ─────────────────────────────────────────────────────────────────
    ; R5.5 Phase 0LK gap-fix round 2 (2026-05-17) — load-test dialplan
    ; Pattern `_queue-.` matches queue-1, queue-12, queue-100, etc.
    ; Answer + brief wait + hangup keeps the call short so SIPp can
    ; ramp call-rate without exhausting Asterisk channels. The
    ; SIPp default scenario expects a 200 OK INVITE + 5 s RTP + BYE
    ; from the UAS side; we Answer immediately and Wait(5) to give RTP
    ; time to flow. The catchall exten `_X.` is the safety net for any
    ; non-queue extension (returns 404).
    ; ─────────────────────────────────────────────────────────────────
    [r55-loadtest]
    exten => _queue-.,1,NoOp(SIPp load-test call to ${EXTEN} from ${CALLERID(all)})
    same => n,Answer()
    same => n,Wait(5)
    same => n,Hangup()
    exten => _X.,1,NoOp(Unmatched load-test call to ${EXTEN})
    same => n,Hangup(NO_ROUTE_DESTINATION)

  modules.conf: |
    [modules]
    autoload=yes
    ; PostgreSQL and sorcery load before any realtime-dependent module, as in
    ; docker/asterisk-config/modules.conf.
    preload => res_config_pgsql.so
    preload => res_sorcery_config.so
    preload => res_sorcery_memory.so
    preload => res_sorcery_memory_cache.so
    preload => res_sorcery_realtime.so
    noload => chan_sip.so

  # Platform's AMI user. Same [general] and the same read/write/deny/permit lines
  # as docker/asterisk-config/manager.conf.template, no eventfilter (Platform's
  # pool sweep needs every Hangup and an AMI write class of system, call or
  # reporting to send Status). The container command renders
  # /etc/asterisk/manager.conf from this template with the password from the
  # Secret; the placeholder never reaches Asterisk.
  manager.conf.template: |
    [general]
    enabled = yes
    bindaddr = 0.0.0.0
    port = 5038
    timestampevents = yes

    [{{ .Values.asterisk.ami.username }}]
    secret = __AMI_PASSWORD__
    read = system,call,agent,user,config,originate,reporting,command
    write = system,call,agent,user,config,originate,command,reporting
    deny = 0.0.0.0/0.0.0.0
    permit = 0.0.0.0/0.0.0.0

  # Platform's ARI user, as in docker/asterisk-config/ari.conf.template; the
  # password is rendered in from the Secret the same way.
  ari.conf.template: |
    [general]
    enabled = yes
    pretty = yes

    [{{ .Values.asterisk.ari.username }}]
    type = user
    read_only = no
    password = __ARI_PASSWORD__

  # ARI is served by Asterisk's HTTP server, which the image binds to 127.0.0.1
  # only. Plain HTTP on 8088 inside the cluster, as the platform chart's
  # api.asterisk.ari.baseUrl expects.
  http.conf: |
    [general]
    enabled = yes
    bindaddr = 0.0.0.0
    bindport = 8088

  # Realtime database. The container command renders /etc/asterisk/res_pgsql.conf
  # from this template, replacing each `key = ` line with the PG_REALTIME_* value
  # (asterisk.postgres.*, the password from its Secret); the placeholders never
  # reach Asterisk. Asterisk's res_config_pgsql reads res_pgsql.conf.
  res_pgsql.conf.template: |
    [general]
    dbhost = __PG_REALTIME_HOST__
    dbport = __PG_REALTIME_PORT__
    dbname = __PG_REALTIME_DB__
    dbuser = __PG_REALTIME_USER__
    dbpass = __PG_REALTIME_PASSWORD__
    requirements = createclose

  # The realtime families Platform writes (Verbara.Sdk.Pro.Realtime), as in
  # docker/asterisk-config/extconfig.conf.
  extconfig.conf: |
    [settings]
    ps_endpoints => pgsql,general,ps_endpoints
    ps_auths => pgsql,general,ps_auths
    ps_aors => pgsql,general,ps_aors
    ps_contacts => pgsql,general,ps_contacts
    ps_registrations => pgsql,general,ps_registrations
    ps_domain_aliases => pgsql,general,ps_domain_aliases
    ps_endpoint_id_ips => pgsql,general,ps_endpoint_id_ips
    queues => pgsql,general,queues
    queue_members => pgsql,general,queue_members
    voicemail => pgsql,general,voicemail

  # PJSIP objects from realtime, as in docker/asterisk-config/sorcery.conf, and
  # also from pjsip.conf above for endpoints, auths and aors so the load-test
  # `anonymous` endpoint keeps answering. Each cache comes first, as in the
  # Docker file: with the cache between pjsip.conf and realtime, `pjsip show
  # endpoints` listed `anonymous` only and none of the realtime endpoints.
  sorcery.conf: |
    [res_pjsip]
    endpoint/cache = memory_cache,name=pjsip_endpoint_cache,maximum_objects=5000,object_lifetime_maximum=900,expire_on_reload=yes
    endpoint = config,pjsip.conf,criteria=type=endpoint
    endpoint = realtime,ps_endpoints
    auth/cache = memory_cache,name=pjsip_auth_cache,maximum_objects=5000,object_lifetime_maximum=900,expire_on_reload=yes
    auth = config,pjsip.conf,criteria=type=auth
    auth = realtime,ps_auths
    aor/cache = memory_cache,name=pjsip_aor_cache,maximum_objects=5000,object_lifetime_maximum=900,expire_on_reload=yes
    aor = config,pjsip.conf,criteria=type=aor
    aor = realtime,ps_aors
    contact = astdb,registrator

    [res_pjsip_endpoint_identifier_ip]
    identify = config,pjsip.conf,criteria=type=identify
    identify = realtime,ps_endpoint_id_ips

    [res_pjsip_outbound_registration]
    registration = config,pjsip.conf,criteria=type=registration
    registration = realtime,ps_registrations

{{- /*
Platform's AMI password. Rendered only when asterisk.ami.password is passed at
install; otherwise the Secret named by asterisk.ami.passwordSecret must already
exist. The repository holds no literal AMI password.
*/ -}}
{{- if .Values.asterisk.ami.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.asterisk.ami.passwordSecret }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "asterisk.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.asterisk.ami.passwordKey }}: {{ .Values.asterisk.ami.password | quote }}
{{- end }}

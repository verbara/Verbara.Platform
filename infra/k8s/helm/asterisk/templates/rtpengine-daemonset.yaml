apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: rtpengine
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: rtpengine
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: rtpengine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rtpengine
    spec:
      hostNetwork: {{ .Values.rtpengine.hostNetwork }}
      dnsPolicy: ClusterFirstWithHostNet
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      containers:
        - name: rtpengine
          image: "{{ .Values.rtpengine.image.repository }}:{{ .Values.rtpengine.image.tag }}"
          env:
            - name: RTPENGINE_PUBLIC_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: RTPENGINE_PORT_MIN
              value: "{{ .Values.rtpengine.rtpPortMin }}"
            - name: RTPENGINE_PORT_MAX
              value: "{{ .Values.rtpengine.rtpPortMax }}"
            - name: RTPENGINE_BIND_NG_PORT
              value: "{{ .Values.rtpengine.ngPort }}"
            - name: RTPENGINE_LOG_LEVEL
              value: "5"
          securityContext:
            capabilities:
              add: ["NET_ADMIN", "SYS_NICE"]
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          # NO probes — fonoster/rtpengine:0.3.17 is too minimal to ship
          # any of pgrep / nc / ss / ps, and shelling out via env-driven
          # check is not viable. For a hostNetwork single-process daemon,
          # the container's Running state is a strong-enough Ready
          # indicator (rtpengine binds its NG socket within ~1 s of start;
          # if it crashes the kubelet restart loop catches it via
          # restartPolicy). Production-grade alternative: ship a tiny
          # sidecar with iproute2 to run the ss-based probe, OR rebuild
          # the rtpengine image with procps included. Tracked as Phase F
          # follow-up. (Phase 0LK gap-fix round 3, 2026-05-17.)

{{- /*
Platform's ARI password. Rendered only when asterisk.ari.password is passed at
install; otherwise the Secret named by asterisk.ari.passwordSecret must already
exist. The repository holds no literal ARI password.
*/ -}}
{{- if .Values.asterisk.ari.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.asterisk.ari.passwordSecret }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "asterisk.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.asterisk.ari.passwordKey }}: {{ .Values.asterisk.ari.password | quote }}
{{- end }}

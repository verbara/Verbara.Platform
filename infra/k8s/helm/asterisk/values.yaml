namespace: r55-asterisk

asterisk:
  image:
    repository: andrius/asterisk
    tag: "22"
  # One Asterisk. Platform registers exactly one AMI server for this chart (the
  # "primary" node, src/Verbara.Platform.Api/Program.cs), so a second pod would
  # take calls Platform never sees. templates/asterisk-statefulset.yaml refuses
  # any value above 1; more than one Asterisk is a follow-up that needs one
  # Platform AMI node per pod.
  replicas: 1
  # Platform's AMI user (manager.conf), the same read/write classes as the Compose
  # template docker/asterisk-config/manager.conf.template. The password lives only
  # in a Secret: pass asterisk.ami.password at install (scripts/k8s-apps.sh does,
  # and passes the same value to the platform chart's api.asterisk.ami.password),
  # or leave it empty and create the Secret yourself before installing.
  ami:
    username: platform
    password: ""
    passwordSecret: asterisk-ami-credentials
    passwordKey: password
  # Platform's ARI user (ari.conf), served on http.conf's 8088. Same mechanism as
  # the AMI user: the password only in a Secret.
  ari:
    username: verbara
    password: ""
    passwordSecret: asterisk-ari-credentials
    passwordKey: password
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi
  postgres:
    host: postgres-pooler.r55-data.svc.cluster.local
    port: 5432
    database: verbara
    user: platform
    passwordSecret: asterisk-pg-credentials
    passwordKey: password
  storage:
    voicemailSize: 5Gi
    recordingsSize: 10Gi
  prometheus:
    enabled: true
    port: 9080
  terminationGracePeriodSeconds: 3600

kamailio:
  image:
    repository: ghcr.io/kamailio/kamailio
    tag: "5.8.8-bookworm"
  hostNetwork: true
  sipPort: 5060

rtpengine:
  image:
    repository: fonoster/rtpengine
    # Pinned 2026-05-17 (Phase 0LK gap-fix round 3) — kept fonoster
    # because it accepts the chart's RTPENGINE_* env vars (drachtio
    # uses /etc/rtpengine.conf with sed substitution + cloud-detection,
    # not compatible without a chart rewrite). The fonoster image is
    # very minimal (no pgrep / nc / ss / ps), so probes were removed
    # entirely — for a hostNetwork single-process daemon, K8s' default
    # "container Started ⇒ Ready" semantics are adequate. Tag pin
    # prevents future `latest` drift from re-breaking probe assumptions.
    tag: "0.3.17"
  hostNetwork: true
  rtpPortMin: 10000
  rtpPortMax: 10500
  ngPort: 22222

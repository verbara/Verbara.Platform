apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-realtime
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "platform.realtimeLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.realtime.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-realtime
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Same maxSurge: 0 / maxUnavailable: 1 envelope as platform-api per
      # the Talos lab tight-memory constraint (4 GB worker VMs).
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        {{- include "platform.realtimeLabels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.realtime.port }}"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 60
      affinity:
        # Spread Realtime pods across worker nodes so a single node loss does
        # not take down every Hub connection. Preferred (not required) so a
        # 3-worker cluster + replicas=4 still schedules.
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values: [platform-realtime]
                topologyKey: kubernetes.io/hostname
      # Phase A.5 multi-pod scheduling — complements the host-level
      # podAntiAffinity above with an explicit hostname-keyed spread.
      # ScheduleAnyway (soft) so a 3-worker cluster + replicas=4 still
      # schedules without surfacing Unschedulable; the scheduler still
      # prefers maximal spread when capacity allows.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway   # soft: allow co-scheduling on small clusters, prefer spread
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: platform-realtime
              app.kubernetes.io/instance: {{ .Release.Name }}
      containers:
        - name: realtime
          image: "{{ .Values.realtime.image.repository }}{{ if .Values.realtime.image.digest }}@{{ .Values.realtime.image.digest }}{{ else }}:{{ .Values.realtime.image.tag }}{{ end }}"
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 1654
            runAsGroup: 1654
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: {{ .Values.realtime.port }}
          env:
            {{- if .Values.realtime.aspnetcoreEnvironment }}
            - name: ASPNETCORE_ENVIRONMENT
              value: {{ .Values.realtime.aspnetcoreEnvironment | quote }}
            {{- end }}
            - name: ASPNETCORE_URLS
              value: "http://+:{{ .Values.realtime.port }}"
            # Phase A.2+A.3 adds SignalR backplane + Pro.Cluster + JWT env vars.
            # A.1 stages only the X-Service-Key + Platform.Api base URL.
            - name: Services__ServiceKey
              value: {{ .Values.api.serviceKey }}
            - name: Services__PlatformApi__BaseUrl
              value: "http://platform-api.{{ .Values.namespace }}.svc.cluster.local:{{ .Values.api.port }}"
            # Phase A.5 — Pro.Cluster leader election (per-resource).
            # POD_NAME is the unique lock-owner identity surfaced via the
            # downward API; Cluster__InstanceId aliases it for Pro.Cluster's
            # ClusterLeadershipOptions.InstanceId.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: Cluster__InstanceId
              value: $(POD_NAME)
            # ConnectionStrings__Cluster selects the Postgres DataSource used
            # for the distributed-lock backend. Built inline from the same
            # api.postgres values + secret as platform-api so realtime shares
            # the same DB instance (the lock table lives next to the rest of
            # the Platform schema). The previous "optional secretKeyRef →
            # fallback to ConnectionStrings__Postgres" pattern was broken:
            # secretKeyRef.optional:true with no source leaves the env var
            # with an EMPTY string (not unset), and `IConfiguration.
            # GetConnectionString("Cluster") ?? GetConnectionString("Postgres")`
            # in Program.cs does NOT fall through on empty (only on null) →
            # boot exception. See realtime Program.cs line ~163.
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.postgres.passwordSecret }}
                  key: {{ .Values.api.postgres.passwordKey }}
            - name: ConnectionStrings__Cluster
              value: "Host={{ .Values.api.postgres.host }};Port={{ .Values.api.postgres.port }};Database={{ .Values.api.postgres.database }};Username={{ .Values.api.postgres.user }};Password=$(PG_PASSWORD)"
            # Redis connection — drives BOTH the Pro.Push.Redis backplane (so
            # T27 events emitted by Platform.Api land in this pod's IPushEventBus
            # and PushToHubRelay can fan them out) AND the SignalR Redis backplane
            # (so a broadcast on the leader pod reaches clients connected to any
            # follower pod). Without this env, redisConnectionString resolves to
            # null in Program.cs:45 → no backplane wiring → cross-pod fanout
            # silently broken even though the relay leader-gate logs Forwarded.
            - name: ConnectionStrings__Redis
              value: "{{ .Values.api.redis.host }}:{{ .Values.api.redis.port }}"
            # ADR-0012 JWT rotation pool — required for ANY multi-replica
            # Realtime deployment + for cross-microservice JWT validation
            # (Platform.Api mints the token, Realtime validates it; they MUST
            # share the same IJwtKeyStore). Without IdentityRedis, Realtime
            # Program.cs:97-111 falls back to InMemoryJwtKeyStore which
            # generates its own key per pod boot — every token signed by API
            # is rejected with `SecurityTokenSignatureKeyNotFoundException`
            # (IDX10500). Surfaced 2026-05-24 during Phase A.5 audit-endpoint
            # smoke against the Talos lab. See ADR-0012 + R5.5 K8s Phase 0LK
            # real state report (chart-gap closure).
            - name: ConnectionStrings__IdentityRedis
              value: "{{ .Values.api.identityRedis.host }}:{{ .Values.api.identityRedis.port }}"
            # KeyPrefix MUST match Platform.Api's RedisIdentityOptions.KeyPrefix.
            # Api doesn't set Identity:Redis:KeyPrefix in its env, so it falls
            # through to the SDK default `asterisk:identity:` (legacy from
            # pre-rebrand — see src/Verbara.Platform.Identity.Redis/
            # RedisIdentityOptions.cs:27). Realtime Program.cs:104 hardcodes a
            # different default (`verbara:platform:identity:`) which would
            # cause the IJwtKeyStore to look at the WRONG Redis keys → JWT
            # validation always returns IDX10500 even with IdentityRedis wired.
            # Verified live 2026-05-24 by curling /admin/realtime/audit with a
            # valid platform-admin JWT against the v0.2.5 chart — same 401 as
            # without the env. Aligning to Api's prefix here is the chart-side
            # fix; a future code change should also normalise Realtime
            # Program.cs default to "asterisk:identity:".
            - name: Identity__Redis__KeyPrefix
              value: "asterisk:identity:"
          resources:
            requests:
              cpu: {{ .Values.realtime.resources.requests.cpu }}
              memory: {{ .Values.realtime.resources.requests.memory }}
            limits:
              cpu: {{ .Values.realtime.resources.limits.cpu }}
              memory: {{ .Values.realtime.resources.limits.memory }}
          readinessProbe:
            # Phase A.2+A.3 promotes to /health/ready (Redis backplane + Cluster).
            httpGet:
              path: /health
              port: {{ .Values.realtime.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.realtime.port }}
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: {{ .Values.realtime.port }}
            initialDelaySeconds: 3
            periodSeconds: 3
            failureThreshold: 10

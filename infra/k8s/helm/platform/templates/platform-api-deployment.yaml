apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-api
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "platform.apiLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # maxSurge: 0 + maxUnavailable: 1 tolerates clusters where worker
      # memory is tight (4 GB Talos VMs in lab). Production clusters with
      # ample memory can override to maxSurge: 1 + maxUnavailable: 0 via
      # --set for zero-downtime semantics, at the cost of N+1 temporary
      # replicas during rollout.
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        {{- include "platform.apiLabels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.api.port }}"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 60
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values: [platform-api]
                topologyKey: kubernetes.io/hostname
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.37
          # PodSecurity restricted + r55-platform ResourceQuota require both
          # securityContext and resources on every container (init included).
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          command:
            - sh
            - -c
            - |
              echo "Waiting for postgres-pooler.r55-data.svc.cluster.local..."
              until nslookup postgres-pooler.r55-data.svc.cluster.local > /dev/null 2>&1; do
                sleep 3
              done
              echo "Postgres pooler DNS resolved"
      containers:
        - name: api
          # Pin by digest when set (ADR-0011 Layer B: kubelet pulls byte-exact
          # signed image, ignores tag float). Falls back to tag-only reference
          # when api.image.digest is empty (dev / local KVM cluster scenarios).
          image: "{{ .Values.api.image.repository }}{{ if .Values.api.image.digest }}@{{ .Values.api.image.digest }}{{ else }}:{{ .Values.api.image.tag }}{{ end }}"
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 1654
            runAsGroup: 1654
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          env:
            {{- if .Values.api.image.digest }}
            # Layer C in-process image-binding check (ADR-0011, Pro v2.3.x).
            # Pro's ContainerImageDigest.ReadFromEnvironment() reads this env
            # var + compares against LicenseKey.AuthorizedImageDigests claims.
            # Operator sets api.image.digest in values.yaml (or via --set);
            # value sourced from verbara-website/data/authorized-digests.json.
            - name: IMAGE_DIGEST
              value: {{ .Values.api.image.digest | quote }}
            {{- end }}
            - name: ASPNETCORE_URLS
              value: "http://+:{{ .Values.api.port }}"
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.postgres.passwordSecret }}
                  key: {{ .Values.api.postgres.passwordKey }}
            - name: ConnectionStrings__Postgres
              value: "Host={{ .Values.api.postgres.host }};Port={{ .Values.api.postgres.port }};Database={{ .Values.api.postgres.database }};Username={{ .Values.api.postgres.user }};Password=$(PG_PASSWORD)"
            - name: ConnectionStrings__Redis
              value: "{{ .Values.api.redis.host }}:{{ .Values.api.redis.port }}"
            # ADR-0012 JWT rotation pool — required for multi-replica deployments.
            # Default chart deploys 2 replicas; without the pool, each replica
            # generates its own RSA key on first boot and tokens signed by
            # replica A get rejected by replica B. Code path Program.cs:540-554.
            - name: ConnectionStrings__IdentityRedis
              value: "{{ .Values.api.identityRedis.host }}:{{ .Values.api.identityRedis.port }}"
            - name: Identity__JwtKeyRotation__UseRotationPool
              value: {{ .Values.api.identityRedis.useRotationPool | quote }}
            - name: Identity__JwtKeyRotation__RequireRedisStore
              value: {{ .Values.api.identityRedis.requireRedisStore | quote }}
            - name: Identity__Jwt__Issuer
              value: {{ .Values.api.jwt.issuer }}
            - name: Identity__Jwt__Audience
              value: {{ .Values.api.jwt.audience }}
            - name: JWT_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.jwt.keySecret }}
                  key: {{ .Values.api.jwt.keyField }}
            - name: Services__ServiceKey
              value: {{ .Values.api.serviceKey }}
            - name: CORS_ORIGINS
              value: {{ .Values.api.corsOrigins | quote }}
            - name: Asterisk__Ami__Hostname
              value: {{ .Values.api.asterisk.ami.hostname }}
            - name: Asterisk__Ami__Port
              value: {{ .Values.api.asterisk.ami.port | quote }}
            - name: Asterisk__Ami__Username
              value: {{ .Values.api.asterisk.ami.username }}
            - name: Asterisk__Ami__Password
              value: {{ .Values.api.asterisk.ami.password }}
            - name: Asterisk__Ari__BaseUrl
              value: {{ .Values.api.asterisk.ari.baseUrl }}
            - name: Asterisk__Ari__Username
              value: {{ .Values.api.asterisk.ari.username }}
            - name: Asterisk__Ari__Password
              value: {{ .Values.api.asterisk.ari.password }}
            - name: Asterisk__Ari__Application
              value: {{ .Values.api.asterisk.ari.application }}
            - name: Licensing__EnforcementMode
              value: {{ .Values.api.licensing.enforcementMode }}
          resources:
            requests:
              cpu: {{ .Values.api.resources.requests.cpu }}
              memory: {{ .Values.api.resources.requests.memory }}
            limits:
              cpu: {{ .Values.api.resources.limits.cpu }}
              memory: {{ .Values.api.resources.limits.memory }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: {{ .Values.api.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.port }}
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12

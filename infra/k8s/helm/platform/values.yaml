namespace: r55-platform

api:
  # ASPNETCORE_ENVIRONMENT — controls behaviour of Pro's ProductionSafetyNet
  # (Diagnostics/ProductionSafetyNet.cs). When "Production", Pro emits a
  # `LogError event-id 12002` at startup if IMAGE_DIGEST is unset (warning only,
  # non-blocking). The K8s lab sets IMAGE_DIGEST below, so 12002 will NOT fire.
  aspnetcoreEnvironment: Production
  image:
    # Canonical published registry per ADR-0011 (Pro v2.3.x image-binding).
    # Override to the local KVM dev cluster registry when validating against
    # the maintainer's k3s/Talos lab:
    #   --set api.image.repository=192.168.122.1:5050/verbara-platform/api
    repository: ghcr.io/verbara/platform/api
    tag: "v2.3.1"
    # Manifest-list digest of the `repository:tag` image, used for Layer-C
    # in-process image verification (ADR-0011, Pro v2.3.x). When set, the
    # Deployment template injects IMAGE_DIGEST env var that
    # ContainerImageDigest.ReadFromEnvironment() reads + compares against the
    # license's AuthorizedImageDigests claim. Source: the corresponding entry
    # in verbara-website/data/authorized-digests.json. Leave empty to opt out
    # (Pro falls through to permissive path; matches dev-mode semantics).
    digest: "sha256:e0c876329fbeb24cfa1fd2c3a14da905ba45953ea12e19f8756b03b313fe0a8d"
  replicas: 2
  port: 5000
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCpuPercent: 70
  postgres:
    host: postgres-pooler.r55-data.svc.cluster.local
    port: 5432
    database: verbara
    user: platform
    passwordSecret: platform-pg-credentials
    passwordKey: password
  redis:
    host: redis-0.redis.r55-data.svc.cluster.local
    port: 6379
  # Redis-backed JWT signing-key rotation pool (ADR-0012, AHH Phase 3).
  # MUST be set for multi-replica deployments — without the rotation pool,
  # each Platform.Api replica generates its own RSA key on first boot and
  # tokens signed by replica A are rejected by replica B. The chart enables
  # this by default because api.replicas defaults to 2; single-replica dev
  # deployments can override to false to keep the file-based default.
  identityRedis:
    host: redis-0.redis.r55-data.svc.cluster.local
    port: 6379
    useRotationPool: true
    requireRedisStore: true
  jwt:
    issuer: r55-staging
    audience: r55-staging
    keySecret: jwt-signing-key
    keyField: key
  serviceKey: r55-staging-service-key-change-in-prod
  corsOrigins: "http://r55.local,http://api.r55.local"
  asterisk:
    ami:
      hostname: asterisk-sip.r55-asterisk.svc.cluster.local
      port: 5038
      username: platform
      password: r55-staging-only-change-prod
    ari:
      baseUrl: http://asterisk-ari.r55-asterisk.svc.cluster.local:8088
      username: verbara
      password: r55-staging-only-change-prod
      application: verbara
  licensing:
    # DEPRECATED in Pro v2.4.0-pro; scheduled for removal in Pro v2.5.0-pro.
    # Set to "" (empty) to skip injection — Pro derives effective enforcement
    # from license presence (preferred path; see licenseFilePath below).
    # Operators upgrading from pre-v2.4.0-pro chart versions can set this to
    # `Disabled` to maintain back-compat behaviour during transition.
    enforcementMode: ""
    # Pro v2.4.0-pro+ — path inside the container to a mounted .lic file.
    # Empty / unset = community/OSS mode (Pro endpoints return HTTP 402
    # PaymentRequired + RFC 9457 ProblemDetails carrying actionable trial /
    # upgrade URLs). Acquire a free Tier 0.5 developer license at:
    #   https://verbara.io/developer-license
    licenseFilePath: "/etc/verbara/license.lic"
    # K8s Secret source for the .lic file mounted at licenseFilePath.
    # When enabled, the Deployment template adds a Secret-backed volume mount
    # at the parent dir of licenseFilePath. Operator pre-creates the Secret:
    #   kubectl create secret generic verbara-lab-license \
    #     --from-file=license.lic=./verbara-lab-v230.lic \
    #     -n r55-platform
    licenseSecret:
      enabled: true
      name: verbara-lab-license
      key: license.lic
  prometheus:
    enabled: false

web:
  image:
    # Canonical published registry per ADR-0011 (Pro v2.3.x image-binding).
    # Override to the local KVM dev cluster registry when validating against
    # the maintainer's k3s/Talos lab:
    #   --set web.image.repository=192.168.122.1:5050/verbara-platform/web
    repository: ghcr.io/verbara/platform/web
    tag: "v3.1.0-web"
  replicas: 1
  port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

ingress:
  enabled: true
  hostnameApi: api.r55.local
  hostnameWeb: r55.local
  tlsEnabled: false

# Cosign-based image verification (Pro v2.3.x Layer B, ADR-0011).
# Renders a Kyverno ClusterPolicy that requires every Pod admitted to the
# release namespace whose image matches ghcr.io/verbara/platform/* to carry a
# valid cosign signature from the Verbara cosign keypair. Default disabled
# for back-compat with clusters that have no admission-policy controller
# installed; opt in once Kyverno >= 1.11 is running in the cluster.
#
# Quick start (ghcr.io defaults + verification ON):
#   helm install platform infra/k8s/helm/platform/ \
#     --set imageVerification.enabled=true \
#     --set-file imageVerification.cosignPublicKey=infra/k8s/helm/platform/files/cosign.pub
#
# Notes:
#   - cosignPublicKey expects the raw PEM bytes (header + base64 + footer);
#     use --set-file to inject from disk rather than embedding inline.
#   - When enabled, an unsigned image (or one signed by a different key)
#     is rejected at admission time with `failed to verify signature`.
#   - The chart ships infra/k8s/helm/platform/files/cosign.pub as the
#     reference public key for convenience; rotation requires updating that
#     file AND .github/cosign.pub AND the GitHub Actions secret.
imageVerification:
  enabled: false
  cosignPublicKey: ""

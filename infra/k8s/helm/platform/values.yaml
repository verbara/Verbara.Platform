namespace: r55-platform

api:
  # ASPNETCORE_ENVIRONMENT — controls behaviour of Pro's ProductionSafetyNet
  # (Diagnostics/ProductionSafetyNet.cs). When "Production", Pro emits a
  # `LogError event-id 12002` at startup if IMAGE_DIGEST is unset (warning only,
  # non-blocking). The K8s lab sets IMAGE_DIGEST below, so 12002 will NOT fire.
  aspnetcoreEnvironment: Production
  image:
    # Canonical published registry per Pro/ADR-0011 (Pro v2.3.x image-binding).
    # Override to the local KVM dev cluster registry when validating against
    # the maintainer's k3s/Talos lab:
    #   --set api.image.repository=192.168.122.1:5050/verbara-platform/api
    repository: ghcr.io/verbara/platform/api
    tag: "v2.6.0"
    # Manifest-list digest of the `repository:tag` image, used for Layer-C
    # in-process image verification (Pro/ADR-0011, Pro v2.3.x). When set, the
    # Deployment template injects IMAGE_DIGEST env var that
    # ContainerImageDigest.ReadFromEnvironment() reads + compares against the
    # license's AuthorizedImageDigests claim. Source: the corresponding entry
    # in verbara-website/data/authorized-digests.json. Leave empty to opt out
    # (Pro falls through to permissive path; matches dev-mode semantics).
    #
    # v2.6.0 — captured via `crane digest ghcr.io/verbara/platform/api:v2.6.0`
    # after the v2.6.0 release.yml run (ADR-0026 Phase A+B membership executive
    # routing + ADR-0028 mandatory-Customer setup). Authorized in verbara-website
    # data/authorized-digests.json current[] (PR #23). Capture with
    # `crane digest <ref:tag>` (NOT `docker manifest inspect | jq .config.digest`
    # which returns the config-digest — the v2.5.3 mistake fixed in PR #22).
    digest: "sha256:a627e0aab6b3f48acddf4978c842612ac5f31faa7d8d2bbd9971176ec37bd34a"
  replicas: 2
  port: 5000
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCpuPercent: 70
  postgres:
    host: postgres-pooler.r55-data.svc.cluster.local
    port: 5432
    database: verbara
    user: platform
    passwordSecret: platform-pg-credentials
    passwordKey: password
  redis:
    host: redis-0.redis.r55-data.svc.cluster.local
    port: 6379
  # Redis-backed JWT signing-key rotation pool (ADR-0012, AHH Phase 3).
  # MUST be set for multi-replica deployments — without the rotation pool,
  # each Platform.Api replica generates its own RSA key on first boot and
  # tokens signed by replica A are rejected by replica B. The chart enables
  # this by default because api.replicas defaults to 2; single-replica dev
  # deployments can override to false to keep the file-based default.
  identityRedis:
    host: redis-0.redis.r55-data.svc.cluster.local
    port: 6379
    useRotationPool: true
    requireRedisStore: true
  jwt:
    issuer: r55-staging
    audience: r55-staging
    keySecret: jwt-signing-key
    keyField: key
  serviceKey: r55-staging-service-key-change-in-prod
  corsOrigins: "http://r55.local,http://api.r55.local"
  asterisk:
    ami:
      hostname: asterisk-sip.r55-asterisk.svc.cluster.local
      port: 5038
      username: platform
      password: r55-staging-only-change-prod
    ari:
      baseUrl: http://asterisk-ari.r55-asterisk.svc.cluster.local:8088
      username: verbara
      password: r55-staging-only-change-prod
      application: verbara
  licensing:
    # DEPRECATED in Pro v2.4.0-pro; scheduled for removal in Pro v2.5.0-pro.
    # Set to "" (empty) to skip injection — Pro derives effective enforcement
    # from license presence (preferred path; see licenseFilePath below).
    # Operators upgrading from pre-v2.4.0-pro chart versions can set this to
    # `Disabled` to maintain back-compat behaviour during transition.
    enforcementMode: ""
    # Pro v2.4.0-pro+ — path inside the container to a mounted .lic file.
    # Empty / unset = community/OSS mode (Pro endpoints return HTTP 402
    # PaymentRequired + RFC 9457 ProblemDetails carrying actionable trial /
    # upgrade URLs). Acquire a free Tier 0.5 developer license at:
    #   https://verbara.io/developer-license
    licenseFilePath: "/etc/verbara/license.lic"
    # K8s Secret source for the .lic file mounted at licenseFilePath.
    # When enabled, the Deployment template adds a Secret-backed volume mount
    # at the parent dir of licenseFilePath. Operator pre-creates the Secret:
    #   kubectl create secret generic verbara-lab-license \
    #     --from-file=license.lic=./verbara-lab-v230.lic \
    #     -n r55-platform
    licenseSecret:
      enabled: true
      name: verbara-lab-license
      key: license.lic
  prometheus:
    # Defaults to true: ships the platform-api ServiceMonitor so Prometheus
    # Operator (kube-prometheus-stack) scrapes /metrics on every install.
    # Set to false only on clusters where Prometheus Operator CRDs are absent
    # (otherwise `helm install` fails with `no matches for kind ServiceMonitor`).
    enabled: true

web:
  image:
    # Canonical published registry per Pro/ADR-0011 (Pro v2.3.x image-binding).
    # Override to the local KVM dev cluster registry when validating against
    # the maintainer's k3s/Talos lab:
    #   --set web.image.repository=192.168.122.1:5050/verbara-platform/web
    repository: ghcr.io/verbara/platform/web
    tag: "v3.2.0-web"
  replicas: 1
  port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

ingress:
  enabled: true
  hostnameApi: api.r55.local
  hostnameWeb: r55.local
  tlsEnabled: false

# Cosign-based image verification (Pro v2.3.x Layer B, Pro/ADR-0011).
# Renders a Kyverno ClusterPolicy that requires every Pod admitted to the
# release namespace whose image matches ghcr.io/verbara/platform/* to carry a
# valid cosign signature from the Verbara cosign keypair. Default disabled
# for back-compat with clusters that have no admission-policy controller
# installed; opt in once Kyverno >= 1.11 is running in the cluster.
#
# Quick start (ghcr.io defaults + verification ON):
#   helm install platform infra/k8s/helm/platform/ \
#     --set imageVerification.enabled=true \
#     --set-file imageVerification.cosignPublicKey=infra/k8s/helm/platform/files/cosign.pub
#
# Notes:
#   - cosignPublicKey expects the raw PEM bytes (header + base64 + footer);
#     use --set-file to inject from disk rather than embedding inline.
#   - When enabled, an unsigned image (or one signed by a different key)
#     is rejected at admission time with `failed to verify signature`.
#   - The chart ships infra/k8s/helm/platform/files/cosign.pub as the
#     reference public key for convenience; rotation requires updating that
#     file AND .github/cosign.pub AND the GitHub Actions secret.
imageVerification:
  enabled: false
  cosignPublicKey: ""

# Verbara.Platform.Realtime — SignalR Hub microservice extracted from
# Verbara.Platform.Api per ADR-0022 to unblock Native AOT on the API host.
# Phase A.1 deploys only the /health-only scaffold; A.2+A.3 cutover wires
# the actual Hub + Pro.Cluster + SignalR Redis backplane.
realtime:
  aspnetcoreEnvironment: Production
  image:
    # Canonical published registry per Pro/ADR-0011. Override to the local KVM dev
    # registry when validating against the maintainer's k3s/Talos lab:
    #   --set realtime.image.repository=192.168.122.1:5050/verbara-platform/realtime
    repository: ghcr.io/verbara/platform/realtime
    tag: "v2.6.0"
    # Image-digest binding (Pro/ADR-0011 Layer C) — Pro license verification
    # extends to the Realtime image via the AuthorizedImageDigests claim.
    # Leave empty for tag-only references (dev / local registry).
    #
    # v2.6.0 — captured via `crane digest ghcr.io/verbara/platform/realtime:v2.6.0`
    # after the v2.6.0 release.yml run, authorized in verbara-website current[]
    # (PR #23). Realtime carries no semantic change in v2.6.0 (ADR-0026 Phase A+B
    # touched Platform.Api + Pro only); the rebuild captures the SDK/Pro restore +
    # 0-warning compile against main.
    digest: "sha256:f9cd38911b2773a27f50ccb062dffb2c0845ea7ac17d4400f746c8c92dd009a2"
  replicas: 1
  port: 5030
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  hpa:
    # Post-Phase A.5 (CLOSED): Pro.Cluster now exposes a per-resource
    # IClusterLeader (keyed `realtime:fanout:leader`); PushToHubRelay short-
    # circuits forwards when !IsLeader so exactly one pod publishes to the
    # SignalR backplane at any moment. Production cap is 4 replicas — gives
    # HA + node-loss tolerance without inflating Postgres connection count
    # from the renewal loop (4 pods × 0.1 qps = negligible).
    enabled: true
    minReplicas: 1
    maxReplicas: 4
    targetCpuPercent: 70
  # Phase A.5 cluster-leader-election wiring. Drives the env vars projected
  # into the Realtime container (see realtime-deployment.yaml):
  #   - connectionStringName: which ConnectionStrings__* key Pro.Cluster reads
  #     for the distributed-lock backend (falls back to ConnectionStrings__Postgres
  #     at runtime if the dedicated entry is unset).
  #   - leaderResource: the keyed IClusterLeader registration string consumed
  #     by PushToHubRelay via [FromKeyedServices(...)].
  #   - instanceIdFromEnv: downward-API env var name that uniquely identifies
  #     this pod as the lock owner (`Cluster__InstanceId = $(POD_NAME)`).
  cluster:
    connectionStringName: Cluster   # falls back to ConnectionStrings__Postgres if unset at runtime
    leaderResource: realtime:fanout:leader  # IClusterLeader keyed registration
    instanceIdFromEnv: POD_NAME      # downward-API field for unique instance ID per pod
  # ADR-0022 Phase A.2+A.3 — the SignalR Hub now lives ONLY in this
  # microservice. The Platform.Api HTTPRoute no longer matches /hubs/*, so the
  # Realtime HTTPRoute owns that prefix cleanly. Set to false on bring-up
  # environments where the Realtime service hasn't been deployed yet.
  ingress:
    enabled: true

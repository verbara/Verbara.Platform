name: CI

# Build + unit-test gate for Verbara.Platform PRs (closes the "no build-time CI"
# gap — this repo previously had only release/digest/visibility workflows, so PRs
# were never validated in CI). The Release build is the headline gate: it enforces
# TreatWarningsAsErrors=true / WarningLevel=9999 (Directory.Build.props) across all
# ~40 projects. Full Native AOT publish stays in release.yml (slow, tag-triggered);
# this gate is the fast feedback loop.
#
# NOTE (private Pro packages): Verbara.Sdk.Pro.* live on the private GitHub Packages
# NuGet feed (source `github` in NuGet.Config). Restore authenticates with the
# PACKAGES_PAT Actions secret (the same one release.yml already uses). Same-repo
# PRs (verbara/* branches) get the secret; PRs from forks do NOT — fork CI will
# fail at restore by design (Pro is closed-source).

# Triggers: pull_request validates each PR; merge_group runs the authoritative gate on
# the tentative merge result before it lands (merge queue). The post-merge push:[main]
# run was intentionally dropped — it re-tested the exact tree the PR/merge-queue already
# validated (pure redundancy / double-run per PR). Security baseline freshness on real
# main is kept in codeql.yml, which retains push:[main] (the merge_group ref is not main).
on:
  pull_request:
    branches: [main]
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs, but never cancel an in-flight merge-queue run — the
  # tentative merge must be fully validated before landing (a cancelled run reads as
  # "cancelled", not "failed", so a half-built result would pass unnoticed).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build + Unit Tests (Release)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup .NET
        uses: actions/setup-dotnet@v5.2.0
        with:
          dotnet-version: "10.0.x"

      - name: Authenticate private NuGet feed (Verbara.Sdk.Pro.*)
        # Mirrors the Dockerfile restore-auth: drop the maintainer-only `local`
        # source (its path doesn't exist on the runner) and inject the GitHub
        # Packages credentials into the `github` source. PAT passed via env (never
        # interpolated directly into the run-block) to avoid script injection.
        env:
          PACKAGES_PAT: ${{ secrets.PACKAGES_PAT }}
        run: |
          set -euo pipefail
          dotnet nuget remove source local 2>/dev/null || true
          dotnet nuget update source github \
            --username verbara \
            --password "$PACKAGES_PAT" \
            --store-password-in-clear-text

      - name: Build (Release, warnings-as-errors)
        run: dotnet build Verbara.Platform.slnx -c Release

      - name: Unit tests
        # Excludes ONLY the two genuinely container-backed test projects —
        # Storage.Postgres.Tests (Postgres Testcontainer) and Identity.Redis.Tests
        # (Redis) — which hard-fail without Docker. The filter targets each
        # project's namespace PRECISELY rather than the bare tokens
        # "Postgres"/"Redis"/"Integration": those substrings also appear in
        # legitimate in-memory unit tests elsewhere (e.g. Api.Tests'
        # AuthIntegrationTests and PostgresHealthCheckTests use an in-memory
        # WebApplicationFactory / fakes, no container) which we DO want to run.
        # Tradeoff: the handful of container-free DI-registration tests that live
        # INSIDE the two excluded projects are skipped with them — an acceptable
        # minority. Platform separates unit vs integration by PROJECT, not by a
        # [Category] trait (only one test in the whole suite is traited).
        run: >-
          dotnet test Verbara.Platform.slnx --no-build -c Release
          --filter "FullyQualifiedName!~Storage.Postgres.Tests&FullyQualifiedName!~Identity.Redis.Tests"
          --logger "console;verbosity=normal"

  coverage:
    name: Coverage Ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Blocking line-coverage ratchet, mirroring Platform.Web's coverage job. Runs
    # the SAME unit subset as build-and-test (the floor must measure the population
    # CI actually runs), collects coverage via coverlet.runsettings, merges the
    # per-project cobertura with ReportGenerator, and fails if the merged line-rate
    # drops below coverage-floor.json. The floor is raised manually (no CI write-back).
    # Baseline + rationale: docs/research/2026-06-14-platform-coverage-baseline.md.
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup .NET
        uses: actions/setup-dotnet@v5.2.0
        with:
          dotnet-version: "10.0.x"

      - name: Authenticate private NuGet feed (Verbara.Sdk.Pro.*)
        env:
          PACKAGES_PAT: ${{ secrets.PACKAGES_PAT }}
        run: |
          set -euo pipefail
          dotnet nuget remove source local 2>/dev/null || true
          dotnet nuget update source github \
            --username verbara \
            --password "$PACKAGES_PAT" \
            --store-password-in-clear-text

      - name: Build (Release)
        run: dotnet build Verbara.Platform.slnx -c Release

      - name: Unit tests with coverage
        # Same filter as build-and-test. coverlet.runsettings excludes test asms,
        # generated code, migrations, and the container-only src assemblies
        # (Storage.Postgres / Identity.Redis) so the gate measures unit-tested code.
        run: >-
          dotnet test Verbara.Platform.slnx --no-build -c Release
          --filter "FullyQualifiedName!~Storage.Postgres.Tests&FullyQualifiedName!~Identity.Redis.Tests"
          --collect:"XPlat Code Coverage" --settings coverlet.runsettings
          --results-directory ${{ github.workspace }}/coverage

      - name: Merge coverage report
        run: |
          dotnet tool restore
          dotnet reportgenerator \
            -reports:"coverage/**/coverage.cobertura.xml" \
            -targetdir:"coverage/report" \
            -reporttypes:"Cobertura;TextSummary;HtmlInline_AzurePipelines"

      - name: Enforce line-coverage floor (manual ratchet)
        run: python3 scripts/check-coverage-floor.py coverage/report/Cobertura.xml coverage-floor.json

      - name: Upload coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4.6.2
        with:
          name: coverage-${{ github.sha }}
          path: coverage/report

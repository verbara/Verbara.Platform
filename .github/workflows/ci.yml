name: CI

# Build + unit-test gate for Verbara.Platform PRs (closes the "no build-time CI"
# gap — this repo previously had only release/digest/visibility workflows, so PRs
# were never validated in CI). The Release build is the headline gate: it enforces
# TreatWarningsAsErrors=true / WarningLevel=9999 (Directory.Build.props) across all
# ~40 projects. Full Native AOT publish stays in release.yml (slow, tag-triggered);
# this gate is the fast feedback loop.
#
# NOTE (private Pro packages): Verbara.Sdk.Pro.* live on the private GitHub Packages
# NuGet feed (source `github` in NuGet.Config). Restore authenticates with the
# PACKAGES_PAT Actions secret (the same one release.yml already uses). Same-repo
# PRs (verbara/* branches) get the secret; PRs from forks do NOT — fork CI will
# fail at restore by design (Pro is closed-source).

# Triggers: pull_request validates each PR; merge_group runs the authoritative gate on
# the tentative merge result before it lands (merge queue). The post-merge push:[main]
# run was intentionally dropped — it re-tested the exact tree the PR/merge-queue already
# validated (pure redundancy / double-run per PR). Security baseline freshness on real
# main is kept in codeql.yml, which retains push:[main] (the merge_group ref is not main).
on:
  pull_request:
    branches: [main]
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs, but never cancel an in-flight merge-queue run — the
  # tentative merge must be fully validated before landing (a cancelled run reads as
  # "cancelled", not "failed", so a half-built result would pass unnoticed).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build + Unit Tests (Release)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5.3.0
        with:
          dotnet-version: "10.0.x"

      - name: Authenticate private NuGet feed (Verbara.Sdk.Pro.*)
        # Mirrors the Dockerfile restore-auth: drop the maintainer-only `local`
        # source (its path doesn't exist on the runner) and inject the GitHub
        # Packages credentials into the `github` source. PAT passed via env (never
        # interpolated directly into the run-block) to avoid script injection.
        env:
          PACKAGES_PAT: ${{ secrets.PACKAGES_PAT }}
        run: |
          set -euo pipefail
          dotnet nuget remove source local 2>/dev/null || true
          dotnet nuget update source github \
            --username verbara \
            --password "$PACKAGES_PAT" \
            --store-password-in-clear-text

      - name: Build (Release, warnings-as-errors)
        run: dotnet build Verbara.Platform.slnx -c Release

      - name: Unit tests
        # Excludes ONLY the two genuinely container-backed test projects —
        # Storage.Postgres.Tests (Postgres Testcontainer) and Identity.Redis.Tests
        # (Redis) — which hard-fail without Docker. The filter targets each
        # project's namespace PRECISELY rather than the bare tokens
        # "Postgres"/"Redis"/"Integration": those substrings also appear in
        # legitimate in-memory unit tests elsewhere (e.g. Api.Tests'
        # AuthIntegrationTests and PostgresHealthCheckTests use an in-memory
        # WebApplicationFactory / fakes, no container) which we DO want to run.
        # Tradeoff: the handful of container-free DI-registration tests that live
        # INSIDE the two excluded projects are skipped with them — an acceptable
        # minority. Platform separates unit vs integration by PROJECT, not by a
        # [Category] trait (only one test in the whole suite is traited).
        run: >-
          dotnet test Verbara.Platform.slnx --no-build -c Release
          --filter "FullyQualifiedName!~Storage.Postgres.Tests&FullyQualifiedName!~Identity.Redis.Tests"
          --logger "console;verbosity=normal"

  # live-postgres-ci-lane: runs the two genuinely container-backed test projects
  # build-and-test excludes above (Storage.Postgres.Tests, Identity.Redis.Tests)
  # against real Postgres/Redis Testcontainers. Own job (not a filter flip on
  # build-and-test) so the fast unit lane stays fast and this lane's container
  # startup cost is isolated and easy to size independently.
  #
  # REPORT-ONLY, not a required check (see the change's design.md
  # Grounding-resolution note, openspec/changes/live-postgres-ci-lane/design.md):
  # `continue-on-error: true` on both test steps means a red run does NOT block
  # merge. This is a deliberate, evidence-based call, not a placeholder — local
  # grounding reproduced a REAL, repeatable flake in Storage.Postgres.Tests, root-
  # caused to the official postgres:16-alpine image's bootstrap-then-restart
  # entrypoint sequence: pg_isready (checked over the container's internal Unix
  # socket) can report "accepting connections" a moment before the container's
  # published TCP port (what the host-side Npgsql client actually dials) is
  # reliably reachable, surfacing as "Connection reset by peer" on the fixture's
  # first NpgsqlConnection.OpenAsync() — inside InitializeAsync(), never mid-test.
  # xunit.runner.json (parallelizeTestCollections:false, added to both projects)
  # reduces concurrent-container pressure (each of the ~13/~8 fixture classes owns
  # its own container; xUnit parallelizes collections by default) and the two
  # projects run as separate sequential steps below rather than one combined
  # invocation — but serialization alone did NOT eliminate the race in repeated
  # local runs (it is a per-container timing issue, not purely contention), so
  # promoting this to required now would intermittently block unrelated PRs.
  # Identity.Redis.Tests was 100% clean in every local configuration (Redis's
  # image has no analogous restart cycle). Promotion trigger: a fixture-level fix
  # (bounded connect-retry, or adopting the Testcontainers.PostgreSql module's
  # log-based double-ready wait strategy) across the ~13 Postgres fixtures,
  # tracked as an OpenSpec follow-up once this lane ships.
  live-db-tests:
    name: Live-DB Tests (Postgres)
    runs-on: ubuntu-latest
    # Sized from local grounding: Storage.Postgres.Tests alone (~13 sequential
    # Testcontainers Postgres containers with parallelizeTestCollections:false)
    # ran in ~60-70s; Identity.Redis.Tests (~8 sequential Redis containers) in
    # ~7-10s. 15 minutes leaves generous headroom for CI-runner variance (slower
    # image pulls, noisier neighbors) without masking a real hang.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5.3.0
        with:
          dotnet-version: "10.0.x"

      - name: Authenticate private NuGet feed (Verbara.Sdk.Pro.*)
        env:
          PACKAGES_PAT: ${{ secrets.PACKAGES_PAT }}
        run: |
          set -euo pipefail
          dotnet nuget remove source local 2>/dev/null || true
          dotnet nuget update source github \
            --username verbara \
            --password "$PACKAGES_PAT" \
            --store-password-in-clear-text

      - name: Build (Release, warnings-as-errors)
        run: dotnet build Verbara.Platform.slnx -c Release

      - name: Live-DB tests — Storage.Postgres.Tests
        # Run as its own step/project (not combined with Identity.Redis.Tests
        # below) — see the job-level grounding note: combining both projects into
        # one dotnet test/vstest invocation reintroduces cross-project container
        # concurrency that per-project collection-serialization alone doesn't
        # cover, and reproduced real "Connection reset by peer" flake locally.
        continue-on-error: true
        run: >-
          dotnet test tests/Verbara.Platform.Storage.Postgres.Tests/Verbara.Platform.Storage.Postgres.Tests.csproj
          --no-build -c Release --logger "console;verbosity=normal"

      - name: Live-DB tests — Identity.Redis.Tests
        continue-on-error: true
        run: >-
          dotnet test tests/Verbara.Platform.Identity.Redis.Tests/Verbara.Platform.Identity.Redis.Tests.csproj
          --no-build -c Release --logger "console;verbosity=normal"

  coverage:
    name: Coverage Ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Blocking line-coverage ratchet, mirroring Platform.Web's coverage job. Runs
    # the SAME unit subset as build-and-test (the floor must measure the population
    # CI actually runs), collects coverage via coverlet.runsettings, merges the
    # per-project cobertura with ReportGenerator, and fails if the merged line-rate
    # drops below coverage-floor.json. The floor is raised manually (no CI write-back).
    # Baseline + rationale: docs/research/2026-06-14-platform-coverage-baseline.md.
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5.3.0
        with:
          dotnet-version: "10.0.x"

      - name: Authenticate private NuGet feed (Verbara.Sdk.Pro.*)
        env:
          PACKAGES_PAT: ${{ secrets.PACKAGES_PAT }}
        run: |
          set -euo pipefail
          dotnet nuget remove source local 2>/dev/null || true
          dotnet nuget update source github \
            --username verbara \
            --password "$PACKAGES_PAT" \
            --store-password-in-clear-text

      - name: Build (Release)
        run: dotnet build Verbara.Platform.slnx -c Release

      - name: Unit tests with coverage
        # Same filter as build-and-test. coverlet.runsettings excludes test asms,
        # generated code, migrations, and the container-only src assemblies
        # (Storage.Postgres / Identity.Redis) so the gate measures unit-tested code.
        run: >-
          dotnet test Verbara.Platform.slnx --no-build -c Release
          --filter "FullyQualifiedName!~Storage.Postgres.Tests&FullyQualifiedName!~Identity.Redis.Tests"
          --collect:"XPlat Code Coverage" --settings coverlet.runsettings
          --results-directory ${{ github.workspace }}/coverage

      - name: Merge coverage report
        run: |
          dotnet tool restore
          dotnet reportgenerator \
            -reports:"coverage/**/coverage.cobertura.xml" \
            -targetdir:"coverage/report" \
            -reporttypes:"Cobertura;TextSummary;HtmlInline_AzurePipelines"

      - name: Enforce line-coverage floor (manual ratchet)
        run: python3 scripts/check-coverage-floor.py coverage/report/Cobertura.xml coverage-floor.json

      - name: Upload coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-${{ github.sha }}
          path: coverage/report

  # OpenSpec docs gate (2026-07-04 ecosystem audit): the living specs + changes are
  # agent-edited markdown with a strict parser — validate them like code. Pinned CLI
  # version (upgrade deliberately). Runs on PR + merge_group like every other gate.
  openspec:
    name: OpenSpec Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate specs and changes (strict)
        run: npx -y @fission-ai/openspec@1.4.1 validate --all --strict --no-interactive

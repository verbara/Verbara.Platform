name: CodeQL

# Static security analysis (SAST) for the Platform C# codebase — the crown-jewel
# API + Pro IP previously had no SAST. Verbara.Platform is a PUBLIC repo, so CodeQL
# runs on the free tier (no GitHub Advanced Security licence required).
#
# CodeQL must BUILD the solution to analyze C#, so this workflow needs the same
# private-Pro-feed authentication as ci.yml (PACKAGES_PAT). No merge_group trigger:
# this repo has no merge queue (unlike Verbara.Sdk).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Docs/data-only CI fast-path §2 (verbara-meta/ADR-0016): CodeQL is NON-required and
    # has NO merge_group trigger, so a workflow-level paths-ignore here is safe — it strands
    # no required context (unlike ci.yml, where paths-ignore is BANNED). Skips the ~12-16 min
    # SAST build on a docs/data-only PR. The allowlist inverse of §3.4 (docs/**, **/*.md,
    # CHANGELOG.md); push:[main] + schedule keep the default-branch baseline fresh.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "CHANGELOG.md"
  schedule:
    # Weekly Sundays 06:00 UTC — keeps the default-branch security baseline fresh
    # without pressuring weekday CI.
    - cron: "0 6 * * 0"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (C#)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Authenticate private NuGet feed (Verbara.Sdk.Pro.*)
        env:
          PACKAGES_PAT: ${{ secrets.PACKAGES_PAT }}
        run: |
          set -euo pipefail
          dotnet nuget remove source local 2>/dev/null || true
          dotnet nuget update source github \
            --username verbara \
            --password "$PACKAGES_PAT" \
            --store-password-in-clear-text

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.38.1
        with:
          languages: csharp
          # Trace exactly the `dotnet build` step below. Without build-mode the
          # csharp default is autobuild, which would run a second redundant build
          # (and can analyze a partial DB / miss the traced source). See GitHub's
          # "build options for compiled languages" docs.
          build-mode: manual
          queries: security-extended,security-and-quality

      - name: Build solution
        run: dotnet build Verbara.Platform.slnx -c Release --no-incremental

      # Results in code the .NET SDK's own source generators write under obj/**/generated/ (System.Text.Json,
      # the ASP.NET Core request-delegate generator, …) are notes on code no change here can reach — 3,772 of
      # the 4,359 on main at d1c8c49e. paths-ignore is not honoured for a compiled language analysed from a
      # traced build, so analyze writes its SARIF without uploading it, scripts/ci/filter-codeql-sarif.sh drops
      # those results (never a security one), and upload-sarif sends the rest under the SAME category: every
      # other alert keeps its history, and the generator ones close as fixed. The wiring is asserted by
      # scripts/tests/test_filter_codeql_sarif.sh in ci.yml's Coverage Script Tests job.
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4.38.1
        with:
          category: "/language:csharp"
          upload: failure-only
          output: ${{ runner.temp }}/codeql-sarif

      # Fails closed: a file the filter cannot read as one SARIF 2.1.0 log exits 2 and writes nothing, so this job
      # goes red and the upload below never runs — the baseline is never replaced by an unfiltered log.
      - name: Drop results in .NET source-generator output
        env:
          RAW_SARIF_DIR: ${{ runner.temp }}/codeql-sarif
          FILTERED_SARIF_DIR: ${{ runner.temp }}/codeql-sarif-filtered
        run: |
          shopt -s nullglob
          sarifs=("$RAW_SARIF_DIR"/*.sarif)
          if [ "${#sarifs[@]}" -eq 0 ]; then
            echo "::error::analyze wrote no .sarif file to $RAW_SARIF_DIR — nothing to filter, so nothing is uploaded."
            exit 1
          fi
          mkdir -p "$FILTERED_SARIF_DIR"
          for sarif in "${sarifs[@]}"; do
            bash ./scripts/ci/filter-codeql-sarif.sh "$sarif" "$FILTERED_SARIF_DIR/$(basename "$sarif")"
          done

      - name: Upload filtered CodeQL results
        uses: github/codeql-action/upload-sarif@v4.38.1
        with:
          sarif_file: ${{ runner.temp }}/codeql-sarif-filtered
          category: "/language:csharp"

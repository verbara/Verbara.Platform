# Verbara platform image visibility + signature regression monitor.
# Per ADR-0023 (Accepted 2026-05-23), all 5 ghcr.io/verbara/platform/* packages
# (api, realtime, renderer, mail, web) MUST be (1) publicly pullable AND (2)
# cosign-signed against the keypair committed at `.github/cosign.pub`.
# Customers consuming our compose / Helm chart depend on:
#   - anonymous `docker pull` working (the UX);
#   - `cosign verify --key https://verbara.io/keys/cosign.pub ...` passing
#     (the supply-chain trust contract).
# This workflow detects regressions on either dimension:
#   - someone flips a package to "private" in the GitHub Packages UI,
#   - ghcr.io changes anonymous-pull semantics,
#   - someone pushes a tag via `docker buildx push` directly (bypassing
#     `release.yml`) → image lands unsigned, breaks ADR-0023.
#
# Belt-and-suspenders coverage:
#   1. `docker pull` after `docker logout ghcr.io` replicates the actual
#      customer UX — catches anonymous-token issuance regressions.
#   2. `cosign verify --key .github/cosign.pub` against each tag catches
#      the "unsigned image at signed tag" regression (the v2.4.2 anomaly
#      that motivated this hardening — see ADR-0024).
#
# If either check fails for any of the 5 packages, the workflow fails and
# auto-opens an issue (default GitHub Actions failure email also fires).
#
# Triggers:
#   - schedule: daily at 06:00 UTC (catches manual UI flips within ~24 h)
#   - workflow_dispatch: maintainer can run on demand after a release
#   - push to main on Dockerfile / .github/workflows/release.yml / this file
#     (early warning if a release pipeline change accidentally changes the
#      upload visibility default)

name: visibility-monitor

"on":
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "src/Verbara.Platform.Realtime/Dockerfile.realtime"
      - "src/Verbara.Platform.Renderer/Dockerfile.renderer"
      - "src/Verbara.Platform.Mail/Dockerfile.mail"
      - ".github/workflows/release.yml"
      - ".github/workflows/visibility-monitor.yml"

permissions:
  contents: read
  issues: write   # only for the auto-issue-on-failure step
  # Note: `packages: read` is intentionally NOT requested. The org-scoped
  # /orgs/verbara/packages/container/<svc> API requires `read:packages` (an
  # org-admin scope), which neither GITHUB_TOKEN nor a default PAT has. We
  # rely on anonymous `docker pull` instead — that's the actual customer UX
  # test, and it needs no auth for public packages.

jobs:
  check-visibility:
    name: Assert all 5 platform packages are public AND signed
    runs-on: ubuntu-24.04
    env:
      # Tags hardcoded as the maintainer-of-record for "what's the current
      # customer-facing release". Bump alongside Directory.Build.props (and
      # Platform.Web's package.json for WEB_TAG) on each release tag push.
      # Verifying ONE signed tag per package is sufficient to detect both
      # visibility-flip AND signature-drop regressions — GHCR's visibility
      # setting is per-package (not per-version), and cosign signatures are
      # attached per-digest so an unsigned push to a known tag is detectable.
      PLATFORM_TAG: v2.23.0
      WEB_TAG: v3.19.0-web
    steps:
      - name: Checkout source (for .github/cosign.pub)
        uses: actions/checkout@v7

      - name: Assert anonymous docker pull works
        # We dropped the prior gh-api visibility-poll because the org-scoped
        # endpoint /orgs/verbara/packages/container/<svc> requires `read:packages`
        # scope (an org-admin scope), which neither the workflow's auto-generated
        # GITHUB_TOKEN nor the maintainer's standard PAT has. The docker-pull
        # test is the actual customer UX check anyway — if `docker pull` works
        # anonymously, the package is public regardless of what any API says.
        run: |
          set -e
          docker logout ghcr.io 2>/dev/null || true
          fail=0
          for pkg in api realtime renderer mail; do
            if docker pull --quiet "ghcr.io/verbara/platform/${pkg}:${PLATFORM_TAG}" >/dev/null 2>&1; then
              echo "OK   anonymous docker pull ghcr.io/verbara/platform/${pkg}:${PLATFORM_TAG}"
            else
              echo "::error::anonymous docker pull FAILED for ghcr.io/verbara/platform/${pkg}:${PLATFORM_TAG} (regressed to private?)"
              fail=$((fail + 1))
            fi
          done
          if docker pull --quiet "ghcr.io/verbara/platform/web:${WEB_TAG}" >/dev/null 2>&1; then
            echo "OK   anonymous docker pull ghcr.io/verbara/platform/web:${WEB_TAG}"
          else
            echo "::error::anonymous docker pull FAILED for ghcr.io/verbara/platform/web:${WEB_TAG} (regressed to private?)"
            fail=$((fail + 1))
          fi
          if [ $fail -gt 0 ]; then
            echo
            echo "::error::$fail of 5 platform packages are NOT anonymously pullable — ADR-0023 contract broken"
            exit 1
          fi

      - name: Install cosign
        # Pin v3.0.6 — matches the maintainer-side cosign on local builds.
        # The v2.4.2 anomaly traced (in part) to a v2.5.2 ↔ v3.0.6 incompat:
        # signatures produced by cosign v3.x use a refactored detached-sig
        # distribution layout that cosign v2.5.2 cannot read (verify returns
        # "no matching signatures"). The 2026-05-23 sweep aligns monitor +
        # reconciliation + release.yml all on cosign v3.0.6.
        # See ADR-0024 §Process Hardening for the version-drift incident.
        # The Verbara signing posture still skips Rekor (`--tlog-upload=false`);
        # verification consumers must pass `--insecure-ignore-tlog` to match.
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: 'v3.0.6'

      - name: Assert cosign signatures present on all 5 packages
        # Per ADR-0023: every public image MUST be cosign-signed against the
        # keypair committed at `.github/cosign.pub` (same key shared with
        # `Verbara.Platform.Web/.github/cosign.pub` by design — see Web
        # release.yml header). An unsigned tag is an ADR-0023 violation.
        #
        # The v2.4.2 anomaly (caught 2026-05-23, see ADR-0024) was: a
        # maintainer ran `docker buildx build --push` directly to ghcr.io,
        # bypassing release.yml, and the visibility-monitor at the time only
        # checked anonymous pull — not signature — so the unsigned state
        # went undetected for ~13 hours. This step closes that hole.
        run: |
          set -e
          fail=0
          for pkg in api realtime renderer mail; do
            ref="ghcr.io/verbara/platform/${pkg}:${PLATFORM_TAG}"
            if cosign verify --key .github/cosign.pub --insecure-ignore-tlog "$ref" >/dev/null 2>&1; then
              echo "OK   cosign verify $ref"
            else
              echo "::error::cosign verify FAILED for $ref (unsigned or wrong key — ADR-0023 violation)"
              fail=$((fail + 1))
            fi
          done
          ref="ghcr.io/verbara/platform/web:${WEB_TAG}"
          if cosign verify --key .github/cosign.pub --insecure-ignore-tlog "$ref" >/dev/null 2>&1; then
            echo "OK   cosign verify $ref"
          else
            echo "::error::cosign verify FAILED for $ref (unsigned or wrong key — ADR-0023 violation)"
            fail=$((fail + 1))
          fi
          if [ $fail -gt 0 ]; then
            echo
            echo "::error::$fail of 5 platform packages FAILED cosign verification — ADR-0023 contract broken"
            exit 1
          fi

      - name: Assert public cosign.pub URL matches in-repo PEM key
        # The customer-facing verify command in the SMB manuales uses
        # `--key https://verbara.io/keys/cosign.pub` (the published static
        # asset served by verbara-website). If the website serves a stale
        # or different key, customers' verify commands fail even though our
        # CI passes. This step catches that drift.
        #
        # The original cosign.pub publication gap (verbara-website PR #16)
        # was caught during the v2.4.2 audit when the URL returned HTTP 404.
        #
        # Compares ONLY the PEM block (-----BEGIN/END PUBLIC KEY-----), NOT
        # the surrounding comments. Both files intentionally carry different
        # comment headers — `.github/cosign.pub` is the release.yml-internal
        # pointer (3 short lines: name + custody pointer + ops runbook),
        # while `verbara-website/public/keys/cosign.pub` is the customer-
        # facing document (image inventory + verify command + diff-vs-repo
        # instruction + custody pointer + signing-posture note). Comparing
        # full-file sha256 would always fail by design. Comparing the PEM
        # block verifies the only bytes cosign actually consumes — the ones
        # that produce an equivalent verifier.
        run: |
          set -e
          # Stream curl → sed → sha256sum directly (no intermediate variable):
          # capturing curl output into `$(...)` strips trailing newlines (bash
          # semantics), causing a spurious sha256 mismatch against the local
          # file which retains them. Direct pipelines preserve byte-for-byte.
          local_pem=$(sed -n '/BEGIN PUBLIC KEY/,/END PUBLIC KEY/p' .github/cosign.pub | sha256sum | awk '{print $1}')
          remote_http=$(curl -fsSL -o /tmp/remote-cosign.pub -w '%{http_code}' https://verbara.io/keys/cosign.pub 2>/dev/null || echo 'curl-fail')
          if [ "$remote_http" != "200" ] || [ ! -s /tmp/remote-cosign.pub ]; then
            echo "::error::https://verbara.io/keys/cosign.pub returned http=${remote_http} or empty body (verbara-website regression)"
            exit 1
          fi
          remote_pem=$(sed -n '/BEGIN PUBLIC KEY/,/END PUBLIC KEY/p' /tmp/remote-cosign.pub | sha256sum | awk '{print $1}')
          if [ -z "$remote_pem" ] || [ "$remote_pem" = "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855" ]; then
            echo "::error::https://verbara.io/keys/cosign.pub does not contain a PEM block (wrong content served)"
            echo "::error::Raw response (first 200 bytes):"
            head -c 200 /tmp/remote-cosign.pub
            exit 1
          fi
          if [ "$local_pem" != "$remote_pem" ]; then
            echo "::error::cosign.pub PEM MISMATCH: in-repo PEM sha=$local_pem vs verbara.io PEM sha=$remote_pem"
            echo "::error::Customers running 'cosign verify --key https://verbara.io/keys/cosign.pub ...' will fail with key mismatch."
            exit 1
          fi
          echo "OK   PEM key at https://verbara.io/keys/cosign.pub matches .github/cosign.pub (PEM sha=$local_pem)"

      - name: Open issue on regression
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Idempotent: only file a new issue if there isn't already an open
          # one with the same title prefix. Avoids spamming on multi-day
          # regressions.
          title="visibility-monitor: ADR-0023 contract violation (visibility, signature, or cosign.pub drift)"
          existing=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq 'length')
          if [ "$existing" -gt 0 ]; then
            echo "open issue already exists; not duplicating"
            exit 0
          fi
          # Body assembled via heredoc to keep every continuation line within
          # the run-block's 10-space indentation — otherwise YAML's literal
          # block scalar terminates at the first column-1 line and the whole
          # workflow file fails to parse (see git log for the 2026-05-23 fix).
          body=$(cat <<EOF
          The daily visibility + signature monitor (\`.github/workflows/visibility-monitor.yml\`) detected that one or more \`ghcr.io/verbara/platform/*\` packages broke the ADR-0023 contract. Check failed in run [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

          ADR-0023 mandates all 5 platform packages (\`api\`, \`realtime\`, \`renderer\`, \`mail\`, \`web\`) be:
          1. Publicly anonymously-pullable, AND
          2. Cosign-signed against \`.github/cosign.pub\`, AND
          3. Verifiable using the customer-facing URL \`https://verbara.io/keys/cosign.pub\`.

          The 3 step names in the failing run identify which dimension regressed:
          - "Assert anonymous docker pull works" → visibility flipped to private.
          - "Assert cosign signatures present" → unsigned push (release.yml bypass), or someone overwrote a signed tag with an unsigned build.
          - "Assert public cosign.pub URL matches in-repo key" → \`verbara-website\` regressed (key removed or replaced).

          Fix by failing dimension:

          **Visibility regression:**
          1. Open https://github.com/orgs/verbara/packages?repo_name=Verbara.Platform
          2. For any package listed as 'Internal' or 'Private', click → Package settings → Change visibility → Public.
          3. Re-run this workflow.

          **Signature regression:**
          1. Re-tag and push (\`git tag v<version> && git push origin v<version>\`) to trigger \`release.yml\` which signs via cosign. Never \`docker buildx push\` directly to \`ghcr.io/verbara/platform/*\` tags — see ADR-0024 for the v2.4.2 anomaly that motivated this check.
          2. If the existing digests are signed but the wrong key was used, rotate \`.github/cosign.pub\` (operator runbook: \`Verbara.Sdk.Pro/docs/operations/2026-05-10-cosign-keypair-bootstrap.md\`).

          **cosign.pub URL drift:**
          1. Verify \`verbara-website/public/keys/cosign.pub\` exists and matches \`Verbara.Platform/.github/cosign.pub\`.
          2. Check CF Workers deployment for \`verbara-website\` succeeded.

          Cross-references: [ADR-0023](docs/decisions/0023-publishing-non-aot-microservices.md), [ADR-0024 (anomaly + hardening)](docs/decisions/0024-v242-shipping-anomaly-and-process-hardening.md), [Deep IP-exposure analysis](docs/research/2026-05-23-pro-ip-exposure-deep-analysis.md).
          EOF
          )
          gh issue create \
            --title "$title" \
            --body "$body"

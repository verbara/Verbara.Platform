# Release workflow: build the Verbara.Platform.Api image, push to ghcr.io, and
# Sigstore-cosign-sign it. Triggered by pushing a `v*` tag (e.g. `v2.0.1`, `v2.3.0`).
#
# Single-pass build (since v2.1.0-rc4): an OCI image cannot self-reference its
# own manifest digest, so the original two-pass build (rc1-rc3) was abandoned
# in favour of operator-side IMAGE_DIGEST env-var injection (ADR-0011 Status
# update of 2026-05-10). The Dockerfile no longer accepts VERBARA_IMAGE_DIGEST.
# This workflow simply builds + pushes + cosign-signs the resulting image.
#
# Layer-B verification (the cosign signature on the OCI image): docker/verbara-verify-image.sh
# Layer-C verification (Pro consumer reads IMAGE_DIGEST env var at runtime):
#   Verbara.Sdk.Pro.Licensing.ContainerImageDigest.ReadFromEnvironment() ->
#   compares against LicenseKey.AuthorizedImageDigests claims.
# Operator wiring of IMAGE_DIGEST: Helm chart api.image.digest value OR
# docker-compose environment block, value sourced from
# verbara-website/data/authorized-digests.json (the registry the issuer Worker
# reads when minting licenses).

name: Release

"on":
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: verbara/platform/api

jobs:
  release:
    name: Build, push, and sign API image
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ -z "$TAG" ]; then
            echo "GITHUB_REF_NAME is empty; cannot derive release tag" >&2
            exit 1
          fi
          echo "release_tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push final image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.release_tag }}
          # NUGET_AUTH_TOKEN — used inside the Dockerfile to authenticate to the
          # GitHub Packages NuGet feed (private Verbara.Sdk.Pro.* packages).
          # We use PACKAGES_PAT (a maintainer-owned PAT with read:packages scope
          # for the verbara org) instead of GITHUB_TOKEN because the auto-
          # provisioned workflow token's package access is gated per-package via
          # "Manage Actions access" — packages pushed to the verbara org are
          # linked by source-repo only (Verbara.Sdk.Pro), not auto-readable by
          # workflows in sibling repos. Granting per-package access for 24+
          # packages via UI is operationally noisy; PAT path is simpler. PAT
          # rotation: every 90d, see operator runbook
          # Verbara.Sdk.Pro/docs/operations/2026-05-10-pro-packages-to-github-packages.md.
          secrets: |
            nuget_auth_token=${{ secrets.PACKAGES_PAT }}
          provenance: false

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          # cosign-installer@v3 currently fails on cosign v3.x because v3 changed
          # the detached-signature distribution model (no more cosign-linux-amd64.sig
          # alongside the binary on GitHub releases — v3 uses bundled Sigstore tlog
          # signatures only). Pin to v2.5.2 (the action's default bootstrap version)
          # which is mature + has the .sig file. ECDSA P-256 PEM keypair generated
          # by cosign v3.0.6 (Phase 0) is fully readable by cosign v2.5.2 — same key
          # format, just different default behaviours around tlog.
          cosign-release: 'v2.5.2'

      - name: Sign final image with cosign
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          # Write the private key to a tmpfs-backed location and clean up immediately
          # after signing.
          umask 077
          KEY_FILE="$(mktemp -t cosign-key.XXXXXX)"
          trap 'shred -u "$KEY_FILE" 2>/dev/null || rm -f "$KEY_FILE"' EXIT
          printf '%s' "$COSIGN_PRIVATE_KEY" > "$KEY_FILE"
          cosign sign \
            --key "$KEY_FILE" \
            --yes \
            --tlog-upload=false \
            "$IMAGE_REF"

      - name: Verify cosign signature against committed public key
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign verify \
            --key .github/cosign.pub \
            --insecure-ignore-tlog \
            "$IMAGE_REF"

      - name: Print final image reference
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          echo "Signed image manifest-list digest: ${{ steps.build.outputs.digest }}"
          echo "Final image reference: $IMAGE_REF"
          echo ""
          echo "Next step: append a new entry to verbara-website's"
          echo "data/authorized-digests.json with manifest_list_digest=${{ steps.build.outputs.digest }}"
          echo "(see docs/operations/2026-05-10-update-authorized-digests-after-release.md)"
          echo ""
          echo "Operator wiring of IMAGE_DIGEST at deploy time:"
          echo "  Helm: --set api.image.digest=${{ steps.build.outputs.digest }}"
          echo "  Compose: environment: IMAGE_DIGEST=${{ steps.build.outputs.digest }}"

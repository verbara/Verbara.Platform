# Release workflow: build the Verbara.Platform images, push to ghcr.io, and
# Sigstore-cosign-sign them. Triggered by pushing a `v*` tag (e.g. `v2.4.1`).
#
# Builds a MATRIX of 4 images on the same Platform tag (ADR-0023):
#   - api       — Native AOT (Dockerfile, runtime-deps). Carries the crown-jewel Pro IP.
#   - realtime  — IL (SignalR can't be AOT). Non-crown-jewel Pro plumbing only (guarded).
#   - renderer  — IL (QuestPDF/ScottPlot). No Pro deps.
#   - mail      — IL (MailKit/Graph). No Pro deps.
# All four are pushed PUBLIC + cosign-signed. The api AND realtime digests BOTH feed the
# Layer-C authorized-digests allow-list: verbara-website's data/authorized-digests.json
# carries ONE `current[]` entry PER IMAGE per version — an api+realtime PAIR for every
# release since v2.5.1 (v2.4.2/v2.4.3 were the last api-only entries). renderer/mail carry
# no Pro licensing code and are not image-bound. The "Authorized-digests reminder" step
# below therefore runs on BOTH the api and the realtime matrix leg, each printing its own
# digest. Recording only one breaks the since-v2.5.1 pair convention, drops the realtime
# digest from every newly issued AuthorizedImageDigests claim, and hides the realtime image
# from digest-reconciliation.yml's drift sweep. NOTE the runtime Layer-C check only fires
# where a digest is readable: the Helm chart injects IMAGE_DIGEST on the api Deployment ONLY
# (realtime is digest-PINNED, not digest-BOUND), so ContainerImageDigest.ReadFromEnvironment()
# returns null in realtime and LicenseValidator takes its documented permissive path.
#
# Single-pass build (since v2.1.0-rc4): an OCI image cannot self-reference its own
# manifest digest, so digest injection is operator-side (Pro/ADR-0011 Status update 2026-05-10).
# Layer-B verification (cosign signature): docker/verbara-verify-image.sh
# Layer-C verification (Pro reads IMAGE_DIGEST env at runtime):
#   Verbara.Sdk.Pro.Licensing.ContainerImageDigest.ReadFromEnvironment() -> compares against
#   LicenseKey.AuthorizedImageDigests. Operator wiring sourced from
#   verbara-website/data/authorized-digests.json (issuer Worker reads it when minting licenses).

name: Release

"on":
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io

jobs:
  release:
    name: Build, push, and sign ${{ matrix.name }} image
    runs-on: ubuntu-24.04
    outputs:
      # Consumed by the `github-release` and `smoke` jobs. Every matrix leg
      # computes this from the same tag annotation, so the last-writer-wins
      # semantics of matrix job outputs are harmless here — all four legs write
      # the identical value.
      retro_skip: ${{ steps.retro.outputs.skip }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: ./Dockerfile
          - name: realtime
            dockerfile: src/Verbara.Platform.Realtime/Dockerfile.realtime
          - name: renderer
            dockerfile: src/Verbara.Platform.Renderer/Dockerfile.renderer
          - name: mail
            dockerfile: src/Verbara.Platform.Mail/Dockerfile.mail
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          # fetch-depth: 0 so we can read the annotated tag message in the
          # retroactive-tag guard below. Default depth=1 has no tag annotations.
          fetch-depth: 0

      - name: Check for retroactive-tag marker (ADR-0024)
        id: retro
        # Retroactive tags carry the literal marker `RETROACTIVE-TAG` in their
        # annotated message. When present, all subsequent build/push/sign/verify
        # steps are skipped — the registry tag was produced via an alternate
        # path (e.g. direct `docker buildx push` from a maintainer machine,
        # documented in ADR-0024 §v2.4.2 anomaly) and re-running this workflow
        # would overwrite the existing image digest, breaking Layer C image-
        # binding for every customer that already pulled the original digest.
        #
        # To use:
        #   git tag -a v2.4.2 <commit> -m "RETROACTIVE-TAG: rationale + digests"
        #   git push origin v2.4.2
        # This workflow then fires, sees the marker, exits cleanly with a
        # notice annotation, and ghcr.io is untouched.
        #
        # Normal releases get no marker and follow the original build-and-sign
        # path. The guard is backward-compatible.
        run: |
          set -euo pipefail
          annotation=$(git for-each-ref --format='%(contents)' "refs/tags/${GITHUB_REF_NAME}" 2>/dev/null || true)
          if printf '%s' "$annotation" | grep -qF 'RETROACTIVE-TAG'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Retroactive tag ${GITHUB_REF_NAME} detected — skipping build/push/sign/verify."
            echo "::notice::Existing ghcr.io digest preserved. Tag annotation:"
            printf '%s' "$annotation" | sed 's/^/  /'
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve release tag
        if: steps.retro.outputs.skip != 'true'
        id: tag
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [ -z "$TAG" ]; then
            echo "GITHUB_REF_NAME is empty; cannot derive release tag" >&2
            exit 1
          fi
          echo "release_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image_name=verbara/platform/${{ matrix.name }}" >> "$GITHUB_OUTPUT"

          # Provenance build-args (stamp-ci-image-provenance). All three derive from the
          # TAG, never from wall-clock, so the four matrix legs stamp identical values and
          # a re-run stamps the same ones:
          #   vcs_ref    = full SHA of the commit the tag points to (`^{commit}` derefs an
          #                annotated tag to its commit; a lightweight tag already is one)
          #   version    = the tag verbatim, the same string as the image tag
          #   build_date = the tag's creatordate in UTC (a lightweight tag yields the
          #                commit date) — the same rule `released_at` uses below
          # The tag ref is expected locally (fetch-depth: 0); if it is not, fall back to
          # GITHUB_SHA (the tagged commit on a tag push), which is still a real commit SHA.
          VCS_REF="$(git rev-parse --verify --quiet "refs/tags/${TAG}^{commit}" || true)"
          BUILD_DATE="$(TZ=UTC git for-each-ref \
            --format='%(creatordate:format-local:%Y-%m-%dT%H:%M:%SZ)' "refs/tags/${TAG}" || true)"
          if [ -z "$VCS_REF" ]; then
            echo "::warning::refs/tags/${TAG} not found locally; stamping revision from GITHUB_SHA"
            VCS_REF="${GITHUB_SHA}"
          fi
          if [ -z "$BUILD_DATE" ]; then
            BUILD_DATE="$(TZ=UTC git log -1 --format='%cd' \
              --date=format-local:%Y-%m-%dT%H:%M:%SZ "$VCS_REF" || true)"
          fi
          # Validate before any build (fail-release-on-missing-image-provenance): a full
          # 40-hex SHA, the version equal to the tag, an RFC 3339 date. There is no
          # `unknown` fallback any more: the provenance gate compares the image labels
          # against these values, so they must never be placeholders themselves.
          python3 scripts/check-image-provenance.py inputs \
            --revision "$VCS_REF" --version "$TAG" --created "$BUILD_DATE" \
            --ref-name "$GITHUB_REF_NAME"
          {
            echo "vcs_ref=${VCS_REF}"
            echo "version=${TAG}"
            echo "build_date=${BUILD_DATE}"
          } >> "$GITHUB_OUTPUT"
          echo "Provenance: revision=${VCS_REF} version=${TAG} created=${BUILD_DATE}"

      - name: Set up Docker Buildx
        if: steps.retro.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GitHub Container Registry
        if: steps.retro.outputs.skip != 'true'
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Provenance gate (fail-release-on-missing-image-provenance). The image is first built
      # with load: true and no push, under a gate-only local tag that matches no registry
      # name; the gate step reads its labels from the runner's daemon and refuses the leg
      # unless revision, version and created EQUAL the resolved values. Only then does
      # `Build and push final image` run: a second invocation served from this builder's
      # cache, which keeps `id: build` so its digest still feeds sign, verify and print.
      # The gate proves the build-args land in the labels; it does not byte-verify the
      # pushed digest, which is why the post-push print step still reads the registry.
      - name: Build final image for the provenance gate (load only, no push)
        if: steps.retro.outputs.skip != 'true'
        id: gatebuild
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: verbara-provenance-gate/${{ matrix.name }}:${{ steps.tag.outputs.release_tag }}
          secrets: |
            nuget_auth_token=${{ secrets.PACKAGES_PAT }}
          build-args: |
            VCS_REF=${{ steps.tag.outputs.vcs_ref }}
            VERSION=${{ steps.tag.outputs.version }}
            BUILD_DATE=${{ steps.tag.outputs.build_date }}
          provenance: false

      - name: Gate on image provenance labels (before push)
        # Fails closed. class=unstamped (a label absent, empty, `unknown` or different): the
        # cause is at the tag and a re-run replays it, so fix on main and cut a new tag.
        # class=unverifiable (labels unreadable): re-run the failed leg.
        if: steps.retro.outputs.skip != 'true'
        env:
          GATE_IMAGE: verbara-provenance-gate/${{ matrix.name }}:${{ steps.tag.outputs.release_tag }}
          EXPECTED_REVISION: ${{ steps.tag.outputs.vcs_ref }}
          EXPECTED_VERSION: ${{ steps.tag.outputs.version }}
          EXPECTED_CREATED: ${{ steps.tag.outputs.build_date }}
        run: |
          set -euo pipefail
          python3 scripts/check-image-provenance.py gate \
            --image "$GATE_IMAGE" \
            --revision "$EXPECTED_REVISION" \
            --version "$EXPECTED_VERSION" \
            --created "$EXPECTED_CREATED"

      - name: Build and push final image
        if: steps.retro.outputs.skip != 'true'
        id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.tag.outputs.image_name }}:${{ steps.tag.outputs.release_tag }}
          # NUGET_AUTH_TOKEN authenticates to the private GitHub Packages NuGet feed
          # (Verbara.Sdk.Pro.* packages). Needed by api + realtime (Pro deps); harmless
          # for renderer/mail (their Dockerfiles don't mount it). PACKAGES_PAT = maintainer
          # PAT with read:packages (workflow GITHUB_TOKEN isn't auto-readable for sibling-repo
          # packages). Rotation 90d — see Verbara.Sdk.Pro/docs/operations/2026-05-10-*.md.
          secrets: |
            nuget_auth_token=${{ secrets.PACKAGES_PAT }}
          # OCI provenance labels (org.opencontainers.image.*): every Dockerfile in the
          # matrix declares these ARGs in its final stage, default `unknown`.
          build-args: |
            VCS_REF=${{ steps.tag.outputs.vcs_ref }}
            VERSION=${{ steps.tag.outputs.version }}
            BUILD_DATE=${{ steps.tag.outputs.build_date }}
          provenance: false

      - name: Install cosign
        if: steps.retro.outputs.skip != 'true'
        uses: sigstore/cosign-installer@v4.1.2
        with:
          # Pin v3.0.6 — matches the maintainer-side cosign on local builds.
          # The prior comment claimed "cosign v3.x changes break the installer
          # action's bootstrap"; in practice sigstore/cosign-installer@v4.1.2 has
          # supported cosign v3.x cleanly since installer v3.5+. The 2026-05-23
          # v2.4.2 anomaly traced (in part) to the v2.5.2 ↔ v3.0.6 verify
          # incompat — see ADR-0024 §Process Hardening. Keep cosign aligned
          # cross-context (release.yml + visibility-monitor.yml + digest-
          # reconciliation.yml + maintainer-local) at v3.0.6.
          cosign-release: 'v3.0.6'

      - name: Sign final image with cosign
        if: steps.retro.outputs.skip != 'true'
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          IMAGE_REF: ${{ env.REGISTRY }}/${{ steps.tag.outputs.image_name }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          umask 077
          KEY_FILE="$(mktemp -t cosign-key.XXXXXX)"
          SIGNING_CONFIG="$(mktemp -t signing-config.XXXXXX).json"
          trap 'shred -u "$KEY_FILE" "$SIGNING_CONFIG" 2>/dev/null || rm -f "$KEY_FILE" "$SIGNING_CONFIG"' EXIT
          printf '%s' "$COSIGN_PRIVATE_KEY" > "$KEY_FILE"
          # Verbara's signing posture skips Rekor (the public transparency log).
          # In cosign v2.x this was a simple `--tlog-upload=false` flag. cosign
          # v3.x deprecated that flag and now requires either signing-config
          # discipline or an explicit `--signing-config <file>` whose
          # rekorTlogUrls field is empty. We generate that file inline from the
          # public sigstore signing-config (v0.2 schema) with the rekorTlogUrls
          # array stripped via jq. See cosign v3.x release notes + ADR-0024
          # §"Cosign v3 signing-config requirement" for the full migration trail.
          curl -fsSL https://raw.githubusercontent.com/sigstore/root-signing/refs/heads/main/targets/signing_config.v0.2.json \
            | jq 'del(.rekorTlogUrls)' > "$SIGNING_CONFIG"
          # Retry to tolerate the ghcr push→HEAD manifest-propagation race: cosign
          # signs by digest, and a just-pushed manifest can briefly 404 on the HEAD
          # lookup before ghcr finishes propagating it (observed signing 3/4 images
          # in the v2.12.0 run). The `if` condition is exempt from `set -e`.
          signed=false
          for attempt in 1 2 3 4 5; do
            if cosign sign \
                 --key "$KEY_FILE" \
                 --yes \
                 --signing-config "$SIGNING_CONFIG" \
                 "$IMAGE_REF"; then
              signed=true
              break
            fi
            echo "::warning::cosign sign attempt ${attempt} failed (likely ghcr manifest propagation); retrying in $((attempt * 5))s..."
            sleep $((attempt * 5))
          done
          if [ "$signed" != "true" ]; then
            echo "::error::cosign sign failed after 5 attempts for $IMAGE_REF"
            exit 1
          fi

      - name: Verify cosign signature against committed public key
        if: steps.retro.outputs.skip != 'true'
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ steps.tag.outputs.image_name }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign verify \
            --key .github/cosign.pub \
            --insecure-ignore-tlog \
            "$IMAGE_REF"

      - name: Print final image reference
        if: steps.retro.outputs.skip != 'true'
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ steps.tag.outputs.image_name }}@${{ steps.build.outputs.digest }}
        run: |
          echo "Signed ${{ matrix.name }} manifest-list digest: ${{ steps.build.outputs.digest }}"
          echo "Final image reference: $IMAGE_REF"

      - name: Print image provenance labels
        # Prints the org.opencontainers.image.* labels the registry holds for the digest
        # this leg just pushed, so the release log shows what every image carries.
        # PRINT-ONLY by design: it must never red a release whose image is already pushed
        # and signed. The gate that refuses an unverified image is `Gate on image provenance
        # labels (before push)`; this step is the registry-side evidence of what was actually
        # published, and warns when it differs from the resolved revision, version or created.
        if: steps.retro.outputs.skip != 'true'
        continue-on-error: true
        env:
          IMAGE_KIND: ${{ matrix.name }}
          IMAGE_REF: ${{ env.REGISTRY }}/${{ steps.tag.outputs.image_name }}@${{ steps.build.outputs.digest }}
          EXPECTED_REVISION: ${{ steps.tag.outputs.vcs_ref }}
          EXPECTED_VERSION: ${{ steps.tag.outputs.version }}
          EXPECTED_CREATED: ${{ steps.tag.outputs.build_date }}
        # bash without -e (GitHub's default shell adds it): a failed jq or inspect must still print a line.
        shell: bash {0}
        run: |
          # No `set -e`: every path below ends in `exit 0`.
          set -u
          if ! config="$(docker buildx imagetools inspect "$IMAGE_REF" --format '{{json .Image}}' 2>&1)"; then
            echo "::warning::[${IMAGE_KIND}] could not inspect ${IMAGE_REF}: ${config}"
            exit 0
          fi
          # `.Image` is the image config for a single-platform manifest, or a map of
          # platform -> config for an index; read the labels from either shape,
          # preferring linux/amd64 and skipping entries without labels.
          labels="$(printf '%s' "$config" | jq -c '
            if has("config") then (.config.Labels // {})
            else (.["linux/amd64"].config.Labels // ([.[] | .config.Labels // empty] | first) // {})
            end' 2>/dev/null || echo '{}')"
          [ -n "$labels" ] || labels='{}'
          label() { printf '%s' "$labels" | jq -r --arg k "org.opencontainers.image.$1" '.[$k] // "(absent)"' 2>/dev/null || echo '(unreadable)'; }
          revision="$(label revision)"
          version="$(label version)"
          created="$(label created)"
          echo "[${IMAGE_KIND}] image    = ${IMAGE_REF}"
          echo "[${IMAGE_KIND}] revision = ${revision}"
          echo "[${IMAGE_KIND}] version  = ${version}"
          echo "[${IMAGE_KIND}] created  = ${created}"
          if [ "$revision" != "$EXPECTED_REVISION" ]; then
            echo "::warning::[${IMAGE_KIND}] org.opencontainers.image.revision is ${revision}, expected ${EXPECTED_REVISION}, on ${IMAGE_REF}"
          fi
          if [ "$version" != "$EXPECTED_VERSION" ]; then
            echo "::warning::[${IMAGE_KIND}] org.opencontainers.image.version is ${version}, expected ${EXPECTED_VERSION}, on ${IMAGE_REF}"
          fi
          if [ "$created" != "$EXPECTED_CREATED" ]; then
            echo "::warning::[${IMAGE_KIND}] org.opencontainers.image.created is ${created}, expected ${EXPECTED_CREATED}, on ${IMAGE_REF}"
          fi
          {
            echo "#### Provenance — \`${IMAGE_KIND}\`"
            echo
            echo "| revision | version | created |"
            echo "|---|---|---|"
            echo "| \`${revision}\` | \`${version}\` | \`${created}\` |"
            echo
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}" || true
          exit 0

      - name: Hand this leg's digest to the release-notes job
        # A matrix job cannot pass a PER-LEG value downstream through `outputs` —
        # all four legs write the same key and last-writer-wins collapses them to
        # one. So each leg drops its digest in an artifact and the `github-release`
        # job collects all four. Best-effort by design: the release-notes job
        # degrades to a link if any of these are missing, so a hiccup here can
        # never red a release whose images are already pushed and signed.
        if: steps.retro.outputs.skip != 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p digests
          printf '%s\n' "$DIGEST" > "digests/${{ matrix.name }}.txt"

      - name: Upload this leg's digest
        if: steps.retro.outputs.skip != 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-digest-${{ matrix.name }}
          path: digests/${{ matrix.name }}.txt
          retention-days: 1

      # Fires on BOTH image-bound legs (api + realtime). verbara-website's
      # data/authorized-digests.json stores one `current[]` entry PER IMAGE per version, so a
      # release needs TWO entries; before v2.22.0 this step ran only on `api` and the operator
      # had to hand-dig realtime's digest out of the other matrix job's log every release.
      # Each leg prints ONLY its own digest — the image name is on every line, and the
      # copy-paste block below is echoed into the run's Step Summary so both legs land on one
      # page instead of two logs. renderer/mail are not image-bound (no Pro licensing code).
      - name: Authorized-digests reminder (api + realtime)
        # Informational only — must never red a release whose image is already pushed+signed.
        continue-on-error: true
        if: steps.retro.outputs.skip != 'true' && (matrix.name == 'api' || matrix.name == 'realtime')
        env:
          IMAGE_KIND: ${{ matrix.name }}
          RELEASE_TAG: ${{ steps.tag.outputs.release_tag }}
          IMAGE_REF_TAGGED: ${{ env.REGISTRY }}/${{ steps.tag.outputs.image_name }}:${{ steps.tag.outputs.release_tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [ "${IMAGE_KIND}" = "api" ]; then OTHER_KIND="realtime"; else OTHER_KIND="api"; fi
          # `released_at` is derived from the TAG, not from wall-clock, so both matrix legs
          # emit the SAME timestamp — the two entries for one version must not disagree
          # (the issuer sorts `current` by released_at DESC). NOTE this is the tag/commit
          # time, NOT the run-completion time every pre-v2.22.0 entry recorded (a LIGHTWEIGHT
          # tag yields the tagged commit's date, which can be hours earlier) — see the
          # runbook's Step Summary note before pasting. Fallback keeps this
          # informational step from ever failing the release.
          RELEASED_AT="$(TZ=UTC git for-each-ref \
            --format='%(creatordate:format-local:%Y-%m-%dT%H:%M:%SZ)' \
            "refs/tags/${GITHUB_REF_NAME}" 2>/dev/null || true)"
          if [ -z "${RELEASED_AT}" ]; then RELEASED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"; fi

          echo "[${IMAGE_KIND}] Next step — Layer-C image-binding for the '${IMAGE_KIND}' image:"
          echo "[${IMAGE_KIND}] append ONE entry to verbara-website data/authorized-digests.json 'current'."
          echo "[${IMAGE_KIND}] This leg covers the '${IMAGE_KIND}' entry ONLY. The '${OTHER_KIND}' leg of this"
          echo "[${IMAGE_KIND}] same matrix prints its own, DIFFERENT digest — this release needs BOTH."
          echo "[${IMAGE_KIND}]   platform_version     = ${RELEASE_TAG}"
          echo "[${IMAGE_KIND}]   image_ref            = ${IMAGE_REF_TAGGED}"
          echo "[${IMAGE_KIND}]   manifest_list_digest = ${DIGEST}"
          echo "[${IMAGE_KIND}]   released_at          = ${RELEASED_AT}"
          echo "[${IMAGE_KIND}] (see docs/operations/2026-05-10-update-authorized-digests-after-release.md)"
          echo "[${IMAGE_KIND}] Operator deploy: Helm --set ${IMAGE_KIND}.image.digest=${DIGEST}"
          if [ "${IMAGE_KIND}" = "api" ]; then
            echo "[api] Compose: IMAGE_DIGEST=${DIGEST} — the api Deployment/compose service also"
            echo "[api] injects IMAGE_DIGEST at runtime; realtime is digest-pinned only."
          fi

          # Step Summary: both legs append to the SAME run summary page, so the operator reads
          # ONE place and gets the full api+realtime pair, instead of digging the second digest
          # out of the other matrix job's log.
          {
            echo "### authorized-digests entry — \`${IMAGE_KIND}\` @ \`${RELEASE_TAG}\`"
            echo
            echo "Append to \`verbara-website/data/authorized-digests.json\` → \`current\`."
            echo "**This release needs BOTH the \`api\` and the \`realtime\` entry** — the"
            echo "\`${OTHER_KIND}\` block is elsewhere on this same summary page."
            echo
            echo '```json'
            echo "{"
            echo "  \"platform_version\": \"${RELEASE_TAG}\","
            echo "  \"image_ref\": \"${IMAGE_REF_TAGGED}\","
            echo "  \"manifest_list_digest\": \"${DIGEST}\","
            echo "  \"released_at\": \"${RELEASED_AT}\""
            echo "}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # GitHub Release object. Until this job landed (#207, 2026-07-28),
  # `release.yml` built and cosign-signed the images but never created the Release
  # object, so every version reopened the gap — `v2.18.0` shipped tagged + signed
  # but release-less and was backfilled by hand on 2026-07-12 after an
  # `/xr:pending` fact-check. Mirrors Verbara.Platform.Web's `release.yml`
  # (Web #246) and Sdk.Pro's in-workflow `gh release create`.
  #
  # A SEPARATE job, not a matrix step: the `release` job fans out over 4 images,
  # so a step there would race four ways for one Release object.
  github-release:
    name: Create GitHub Release
    needs: release
    # `needs.release.result` is 'success' only when EVERY image leg built, signed
    # and verified — `fail-fast: false` means a partial failure still leaves the
    # aggregate non-success. A Release object must never advertise a version whose
    # image set is incomplete. A retroactive tag (ADR-0024) built nothing in this
    # run, so it does not get an auto-created Release either.
    if: needs.release.result == 'success' && needs.release.outputs.retro_skip != 'true'
    runs-on: ubuntu-24.04
    permissions:
      # Scoped to this job — the workflow default stays `contents: read`.
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Collect the image digests
        # One artifact per matrix leg (see "Hand this leg's digest…" above).
        # `continue-on-error` because the release notes must still be created if
        # the digests cannot be collected — the body degrades to a link to the run
        # rather than failing a release whose images are already pushed and signed.
        id: digests
        continue-on-error: true
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: release-digest-*
          merge-multiple: true
          path: digests

      - name: Create GitHub Release
        # Idempotent: `/xr:release` §H may already have created a themed Release
        # for this tag (its title carries the release theme, which this workflow
        # cannot know). If one exists, leave it alone — never overwrite an
        # operator-authored body with the generated one.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release object for $TAG already exists — leaving it untouched."
            exit 0
          fi

          VERSION="${TAG#v}"
          NOTES_FILE="$(mktemp)"

          # This version's own CHANGELOG section: everything between its heading
          # (`## [2.22.0] - 2026-07-27`) and the next `## [` heading.
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { grab = 1; next }
            grab && /^## \[/       { exit }
            grab                   { print }
          ' CHANGELOG.md > "$NOTES_FILE"

          if [ ! -s "$NOTES_FILE" ]; then
            echo "::warning::No CHANGELOG.md section found for [$VERSION] — falling back to a pointer body."
            printf 'See [`CHANGELOG.md`](https://github.com/%s/blob/main/CHANGELOG.md) for this release.\n' \
              "$GITHUB_REPOSITORY" > "$NOTES_FILE"
          fi

          # Drop trailing blank lines and any horizontal rule the section ended on,
          # so the footer below contributes the only `---` in the body.
          awk '{ line[NR] = $0 }
               END { last = NR
                     while (last > 0 && (line[last] ~ /^[[:space:]]*$/ || line[last] == "---")) last--
                     for (i = 1; i <= last; i++) print line[i] }' "$NOTES_FILE" > "${NOTES_FILE}.trimmed"
          mv "${NOTES_FILE}.trimmed" "$NOTES_FILE"

          # Digest table, one row per image, from the artifacts the matrix legs
          # uploaded. Every row is emitted only if its file is present, and the
          # whole table is skipped if none are — collection is best-effort, so a
          # release whose images are pushed and signed still gets its Release
          # object, just with a link to the run instead of the table.
          {
            printf '\n---\n\n'
            printf 'Signed images (linux/amd64), all four cosign-signed with the same key:\n\n'
            printf '| Image | Pinned tag | Manifest digest |\n'
            printf '|---|---|---|\n'
            rows=0
            for kind in api realtime renderer mail; do
              ref="$REGISTRY/verbara/platform/$kind:$TAG"
              if [ -f "digests/${kind}.txt" ]; then
                digest="$(tr -d '[:space:]' < "digests/${kind}.txt")"
                printf '| `%s` | `%s` | `%s` |\n' "$kind" "$ref" "$digest"
                rows=$((rows + 1))
              else
                printf '| `%s` | `%s` | _(see [run log](%s/%s/actions/runs/%s))_ |\n' \
                  "$kind" "$ref" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
              fi
            done
            if [ "$rows" -eq 0 ]; then
              echo "::warning::No digest artifacts collected — release notes fall back to the run log." >&2
            fi
            printf '\nPull by digest for absolute reproducibility, or verify any tag reference:\n\n'
            printf '    cosign verify --key https://verbara.io/keys/cosign.pub --insecure-ignore-tlog \\\n'
            printf '      %s/verbara/platform/api:%s\n\n' "$REGISTRY" "$TAG"
            printf 'The `api` + `realtime` pair is also published in '
            printf '[verbara-website `data/authorized-digests.json`](https://github.com/verbara/verbara-website/blob/main/data/authorized-digests.json) '
            printf '(Pro license image binding, ADR-0023 Layer C).\n'
          } >> "$NOTES_FILE"

          # Claim the `Latest` badge only when this really is the highest version
          # tag, so a hotfix cut on an older line cannot steal it from a newer
          # minor. Tags come from the API — this checkout is shallow.
          HIGHEST="$(gh api "repos/${GITHUB_REPOSITORY}/tags" --paginate -q '.[].name' | sort -V | tail -1)"
          if [ "$HIGHEST" = "$TAG" ]; then LATEST=true; else LATEST=false; fi
          echo "highest tag=$HIGHEST · this tag=$TAG · --latest=$LATEST"

          gh release create "$TAG" \
            --verify-tag \
            --latest="$LATEST" \
            --title "$TAG" \
            --notes-file "$NOTES_FILE"

  # Post-release FUNCTIONAL smoke (openspec/changes/archive/2026-07-05-released-image-smoke).
  # verbara-verify-image.sh / the "Verify cosign signature" step above prove
  # PROVENANCE only. This job is the next gate: it boots the just-released
  # api image (re-resolved by tag straight from ghcr.io — no matrix-output
  # plumbing needed since `release` is a matrix job) and runs ONE real
  # end-to-end journey against Postgres via docker/verbara-smoke-released.sh.
  #
  # `needs: release` waits for ALL 4 matrix legs (api/realtime/renderer/mail)
  # to finish, even though the smoke journey only exercises the api image —
  # a release isn't "done" until every image in the matrix has pushed, and a
  # smoke run against a half-published release would be misleading.
  #
  # GATING (no continue-on-error) — promoted by promote-community-smoke-to-gating,
  # discharging Verbara.Sdk.Pro/ADR-0017 follow-up task 3.2. It was report-only
  # until then, and report-only hid a real defect: the smoke concluded `failure`
  # on v2.20.0, v2.21.0 and v2.21.1 (the permanently-503 community boot that
  # Verbara.Sdk.Pro/ADR-0017 fixed) while all three workflow runs said `success`.
  # The pre-condition — the sharpened community-boot assertion green TWICE
  # CONSECUTIVELY against images carrying the fix — held from v2.21.2 on.
  #
  # The whole journey gates, not one assertion: there is no separable
  # "community leg" — one step runs one script, and every exit path of it
  # (journey failed / setup error / readiness timeout) reds the run.
  #
  # What a red smoke MEANS: "this released image set is functionally
  # unverified". What it does NOT do: un-publish or un-sign anything — the
  # push and the cosign signature already completed inside the `release` job.
  # Nothing declares `needs: smoke`, on purpose: making `github-release` wait on
  # it would turn any smoke setup error or timeout into a tag pushed, signed and
  # RELEASE-LESS again (the v2.18.0 incident the `github-release` job exists to
  # prevent) — a silent absence is worse than a loud red. The value of gating
  # is the durable `failure` conclusion bound to the tag; re-run the job in
  # place once the cause is understood. The one irreversible downstream act a
  # red smoke must stop is human: registering the release's digests in
  # verbara-website — see the stop condition in
  # docs/operations/2026-05-10-update-authorized-digests-after-release.md.
  #
  # A retroactive tag (ADR-0024) builds, pushes and signs nothing, so the smoke
  # is skipped on it exactly like `github-release` — otherwise a gating smoke
  # would red a run whose contract is to be a clean no-op.
  smoke:
    name: Post-release functional smoke
    needs: release
    if: always() && needs.release.result == 'success' && needs.release.outputs.retro_skip != 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: 'v3.0.6'

      - name: Run released-image smoke journey
        run: |
          chmod +x docker/verbara-smoke-released.sh
          ./docker/verbara-smoke-released.sh --tag "${GITHUB_REF_NAME}"

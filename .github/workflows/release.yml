# Release workflow: build the Verbara.Platform images, push to ghcr.io, and
# Sigstore-cosign-sign them. Triggered by pushing a `v*` tag (e.g. `v2.4.1`).
#
# Builds a MATRIX of 4 images on the same Platform tag (ADR-0023):
#   - api       — Native AOT (Dockerfile, runtime-deps). Carries the crown-jewel Pro IP.
#   - realtime  — IL (SignalR can't be AOT). Non-crown-jewel Pro plumbing only (guarded).
#   - renderer  — IL (QuestPDF/ScottPlot). No Pro deps.
#   - mail      — IL (MailKit/Graph). No Pro deps.
# All four are pushed PUBLIC + cosign-signed. Only the api image's digest feeds the
# Layer-C authorized-digests allow-list (image-binding is API-only).
#
# Single-pass build (since v2.1.0-rc4): an OCI image cannot self-reference its own
# manifest digest, so digest injection is operator-side (ADR-0011 Status update 2026-05-10).
# Layer-B verification (cosign signature): docker/verbara-verify-image.sh
# Layer-C verification (Pro reads IMAGE_DIGEST env at runtime):
#   Verbara.Sdk.Pro.Licensing.ContainerImageDigest.ReadFromEnvironment() -> compares against
#   LicenseKey.AuthorizedImageDigests. Operator wiring sourced from
#   verbara-website/data/authorized-digests.json (issuer Worker reads it when minting licenses).

name: Release

"on":
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io

jobs:
  release:
    name: Build, push, and sign ${{ matrix.name }} image
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: ./Dockerfile
          - name: realtime
            dockerfile: src/Verbara.Platform.Realtime/Dockerfile.realtime
          - name: renderer
            dockerfile: src/Verbara.Platform.Renderer/Dockerfile.renderer
          - name: mail
            dockerfile: src/Verbara.Platform.Mail/Dockerfile.mail
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ -z "$TAG" ]; then
            echo "GITHUB_REF_NAME is empty; cannot derive release tag" >&2
            exit 1
          fi
          echo "release_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image_name=verbara/platform/${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push final image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.tag.outputs.image_name }}:${{ steps.tag.outputs.release_tag }}
          # NUGET_AUTH_TOKEN authenticates to the private GitHub Packages NuGet feed
          # (Verbara.Sdk.Pro.* packages). Needed by api + realtime (Pro deps); harmless
          # for renderer/mail (their Dockerfiles don't mount it). PACKAGES_PAT = maintainer
          # PAT with read:packages (workflow GITHUB_TOKEN isn't auto-readable for sibling-repo
          # packages). Rotation 90d — see Verbara.Sdk.Pro/docs/operations/2026-05-10-*.md.
          secrets: |
            nuget_auth_token=${{ secrets.PACKAGES_PAT }}
          provenance: false

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          # Pin v2.5.2: cosign-installer@v3 fails on cosign v3.x (changed detached-sig
          # distribution). The ECDSA P-256 PEM keypair is readable by v2.5.2.
          cosign-release: 'v2.5.2'

      - name: Sign final image with cosign
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          IMAGE_REF: ${{ env.REGISTRY }}/${{ steps.tag.outputs.image_name }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          umask 077
          KEY_FILE="$(mktemp -t cosign-key.XXXXXX)"
          trap 'shred -u "$KEY_FILE" 2>/dev/null || rm -f "$KEY_FILE"' EXIT
          printf '%s' "$COSIGN_PRIVATE_KEY" > "$KEY_FILE"
          cosign sign \
            --key "$KEY_FILE" \
            --yes \
            --tlog-upload=false \
            "$IMAGE_REF"

      - name: Verify cosign signature against committed public key
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ steps.tag.outputs.image_name }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign verify \
            --key .github/cosign.pub \
            --insecure-ignore-tlog \
            "$IMAGE_REF"

      - name: Print final image reference
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ steps.tag.outputs.image_name }}@${{ steps.build.outputs.digest }}
        run: |
          echo "Signed ${{ matrix.name }} manifest-list digest: ${{ steps.build.outputs.digest }}"
          echo "Final image reference: $IMAGE_REF"

      - name: Authorized-digests reminder (API only)
        if: matrix.name == 'api'
        run: |
          echo "Next step (API image only — Layer C image-binding):"
          echo "append a new entry to verbara-website's data/authorized-digests.json with"
          echo "manifest_list_digest=${{ steps.build.outputs.digest }}"
          echo "(see docs/operations/2026-05-10-update-authorized-digests-after-release.md)"
          echo "Operator deploy: Helm --set api.image.digest=${{ steps.build.outputs.digest }}  |  Compose IMAGE_DIGEST=..."
